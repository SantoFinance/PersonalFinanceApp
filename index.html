<style>
:root {
  --color-primary: #45828B;
  --color-heading: #055B65;
  --color-border: #E0E5E9;
  --color-border-light: #B2C9C5;
  --color-bg-tint: #F6FAFA;
  --color-success: #1BD488;
  --color-danger: #B4483A;
  --color-danger-border: #EAC4BC;
  --color-danger-bg: #FBEEEC;
  --color-warning: #93720B;
  --color-warning-bg: #FEFBF1;
  --color-warning-border: #F9E7AE;
  --color-spend: #C95A5A;
  --color-spend-bg: #FAEEEE;
}
* { box-sizing: border-box; }
.section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary); font-weight: 600; }
.btn-primary { border: none; background: var(--color-heading); color: #FFFFFF; font-weight: 600; cursor: pointer; }
.btn-danger-outline { width: 100%; padding: 11px 0; border-radius: var(--radius-sm); border: 1px solid var(--color-danger); background: #FFFFFF; color: var(--color-danger); font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
.btn-outline { border: 1px solid var(--color-border); background: #FFFFFF; color: var(--color-primary); cursor: pointer; }
.btn-outline-strong { border: 1px solid var(--color-border); background: #FFFFFF; color: var(--color-heading); font-weight: 600; cursor: pointer; }
.btn-icon { background: none; border: none; cursor: pointer; display: flex; align-items: center; }
.input-field { width: 100%; padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); font-size: 15px; background: #FFFFFF; }
.input-field-lg { width: 100%; padding: 10px 12px; border-radius: var(--radius-ms); border: 1px solid var(--color-border); font-size: 16px; margin-bottom: 14px; }
.input-month { display: block; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; box-sizing: border-box; padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); font-size: 15px; color: var(--color-heading); background: #FFFFFF; }
.select-field { width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--color-border); font-size: 16px; color: var(--color-heading); background: #FFFFFF; }
.card-item { display: flex; align-items: center; padding: 11px 16px; border-radius: var(--radius-xl); background: var(--color-bg-tint); }
.card-item-icon { width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--color-bg-tint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.asset-list-card {

const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const PERIODS = [

function monthKeyFromIdx(idx) {
  const y = Math.floor(idx / 12);
  const m = ((idx % 12) + 12) % 12;
  return `${y}-${String(m + 1).padStart(2, "0")}`;
}
function monthKeyToIdx(k) {
  const [y, m] = k.split("-").map(Number);
  return y * 12 + (m - 1);
}
function yy(year) {
  return String(year).slice(-2);
}
function periodLabel(periodMode, cursor) {
  if (periodMode === "month") return `${MESI[cursor.month]} ${yy(cursor.year)}`;
  if (periodMode === "quarter" || periodMode === "semester" || periodMode === "year") {
    const months = periodMode === "quarter" ? 3 : periodMode === "semester" ? 6 : 12;
    const startIdx = cursor.year * 12 + cursor.month - (months - 1);
    const startYear = Math.floor(startIdx / 12);
    const startMonth = ((startIdx % 12) + 12) % 12;
    if (startYear === cursor.year) return `${MESI[startMonth].slice(0, 3)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
    return `${MESI[startMonth].slice(0, 3)} ${yy(startYear)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
  }
  if (periodMode === "ytd") return `Gen–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
}

function fmtEUR(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 0, useGrouping: true }).format(n);

function fmtPct(p) {
  return `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;
}

function Sparkline({ values, color = "var(--color-primary)", width = 82, height = 34, style, endLabel = null, endLabelColor = null }) {
  if (!values || values.length < 2) return null;
  const cleanValues = values.filter((v) => Number.isFinite(v));
  if (cleanValues.length < 2) return null;

  const labelBand = endLabel ? 13 : 0;
  const chartTop = 3 + labelBand;
  const chartBottom = height - 3;
  const minValue = Math.min(...cleanValues);
  const maxValue = Math.max(...cleanValues);
  const rawRange = maxValue - minValue;
  const scalePad = rawRange > 0 ? rawRange * 0.18 : Math.max(Math.abs(maxValue) * 0.06, 1);
  const min = minValue - scalePad;
  const max = maxValue + scalePad;
  const range = max - min || 1;
  const graphWidth = width - 2;
  const stepX = graphWidth / (cleanValues.length - 1);
  const xFor = (i) => i * stepX;
  const yFor = (v) => chartBottom - ((v - min) / range) * (chartBottom - chartTop);
  const points = cleanValues.map((v, i) => ({ x: xFor(i), y: yFor(v) }));

  const smoothPath = (() => {
    if (points.length === 2) {
      return `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)} L ${points[1].x.toFixed(1)} ${points[1].y.toFixed(1)}`;
    }
    let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)} `;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? 0 : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

// supportsPAC=false disattiva completamente i campi contribution_amount/manually_edited (usato da Immobili,
// la cui tabella non ha quelle colonne).
function useValuations({ userId, table, idField, activeId, valuations, setValuations, mvErrorMsg, cbErrorMsg, supportsPAC, onDeleteError }) {
  const [valForm, setValForm] = useState({ value_date: currentMonthISO(), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  const [valError, setValError] = useState("");
  const [editingValId, setEditingValId] = useState(null);
  const [editValForm, setEditValForm] = useState({ value_date: "", market_value: "", cost_basis: "", carry_group_id: null, contribution_amount: null, base_market_value: "", base_cost_basis: "" });
  const [editValScope, setEditValScope] = useState("single");
  const [bulkOverrideConfirm, setBulkOverrideConfirm] = useState(false);
  const [pendingManualCount, setPendingManualCount] = useState(0);
  const [editValError, setEditValError] = useState("");
  const [removalValuation, setRemovalValuation] = useState(null);

  const addValuation = async (e) => {

    const mv = parseFloat(String(valForm.market_value).replace(",", "."));
    const cb = parseFloat(String(valForm.cost_basis).replace(",", "."));
    if (!valForm.value_date) { setValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setValError(mvErrorMsg); return; }
    if (isNaN(cb) || cb < 0) { setValError(cbErrorMsg); return; }
    if (valForm.carryForward) {
      if (!valForm.carryUntil) { setValError("Seleziona fino a quale mese portare avanti il valore."); return; }
      if (monthKeyToIdx(valForm.carryUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }

      setValError("");

      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, [idField]: activeId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv, cost_basis: cb, carry_group_id: groupId, ...(supportsPAC ? { manually_edited: false } : {}) });
      }
      const { data, error: insErr } = await supabase.from(table).insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
      return;

      if (isNaN(contrib) || contrib <= 0) { setValError("Inserisci un importo di versamento mensile valido."); return; }
      if (monthKeyToIdx(valForm.contributionUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.contributionUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v[idField] === activeId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di impostare il versamento ricorrente su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const offset = idx - startIdx;
        rows.push({ user_id: userId, [idField]: activeId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv + offset * contrib, cost_basis: cb + offset * contrib, carry_group_id: groupId, contribution_amount: contrib, manually_edited: false });
      }
      const { data, error: insErr } = await supabase.from(table).insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });

      setValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setValError("");
    const { data, error: insErr } = await supabase.from(table).insert({ user_id: userId, [idField]: activeId, value_date: monthDateToFull(valForm.value_date), market_value: mv, cost_basis: cb }).select().single();
    if (insErr) { setValError(insErr.message); return; }
    setValuations((prev) => [{ ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) }, ...prev]);
    setValForm({ value_date: monthKeyFromIdx(monthKeyToIdx(valForm.value_date) + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  };

    const firstRow = groupRows.length > 0 ? groupRows.reduce((a, b) => (a.value_date < b.value_date ? a : b)) : null;

      market_value: String(v.market_value).replace(".", ","),
      cost_basis: String(v.cost_basis).replace(".", ","),
      carry_group_id: v.carry_group_id || null,
      contribution_amount: (supportsPAC && v.contribution_amount != null) ? v.contribution_amount : null,
      base_market_value: firstRow ? String(firstRow.market_value).replace(".", ",") : "",
      base_cost_basis: firstRow ? String(firstRow.cost_basis).replace(".", ",") : "",
    });
    setEditValScope("single");
    setBulkOverrideConfirm(false);
    setEditValError("");
  };

  const editValGroupSize = editValForm.carry_group_id ? valuations.filter((v) => v.carry_group_id === editValForm.carry_group_id).length : 1;

      const results = await Promise.all(updates.map((u) => supabase.from(table).update({ market_value: u.market_value, cost_basis: u.cost_basis, contribution_amount: contrib, manually_edited: false }).eq("id", u.id).select().single()));

      if (failed) { setEditValError(failed.error.message); return; }

        const upd = updates.find((u) => u.id === v.id);

      }));
      setEditingValId(null);
      return;

    const mv = parseFloat(String(editValForm.market_value).replace(",", "."));
    const cb = parseFloat(String(editValForm.cost_basis).replace(",", "."));
    if (editValScope === "single" && !editValForm.value_date) { setEditValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setEditValError(mvErrorMsg); return; }
    if (isNaN(cb) || cb < 0) { setEditValError(cbErrorMsg); return; }
    if (editValScope === "all" && editValForm.carry_group_id) {
      const { error: updErr } = await supabase.from(table).update({ market_value: mv, cost_basis: cb }).eq("carry_group_id", editValForm.carry_group_id);
      if (updErr) { setEditValError(updErr.message); return; }
      setValuations((prev) => prev.map((v) => (v.carry_group_id === editValForm.carry_group_id ? { ...v, market_value: mv, cost_basis: cb } : v)));
      setEditingValId(null);
      return;
    }
    const duplicate = valuations.some((v) => v.id !== editingValId && v[idField] === activeId && fullDateToMonth(v.value_date) === editValForm.value_date);
    if (duplicate) {
      const [dy, dm] = editValForm.value_date.split("-").map(Number);
      setEditValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }

    const { data, error: updErr } = await supabase.from(table).update(payload).eq("id", editingValId).select().single();
    if (updErr) { setEditValError(updErr.message); return; }
    setValuations((prev) => prev.map((v) => (v.id === editingValId ? { ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) } : v)));

function useKeyboardOffset() {
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const update = () => {
      const kb = window.innerHeight - vv.height - vv.offsetTop;
      setOffset(kb > 40 ? kb : 0);
    };
    update();
    vv.addEventListener("resize", update);
    vv.addEventListener("scroll", update);
    return () => {
      vv.removeEventListener("resize", update);
      vv.removeEventListener("scroll", update);
    };
  }, []);
  return offset;
}

    setSection(key);
  };

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    const t = setTimeout(() => setShowSplash(false), 2000);
    return () => clearTimeout(t);
  }, []);

  if (showSplash || session === undefined) return <Splash />;
  if (!session) return <AuthScreen />;

  return (
    <PrivacyContext.Provider value={{ hideAmounts, toggleHideAmounts }}>
      {section === "expenses" ? <MainApp session={session} onBack={() => setSection(null)} /> :
       section === "invest" ? <InvestApp session={session} onBack={() => setSection(null)} /> :
       section === "insurance" ? <InsuranceApp session={session} onBack={() => setSection(null)} /> :
       section === "realestate" ? <RealEstateApp session={session} onBack={() => setSection(null)} /> :
       section === "cashflow" ? <CashflowApp session={session} onBack={() => setSection(null)} /> :
       section === "networth" ? <NetWorthApp session={session} onBack={() => setSection(null)} /> :
       section === "profile" ? <ProfileApp session={session} onBack={() => setSection(null)} /> :
       <Hub onSelect={handleHubSelect} activeGroup={activeGroup} onToggleGroup={(key) => setActiveGroup((prev) => (prev === key ? null : key))} />}
    </PrivacyContext.Provider>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Controlla la tua email per confermare la registrazione.");
      }
    } catch (err) {
      setError(err.message || "Errore. Riprova.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FFFFFF", padding: 20 }}>
      <div className="fade-in" style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <img src={LOGO_SRC} alt="Cozy Tracker" style={{ width: 260, height: "auto" }} />
        </div>
        <form onSubmit={submit}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid var(--color-border)", borderRadius: "var(--radius-md)", padding: "10px 12px", marginBottom: 10 }}>
            <Mail size={16} color="var(--color-primary)" />
            <input type="email" required placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid var(--color-border)", borderRadius: "var(--radius-md)", padding: "10px 12px", marginBottom: 16 }}>
            <Lock size={16} color="var(--color-primary)" />
            <input type="password" required placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} minLength={6} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          {error && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 10 }}>{error}</div>}
          {info && <div style={{ color: "var(--color-primary)", fontSize: 13, marginBottom: 10 }}>{info}</div>}
          <button type="submit" disabled={loading} className="btn-primary" style={{ width: "100%", padding: "12px 0", borderRadius: "var(--radius-md)", fontSize: 15 }}>
            {loading ? "Attendere…" : mode === "signin" ? "Accedi" : "Crea account"}
          </button>
        </form>
        <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setInfo(""); }} style={{ width: "100%", background: "none", border: "none", color: "var(--color-primary)", fontSize: 13, marginTop: 16, cursor: "pointer" }}>
          {mode === "signin" ? "Non hai un account? Registrati" : "Hai già un account? Accedi"}
        </button>
      </div>
    </div>
  );
}

function MainApp({ session, onBack }) {
  const userId = session.user.id;
  const [expenses, setExpenses] = useState([]);

  const [filters, setFilters] = useState({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });

  const [lastMonthCursor, setLastMonthCursor] = useState(null);
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ category: "", account_id: "", amount: "", date: "", note: "", recurring_group_id: null });
  const [editScope, setEditScope] = useState("single");
  const [editError, setEditError] = useState("");
  const [editDeleteConfirm, setEditDeleteConfirm] = useState(false);
  const [cfEntries, setCfEntries] = useState([]);
  const [showUntrackedInfo, setShowUntrackedInfo] = useState(false);

  const CATEGORIES = useMemo(() => [...categories.map((c) => ({ id: c.label, label: c.label, icon: ICON_MAP[c.icon_key] || (SUGGESTED_MAP[c.label] && SUGGESTED_MAP[c.label].icon) || Tag, archived: c.archived })), ALTRO_CATEGORY], [categories]);
  const activeCategories = useMemo(() => CATEGORIES.filter((c) => !c.archived), [CATEGORIES]);

  useEffect(() => {
    if (categoriesLoaded && !activeCategories.some((c) => c.id === form.category)) {
      setForm((f) => ({ ...f, category: (activeCategories.find((c) => c.id !== "Altro") || activeCategories[0] || ALTRO_CATEGORY).id }));
    }
  }, [categoriesLoaded, activeCategories]);

  useEffect(() => {
    if (accountsLoaded && accounts.length > 0 && !accounts.some((a) => a.id === form.account_id)) {
      const preferred = activeAccountId !== "all" && accounts.some((a) => a.id === activeAccountId) ? activeAccountId : accounts[0].id;
      setForm((f) => ({ ...f, account_id: preferred }));
    }
  }, [accountsLoaded, accounts, activeAccountId]);


  useEffect(() => {
    (async () => {
      const { data: exp, error: expErr } = await supabase.from("expenses").select("*").order("date", { ascending: false });
      const expList = (!expErr && exp) ? exp.map((e) => ({ id: e.id, category: e.category, account_id: e.account_id, amount: Number(e.amount), date: e.date, note: e.note || "", recurring_group_id: e.recurring_group_id || null })) : [];
      setExpenses(expList);

      let { data: cats, error: catErr } = await supabase.from("categories").select("*").order("created_at", { ascending: true });
      if (catErr) cats = [];

      if (cats && cats.length === 0) {
        const { data: oldCustom } = await supabase.from("custom_categories").select("*");
        const toInsert = [];
        const seen = new Set();
        [...new Set(expList.map((e) => e.category))].forEach((label) => {
          if (seen.has(label) || label === "Altro") return;
          seen.add(label);
          const oc = (oldCustom || []).find((o) => o.label === label);
          toInsert.push({ user_id: userId, label, icon_key: oc ? oc.icon_key : null });
        });
        (oldCustom || []).forEach((o) => {
          if (seen.has(o.label)) return;
          seen.add(o.label);
          toInsert.push({ user_id: userId, label: o.label, icon_key: o.icon_key });
        });
        if (toInsert.length > 0) {
          const { data: inserted, error: migErr } = await supabase.from("categories").insert(toInsert).select();
          if (!migErr && inserted) cats = inserted;
        }
      }
      setCategories(cats || []);
      setCategoriesLoaded(true);

      let { data: accs, error: accErr } = await supabase.from("cashflow_accounts").select("*").order("created_at", { ascending: true });
      if (accErr) accs = [];
      setAccounts(accs || []);
      setAccountsLoaded(true);

      const { data: cfe, error: cfeErr } = await supabase.from("cashflow_entries").select("account_id,value_date,expenses");
      setCfEntries(!cfeErr && cfe ? cfe : []);

      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (periodMode === "month") setLastMonthCursor(cursor);
  }, [periodMode, cursor]);

  const periodMonthKeys = useMemo(() => {
    const idx = cursor.year * 12 + cursor.month;
    if (periodMode === "month") return [monthKeyFromIdx(idx)];
    if (periodMode === "quarter") return Array.from({ length: 3 }, (_, i) => monthKeyFromIdx(idx - 2 + i));
    if (periodMode === "semester") return Array.from({ length: 6 }, (_, i) => monthKeyFromIdx(idx - 5 + i));
    if (periodMode === "year") return Array.from({ length: 12 }, (_, i) => monthKeyFromIdx(idx - 11 + i));
    if (periodMode === "ytd") return Array.from({ length: cursor.month + 1 }, (_, i) => monthKeyFromIdx(cursor.year * 12 + i));
    return [];
  }, [cursor, periodMode]);
  const periodExpenses = useMemo(() => expenses.filter((e) => periodMonthKeys.includes(monthKey(e.date)) && (activeAccountId === "all" || e.account_id === activeAccountId)).sort((a, b) => new Date(b.date) - new Date(a.date)), [expenses, periodMonthKeys, activeAccountId]);
  const byCategory = useMemo(() => {
    const map = {};
    CATEGORIES.forEach((c) => (map[c.id] = 0));
    periodExpenses.forEach((e) => (map[e.category] = (map[e.category] || 0) + Number(e.amount)));
    return map;
  }, [periodExpenses, CATEGORIES]);
  const total = useMemo(() => periodExpenses.reduce((s, e) => s + Number(e.amount), 0), [periodExpenses]);

  const cfExpensesByAccountMonth = useMemo(() => {
    const map = {};
    cfEntries.forEach((e) => {
      const mk = monthKey(e.value_date);
      if (!map[e.account_id]) map[e.account_id] = {};
      map[e.account_id][mk] = Number(e.expenses);
    });
    return map;
  }, [cfEntries]);

  const trackedByAccountMonth = useMemo(() => {
    const map = {};
    expenses.forEach((e) => {
      const mk = monthKey(e.date);
      if (!map[e.account_id]) map[e.account_id] = {};
      map[e.account_id][mk] = (map[e.account_id][mk] || 0) + Number(e.amount);
    });
    return map;
  }, [expenses]);

  const untrackedInfo = useMemo(() => {
    const relevantAccountIds = activeAccountId === "all" ? accounts.map((a) => a.id) : [activeAccountId];
    let value = 0;
    let hasAny = false;
    relevantAccountIds.forEach((accId) => {
      periodMonthKeys.forEach((mk) => {
        const cf = cfExpensesByAccountMonth[accId] ? cfExpensesByAccountMonth[accId][mk] : undefined;
        if (cf === undefined) return;
        hasAny = true;
        const tracked = (trackedByAccountMonth[accId] && trackedByAccountMonth[accId][mk]) || 0;
        value += cf - tracked;
      });
    });
    return { value, hasAny };
  }, [activeAccountId, accounts, periodMonthKeys, cfExpensesByAccountMonth, trackedByAccountMonth]);

  const grandTotal = total + (untrackedInfo.hasAny ? untrackedInfo.value : 0);
  const maxCat = Math.max(1, ...Object.values(byCategory), untrackedInfo.hasAny ? Math.abs(untrackedInfo.value) : 0);

  const filtersActive = filters.dateFrom || filters.dateTo || filters.category !== "Tutte" || filters.amountMode !== "any";
  const filteredExpenses = useMemo(() => {
    return expenses.filter((e) => {
      if (filters.dateFrom && e.date < filters.dateFrom) return false;
      if (filters.dateTo && e.date > filters.dateTo) return false;
      if (filters.category !== "Tutte" && e.category !== filters.category) return false;
      if (activeAccountId !== "all" && e.account_id !== activeAccountId) return false;
      const min = parseFloat(String(filters.amountMin).replace(",", "."));
      const max = parseFloat(String(filters.amountMax).replace(",", "."));
      if (filters.amountMode === "lt" && !isNaN(min) && !(e.amount < min)) return false;
      if (filters.amountMode === "gt" && !isNaN(min) && !(e.amount > min)) return false;
      if (filters.amountMode === "between") {
        if (!isNaN(min) && e.amount < min) return false;
        if (!isNaN(max) && e.amount > max) return false;
      }
      return true;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [expenses, filters, activeAccountId]);
  const filteredTotal = useMemo(() => filteredExpenses.reduce((s, e) => s + Number(e.amount), 0), [filteredExpenses]);
  const resetFilters = () => setFilters({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });

  const goPeriod = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const changePeriod = (id) => {
    if (id === "month") {
      setCursor(lastMonthCursor || cursor);
    }
    setPeriodMode(id);
  };

  const addExpense = async (e) => {
    e.preventDefault();
    const amt = parseFloat(String(form.amount).replace(",", "."));
    if (!amt || amt <= 0) { setError("Inserisci un importo valido."); return; }
    if (!form.date) { setError("Inserisci una data."); return; }
    if (!form.account_id) { setError("Seleziona un conto."); return; }
    if (form.recurring) {
      if (!form.recurringUntil) { setError("Seleziona fino a quale mese ripetere la spesa."); return; }
      if (monthKeyToIdx(form.recurringUntil) < monthKeyToIdx(fullDateToMonth(form.date))) { setError("Il mese finale deve essere uguale o successivo al mese della data scelta."); return; }
    }
    setError("");
    setSaveState("saving");
    if (form.recurring) {
      const startIdx = monthKeyToIdx(fullDateToMonth(form.date));
      const endIdx = monthKeyToIdx(form.recurringUntil);
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, category: form.category, account_id: form.account_id, amount: amt, date: addMonthsToDate(form.date, idx - startIdx), note: form.note.trim(), recurring_group_id: groupId });
      }
      const { data, error: insErr } = await supabase.from("expenses").insert(rows).select();
      if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }

    } else {
      const { data, error: insErr } = await supabase.from("expenses").insert({ user_id: userId, category: form.category, account_id: form.account_id, amount: amt, date: form.date, note: form.note.trim() }).select().single();
      if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }
      setExpenses((prev) => [{ id: data.id, category: data.category, account_id: data.account_id, amount: Number(data.amount), date: data.date, note: data.note || "", recurring_group_id: data.recurring_group_id || null }, ...prev]);
    }
    setSaveState("saved");
    setForm({ ...form, amount: "", note: "", recurring: false, recurringUntil: "" });
    setView("home");
  };

  const removeExpense = async (id) => {
    const prev = expenses;
    setExpenses(expenses.filter((e) => e.id !== id));

  };

  const openEdit = (exp) => {
    setEditingId(exp.id);
    setEditForm({ category: exp.category, account_id: exp.account_id, amount: String(exp.amount).replace(".", ","), date: exp.date, note: exp.note || "", recurring_group_id: exp.recurring_group_id || null });

    setEditError(""); setEditDeleteConfirm(false);
    setView("editExpense");
  };

  const editGroupSize = editForm.recurring_group_id ? expenses.filter((e) => e.recurring_group_id === editForm.recurring_group_id).length : 1;

  const saveEditExpense = async () => {
    const amt = parseFloat(String(editForm.amount).replace(",", "."));
    if (!amt || amt <= 0) { setEditError("Inserisci un importo valido."); return; }
    if (editScope === "single" && !editForm.date) { setEditError("Inserisci una data."); return; }
    setEditError("");
    if (editScope === "all" && editForm.recurring_group_id) {
      const { error: updErr } = await supabase.from("expenses").update({ category: editForm.category, account_id: editForm.account_id, amount: amt, note: editForm.note.trim() }).eq("recurring_group_id", editForm.recurring_group_id);
      if (updErr) { setEditError(updErr.message); return; }
      setExpenses((prev) => prev.map((e) => (e.recurring_group_id === editForm.recurring_group_id ? { ...e, category: editForm.category, account_id: editForm.account_id, amount: amt, note: editForm.note.trim() } : e)));
    } else {
      const { data, error: updErr } = await supabase.from("expenses").update({ category: editForm.category, account_id: editForm.account_id, amount: amt, date: editForm.date, note: editForm.note.trim() }).eq("id", editingId).select().single();
      if (updErr) { setEditError(updErr.message); return; }
      setExpenses((prev) => prev.map((e) => (e.id === editingId ? { id: data.id, category: data.category, account_id: data.account_id, amount: Number(data.amount), date: data.date, note: data.note || "", recurring_group_id: data.recurring_group_id || null } : e)));
    }
    setEditingId(null);
    setView("list");
  };

  const confirmDeleteEditing = async (scope) => {
    if (scope === "all" && editForm.recurring_group_id) {
      const prev = expenses;
      setExpenses((p) => p.filter((e) => e.recurring_group_id !== editForm.recurring_group_id));
      const { error: delErr } = await supabase.from("expenses").delete().eq("recurring_group_id", editForm.recurring_group_id);
      if (delErr) { setExpenses(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
    } else {
      await removeExpense(editingId);
    }
    setEditingId(null); setEditDeleteConfirm(false);
    setView("list");
  };

  const [catBusy, setCatBusy] = useState(false);

  const activateSuggested = async (sugg) => {
    if (catBusy) return;
    setCatBusy(true);
    const existing = categories.find((c) => c.label === sugg.label);
    if (existing) {
      const { error: updErr } = await supabase.from("categories").update({ archived: false }).eq("id", existing.id);
      if (!updErr) setCategories((prev) => prev.map((c) => (c.id === existing.id ? { ...c, archived: false } : c)));
      else { setSaveState("error"); setLastErrorMsg(updErr.message); }
      setCatBusy(false);
      return;
    }
    const { data, error: insErr } = await supabase.from("categories").insert({ user_id: userId, label: sugg.label, icon_key: null }).select().single();
    if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); setCatBusy(false); return; }
    setCategories((prev) => [...prev, data]);
    setCatBusy(false);
  };

  const addCustomCategory = async () => {
    if (catBusy) return;
    const label = newCatName.trim();
    if (!label) { setCatError("Inserisci un nome."); return; }
    const existsActive = activeCategories.some((c) => c.label.toLowerCase() === label.toLowerCase());
    if (existsActive) { setCatError("Questa voce esiste già."); return; }
    setCatBusy(true);
    const archivedMatch = categories.find((c) => c.archived && c.label.toLowerCase() === label.toLowerCase());
    if (archivedMatch) {
      const { error: updErr } = await supabase.from("categories").update({ archived: false, icon_key: newCatIcon }).eq("id", archivedMatch.id);
      if (updErr) { setCatError(updErr.message); setCatBusy(false); return; }
      setCategories((prev) => prev.map((c) => (c.id === archivedMatch.id ? { ...c, archived: false, icon_key: newCatIcon } : c)));
    } else {
      const { data, error: insErr } = await supabase.from("categories").insert({ user_id: userId, label, icon_key: newCatIcon }).select().single();
      if (insErr) { setCatError(insErr.message); setCatBusy(false); return; }
      setCategories((prev) => [...prev, data]);
    }
    setNewCatName(""); setNewCatIcon("Tag"); setCatError(""); setAddingCustom(false);
    setCatBusy(false);
  };

  const requestRemoval = (cat) => { setRemovalTarget(cat); setRemovalStage("choose"); };
  const cancelRemoval = () => { setRemovalTarget(null); setRemovalStage("choose"); };

  const archiveCategory = async () => {
    const cat = removalTarget;
    const { error: updErr } = await supabase.from("categories").update({ archived: true }).eq("id", cat.rowId);
    if (!updErr) setCategories((prev) => prev.map((c) => (c.id === cat.rowId ? { ...c, archived: true } : c)));
    else { setSaveState("error"); setLastErrorMsg(updErr.message); }
    cancelRemoval();
  };

  const deleteForever = async () => {
    const cat = removalTarget;
    const { error: expDelErr } = await supabase.from("expenses").delete().eq("user_id", userId).eq("category", cat.label);
    if (!expDelErr) setExpenses((prev) => prev.filter((e) => e.category !== cat.label));
    const { error: catDelErr } = await supabase.from("categories").delete().eq("id", cat.rowId);
    if (!catDelErr) setCategories((prev) => prev.filter((c) => c.id !== cat.rowId));
    cancelRemoval();
  };



  const exportCSV = (scope) => {
    const rows = scope === "filtered" ? filteredExpenses : [...expenses].sort((a, b) => new Date(a.date) - new Date(b.date));
    if (rows.length === 0) return;
    const header = "Data,Categoria,Conto,Importo,Nota";
    const accName = (id) => (accounts.find((a) => a.id === id) || {}).name || "";
    const lines = rows.map((e) => `${e.date},${e.category},${accName(e.account_id)},${e.amount.toFixed(2)},"${(e.note || "").replace(/"/g, '""')}"`);
    const csv = [header, ...lines].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = scope === "filtered" ? "spese_filtrate.csv" : "spese_tutte.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const signOut = () => supabase.auth.signOut();

  if (!loaded || !categoriesLoaded || !accountsLoaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando le spese…</div>
      </div>

          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <button onClick={onBack} aria-label="Torna alla home" className="btn-icon" style={{ padding: 8, color: "#FFFFFF" }}>
              <ArrowLeft size={22} />
            </button>
            <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>Le mie spese</span>
          </div>
          <button onClick={() => setMenuOpen((s) => !s)} aria-label="Apri menu" className="btn-icon" style={{ padding: 6, color: "#FFFFFF" }}>
            <Menu size={24} />
          </button>
        </div>
        {menuOpen && (
          <>
            <div onClick={() => setMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 29 }} />
            <div className="fade-in" style={{ position: "absolute", top: 52, right: 12, background: "#FFFFFF", border: "1px solid var(--color-border)", borderRadius: "var(--radius-md)", boxShadow: "0 8px 24px rgba(5,91,101,0.14)", minWidth: 200, overflow: "hidden", zIndex: 31 }}>

              <button onClick={signOut} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "12px 14px", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "var(--color-danger)", textAlign: "left" }}>
                <LogOut size={15} /> Esci

            </div>

                <button onClick={onBack} className="btn-primary" style={{ padding: "11px 22px", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
                  Torna alla home
                </button>
              </div>

                    {accounts.map((a) => (
                      <button key={a.id} onClick={() => setActiveAccountId(a.id)} style={{ padding: "6px 12px", borderRadius: "var(--radius-pill)", border: activeAccountId === a.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: activeAccountId === a.id ? "var(--color-primary)" : "#FFFFFF", color: activeAccountId === a.id ? "#FFFFFF" : "var(--color-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{a.name}</button>
                    ))}
                  </div>

                <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>

              <div onClick={() => { setPickerYear(cursor.year); setDatePickerOpen(true); }} style={{ fontSize: "clamp(18px, 6vw, 28px)", letterSpacing: "0.01em", color: "var(--color-heading)", fontWeight: 700, whiteSpace: "nowrap", flex: 1, minWidth: 0, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", cursor: "pointer" }}>{periodLabel(periodMode, cursor)}</div>

              {datePickerOpen && (
                <MonthYearPickerPopup
                  pickerYear={pickerYear} setPickerYear={setPickerYear}
                  selectedYear={cursor.year} selectedMonth={cursor.month}
                  onSelectMonth={(y, m) => { setCursor({ year: y, month: m }); setDatePickerOpen(false); }}
                  onClose={() => setDatePickerOpen(false)}
                />
              )}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 10, flexShrink: 0 }}>
              {PERIODS.map((p) => (
                <button key={p.id} onClick={() => changePeriod(p.id)} style={{ flex: 1, padding: "7px 0", borderRadius: "var(--radius-pill)", border: periodMode === p.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: periodMode === p.id ? "var(--color-primary)" : "#FFFFFF", color: periodMode === p.id ? "#FFFFFF" : "var(--color-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                  {p.label}
                </button>
              ))}
            </div>
            <div key={`${periodMode}-${cursor.year}-${cursor.month}`} className="fade-in" style={{ textAlign: "center", padding: "10px 0", borderBottom: "1px solid var(--color-border)", flexShrink: 0 }}>
              <div className="mono" style={{ fontSize: 34, fontWeight: 600, letterSpacing: "-0.01em", lineHeight: 1.1 }}><Money>{fmtEUR(grandTotal)}</Money></div>
              <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginTop: 1 }}>{periodExpenses.length} {periodExpenses.length === 1 ? "movimento" : "movimenti"} {PERIODS.find((p) => p.id === periodMode).phrase}</div>
            </div>
            <div className="scrollbar-thin" style={{ flex: "1 1 auto", maxHeight: 360, minHeight: 0, overflowY: "auto", padding: "6px 0" }}>
              {activeCategories.length === 0 && categoriesLoaded ? (
                <div style={{ textAlign: "center", padding: "20px 10px" }}>
                  <div style={{ fontSize: 14, color: "var(--color-primary)", marginBottom: 12 }}>Non hai ancora categorie di spesa.</div>
                  <button onClick={() => setView("categories")} className="btn-primary" style={{ padding: "10px 18px", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
                    Gestisci categorie
                  </button>
                </div>
              ) : activeCategories.map((c) => {
                const Icon = c.icon;
                const val = byCategory[c.id] || 0;
                const pct = Math.round((val / maxCat) * 100);
                const pctOfTotal = grandTotal > 0 ? Math.round((val / grandTotal) * 100) : 0;
                return (
                  <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "6px 0" }}>
                    <Icon size={16} color="var(--color-primary)" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 15, marginBottom: 4 }}>
                        <span>{c.label}</span>
                        <span style={{ display: "flex", alignItems: "baseline", gap: 7 }}>
                          <span className="mono text-md" style={{ color: "var(--color-primary)", width: 40, textAlign: "right" }}>{val > 0 ? `${pctOfTotal}%` : ""}</span>
                          <span className="mono text-lg" style={{ color: val > 0 ? "var(--color-heading)" : "var(--color-border-light)" }}><Money>{fmtEUR(val)}</Money></span>
                        </span>
                      </div>
                      <div style={{ height: 5, background: "var(--color-bg-tint)", borderRadius: "var(--radius-xs)", overflow: "hidden" }}>
                        <div className="bar-fill" style={{ height: "100%", width: `${val > 0 ? pct : 0}%`, background: "var(--color-primary)", borderRadius: "var(--radius-xs)" }} />
                      </div>
                    </div>
                  </div>
                );
              })}
              {untrackedInfo.hasAny && (
                <div onClick={() => setShowUntrackedInfo(true)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 6px", marginTop: 4, borderRadius: "var(--radius-md)", background: "var(--color-warning-bg)", border: "1px solid var(--color-warning-border)", cursor: "pointer" }}>
                  <Scale size={16} color="var(--color-warning)" style={{ flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 15, marginBottom: 4 }}>
                      <span style={{ color: "var(--color-warning)" }}>Spese non tracciate</span>
                      <span style={{ display: "flex", alignItems: "baseline", gap: 7 }}>
                        <span className="mono text-md" style={{ color: "var(--color-warning)", width: 40, textAlign: "right" }}>{grandTotal > 0 ? `${Math.round((untrackedInfo.value / grandTotal) * 100)}%` : ""}</span>
                        <span className="mono text-lg" style={{ color: "var(--color-warning)" }}><Money>{untrackedInfo.value > 0 ? "+" : ""}{fmtEUR(untrackedInfo.value)}</Money></span>
                      </span>
                    </div>
                    <div style={{ height: 5, background: "#F3E7C9", borderRadius: "var(--radius-xs)", overflow: "hidden" }}>
                      <div className="bar-fill" style={{ height: "100%", width: `${Math.min(100, Math.round((Math.abs(untrackedInfo.value) / maxCat) * 100))}%`, background: "#D9A441", borderRadius: "var(--radius-xs)" }} />
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexShrink: 0 }}>
              <button onClick={() => setView("add")} className="btn-primary" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
                <Plus size={16} /> Inserisci movimento
              </button>
              <button onClick={() => setView("list")} className="btn-outline-strong" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
                <List size={16} /> Lista movimenti
              </button>
            </div>
            <div style={{ flex: 1, minHeight: 0 }} />
            <div style={{ textAlign: "center", fontSize: 10.5, color: saveState === "error" ? "var(--color-danger)" : "var(--color-border-light)", marginTop: 6, flexShrink: 0 }}>
              {loaded ? (saveState === "saving" ? "Salvataggio…" : saveState === "error" ? `Errore: ${lastErrorMsg}` : "Dati sincronizzati") : "Caricamento…"}
            </div>
              </>
            )}
          </>
        ) : view === "add" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" className="btn-icon" style={{ padding: 6, color: "var(--color-primary)" }}><ArrowLeft size={18} /></button>
              <div className="text-md" style={{ flex: 1 }}>Nuovo movimento</div>
            </div>
            <form onSubmit={addExpense} className="fade-in" style={{ marginTop: 18, flex: 1, minHeight: 0, overflowY: "auto", display: "flex", flexDirection: "column" }}>
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 10 }}>Categoria</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 24 }}>
                {activeCategories.map((c) => (
                  <button type="button" key={c.id} className="chip" onClick={() => setForm({ ...form, category: c.id })} style={{ fontSize: 14, padding: "8px 14px", borderRadius: "var(--radius-pill)", border: form.category === c.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: form.category === c.id ? "var(--color-primary)" : "#FFFFFF", color: form.category === c.id ? "#FFFFFF" : "var(--color-heading)", cursor: "pointer" }}>
                    {c.label}
                  </button>
                ))}
              </div>
              {accounts.length > 1 && (
                <>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 10 }}>Conto</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 24 }}>
                    {accounts.map((a) => (
                      <button type="button" key={a.id} className="chip" onClick={() => setForm({ ...form, account_id: a.id })} style={{ fontSize: 14, padding: "8px 14px", borderRadius: "var(--radius-pill)", border: form.account_id === a.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: form.account_id === a.id ? "var(--color-primary)" : "#FFFFFF", color: form.account_id === a.id ? "#FFFFFF" : "var(--color-heading)", cursor: "pointer" }}>
                        {a.name}
                      </button>
                    ))}
                  </div>
                </>
              )}
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Importo</div>
              <input type="text" inputMode="decimal" placeholder="0,00 €" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} className="mono" autoFocus style={{ width: "95%", margin: "0 auto 20px", display: "block", padding: "14px 14px", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border)", fontSize: 24, fontWeight: 600 }} />
              <div style={{ display: "flex", gap: 12, marginBottom: 20 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Data</div>
                  <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={{ width: "95%", margin: "0 auto", display: "block", padding: "12px 12px", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border)", fontSize: 16, color: "var(--color-heading)" }} />
                </div>
              </div>
              <div style={{ marginBottom: 20 }}>
                <div onClick={() => { const next = !form.recurring; setForm({ ...form, recurring: next, recurringUntil: next ? monthKeyFromIdx(monthKeyToIdx(fullDateToMonth(form.date)) + 11) : "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <div style={{ width: 20, height: 20, borderRadius: 5, border: form.recurring ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: form.recurring ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {form.recurring && <Check size={13} color="#FFFFFF" />}
                  </div>
                  <span style={{ fontSize: 14.5, color: "var(--color-heading)" }}>Spesa fissa ricorrente ogni mese</span>
                </div>
                {form.recurring && (
                  <div className="fade-in" style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Ripeti fino a</div>
                    <input type="month" value={form.recurringUntil} min={fullDateToMonth(form.date)} onChange={(e) => setForm({ ...form, recurringUntil: e.target.value })} style={{ width: "95%", minWidth: 0, WebkitAppearance: "none", appearance: "none", margin: "0 auto", display: "block", padding: "12px 12px", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border)", fontSize: 16, color: "var(--color-heading)" }} />
                    <div style={{ fontSize: 12.5, color: "var(--color-primary)", marginTop: 6 }}>Verrà creato lo stesso movimento ogni mese, stesso giorno, fino al mese scelto incluso.</div>

function CapitalChart({ months, market, cost, futureFromMonth }) {
  const { hideAmounts } = usePrivacy();
  const width = 460, height = 238;
  const padding = { top: 16, right: 14, bottom: 30, left: 44 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const svgRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(null);

  if (months.length < 2) {
    return (
      <div style={{ textAlign: "center", padding: "40px 10px", color: "var(--color-primary)", fontSize: 13.5 }}>
        Servono almeno due mesi di dati per disegnare l'andamento.
      </div>
    );
  }

  const allValues = [...market, ...cost];
  const rawMax = Math.max(...allValues);
  const rawMin = Math.min(...allValues);
  const rawRange = rawMax - rawMin || Math.abs(rawMax) || 1;
  const valuePad = rawRange * 0.12;
  const maxV = rawMax + valuePad;
  const minV = Math.max(0, rawMin - valuePad);
  const range = maxV - minV || 1;
  const xStep = innerW / (months.length - 1);
  const xFor = (i) => padding.left + i * xStep;
  const yFor = (v) => padding.top + innerH - ((v - minV) / range) * innerH;

  const pathForRange = (series, startIdx, endIdx) => {
    const pts = [];
    for (let i = startIdx; i <= endIdx; i++) pts.push({ x: xFor(i), y: yFor(series[i]) });
    if (pts.length < 2) return "";
    if (pts.length === 2) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} `;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i === 0 ? 0 : i - 1];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += `C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} `;
    }
    return d.trim();
  };

  const areaForRange = (series, startIdx, endIdx) => {
    const line = pathForRange(series, startIdx, endIdx);
    if (!line) return "";
    const baseline = height - padding.bottom;
    return `${line} L ${xFor(endIdx).toFixed(1)} ${baseline.toFixed(1)} L ${xFor(startIdx).toFixed(1)} ${baseline.toFixed(1)} Z`;
  };

  const futureIdx = futureFromMonth ? months.findIndex((m) => m > futureFromMonth) : -1;
  const hasFuture = futureIdx > 0 && futureIdx < months.length;
  const actualEndIdx = hasFuture ? futureIdx - 1 : months.length - 1;
  const currentMonthIndex = futureFromMonth ? months.lastIndexOf(futureFromMonth) : actualEndIdx;
  const highlightIdx = currentMonthIndex >= 0 ? currentMonthIndex : actualEndIdx;
  const splitX = hasFuture ? xFor(actualEndIdx) : null;
  const estimatedStartX = hasFuture ? splitX + 1 : null;
  const showAllPoints = months.length <= 6;
  const labelEvery = Math.max(1, Math.ceil(months.length / 6));

  const fmtAxis = (v) => {
    const abs = Math.abs(v);
    if (abs >= 1000000) return `€${(v / 1000000).toFixed(abs >= 10000000 ? 0 : 1)}M`;
    if (abs >= 1000) return `€${Math.round(v / 1000)}k`;
    return `€${Math.round(v)}`;
  };

  const gridValues = [0, 0.5, 1].map((ratio) => minV + range * ratio);

  const indexFromClientX = (clientX) => {
    const svg = svgRef.current;
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    if (rect.width === 0) return null;
    const relX = ((clientX - rect.left) / rect.width) * width;
    const idx = Math.round((relX - padding.left) / xStep);
    return Math.min(months.length - 1, Math.max(0, idx));
  };
  const handlePointerDown = (e) => {
    e.currentTarget.setPointerCapture?.(e.pointerId);
    const idx = indexFromClientX(e.clientX);
    if (idx !== null) setActiveIndex(idx);
  };
  const handlePointerMove = (e) => {
    if (activeIndex === null) return;
    const idx = indexFromClientX(e.clientX);
    if (idx !== null) setActiveIndex(idx);
  };
  const handlePointerUp = () => setActiveIndex(null);

  let tooltip = null;
  if (activeIndex !== null) {
    const tx = xFor(activeIndex);
    const marketValue = market[activeIndex];
    const costValue = cost[activeIndex];
    const difference = marketValue - costValue;
    const performance = costValue > 0 ? (difference / costValue) * 100 : null;
    const boxW = 184, boxH = 88;
    let boxX = tx + 10;
    if (boxX + boxW > width - 3) boxX = tx - boxW - 10;
    if (boxX < 3) boxX = 3;
    const boxY = 5;
    tooltip = (
      <g pointerEvents="none">
        <line x1={tx} y1={padding.top} x2={tx} y2={height - padding.bottom} stroke="var(--color-heading)" strokeWidth="1" strokeDasharray="3 3" opacity="0.24" />
        <circle cx={tx} cy={yFor(costValue)} r="5" fill="#FFFFFF" stroke="var(--color-border-light)" strokeWidth="2" />
        <circle cx={tx} cy={yFor(marketValue)} r="5" fill="#FFFFFF" stroke="var(--color-primary)" strokeWidth="2" />
        <rect x={boxX} y={boxY} width={boxW} height={boxH} rx="11" fill="#FFFFFF" stroke="var(--color-border)" strokeWidth="1" />
        <text x={boxX + 12} y={boxY + 17} fontSize="11" fontWeight="700" fill="var(--color-heading)" textAnchor="start">{fmtMonthYear(months[activeIndex])}</text>
        <circle cx={boxX + 14} cy={boxY + 33} r="3" fill="var(--color-primary)" />
        <text x={boxX + 23} y={boxY + 37} fontSize="10.5" fill="var(--color-primary)">Valore di mercato</text>
        <text x={boxX + boxW - 10} y={boxY + 37} fontSize="10.5" fontWeight="700" fill="var(--color-heading)" textAnchor="end">{fmtEUR(marketValue)}</text>
        <circle cx={boxX + 14} cy={boxY + 50} r="3" fill="var(--color-border-light)" />
        <text x={boxX + 23} y={boxY + 54} fontSize="10.5" fill="var(--color-primary)">Costo storico</text>
        <text x={boxX + boxW - 10} y={boxY + 54} fontSize="10.5" fontWeight="700" fill="var(--color-heading)" textAnchor="end">{fmtEUR(costValue)}</text>
        <line x1={boxX + 12} x2={boxX + boxW - 12} y1={boxY + 63} y2={boxY + 63} stroke="var(--color-border)" />
        <text x={boxX + 12} y={boxY + 79} fontSize="10.5" fill="var(--color-primary)">Differenza</text>
        <text x={boxX + boxW - 10} y={boxY + 79} fontSize="10.5" fontWeight="700" fill={difference >= 0 ? "var(--color-success)" : "var(--color-danger)"} textAnchor="end">{difference > 0 ? "+" : ""}{fmtEUR(difference)}{performance !== null ? ` · ${performance > 0 ? "+" : ""}${performance.toFixed(1)}%` : ""}</text>
      </g>
    );
  }

  return (
    <div style={{ width: "100%", maxWidth: "100%", margin: "0 auto", overflow: "hidden", boxSizing: "border-box" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18, flexWrap: "wrap", margin: "2px 0 8px", fontSize: 11.5, fontWeight: 600 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--color-heading)" }}>
          <span style={{ width: 22, height: 3, borderRadius: 3, background: "var(--color-primary)", display: "inline-block" }} />
          Valore di mercato
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--color-primary)" }}>
          <span style={{ width: 22, borderTop: "2px dashed var(--color-border-light)", display: "inline-block" }} />
          Costo storico
        </div>
      </div>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${width} ${height}`}
        style={{ display: "block", width: "100%", maxWidth: "100%", height: "auto", filter: hideAmounts ? "blur(6px)" : "none", transition: "filter 0.15s", touchAction: "none", cursor: "crosshair", overflow: "visible" }}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerLeave={handlePointerUp}
        onPointerCancel={handlePointerUp}
      >
        <defs>
          <linearGradient id="capitalMarketArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--color-primary)" stopOpacity="0.22" />
            <stop offset="100%" stopColor="var(--color-primary)" stopOpacity="0.015" />
          </linearGradient>
        </defs>

        {gridValues.map((v, i) => {
          const gy = yFor(v);
          return (
            <g key={`grid-${i}`}>
              <line x1={padding.left} x2={width - padding.right} y1={gy} y2={gy} stroke="var(--color-border)" strokeWidth="1" strokeDasharray="3 4" opacity="0.72" />
              <text x={padding.left - 7} y={gy + 4} fontSize="10" fill="var(--color-border-light)" textAnchor="end">{fmtAxis(v)}</text>
            </g>
          );
        })}

        {hasFuture && <rect x={estimatedStartX} y={padding.top} width={Math.max(0, width - padding.right - estimatedStartX)} height={innerH} fill="var(--color-heading)" opacity="0.026" />}

        <path d={areaForRange(market, 0, actualEndIdx)} fill="url(#capitalMarketArea)" stroke="none" />

        {hasFuture ? (
          <>
            <path d={pathForRange(cost, 0, futureIdx)} fill="none" stroke="var(--color-border-light)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="6 5" />
            <path d={pathForRange(cost, futureIdx, months.length - 1)} fill="none" stroke="var(--color-border-light)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="4 5" opacity="0.5" />
            <path d={pathForRange(market, 0, actualEndIdx)} fill="none" stroke="var(--color-primary)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
            <path d={pathForRange(market, actualEndIdx, months.length - 1)} fill="none" stroke="var(--color-border-light)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="4 5" opacity="0.72" />
          </>
        ) : (
          <>
            <path d={pathForRange(cost, 0, months.length - 1)} fill="none" stroke="var(--color-border-light)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="6 5" />
            <path d={pathForRange(market, 0, months.length - 1)} fill="none" stroke="var(--color-primary)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
          </>
        )}

        {months.map((m, i) => {
          if (!showAllPoints && i !== highlightIdx) return null;
          const isFuture = hasFuture && i >= futureIdx;
          return <circle key={`c${m}`} cx={xFor(i)} cy={yFor(cost[i])} r={isFuture ? 2.5 : 3} fill="#FFFFFF" stroke="var(--color-border-light)" strokeWidth="1.5" opacity={isFuture ? 0.6 : 1} />;
        })}
        {months.map((m, i) => {
          if (!showAllPoints && i !== highlightIdx) return null;
          const isFuture = hasFuture && i >= futureIdx;
          return <circle key={`m${m}`} cx={xFor(i)} cy={yFor(market[i])} r={isFuture ? 2.5 : 3} fill="#FFFFFF" stroke={isFuture ? "var(--color-border-light)" : "var(--color-primary)"} strokeWidth="1.5" opacity={isFuture ? 0.6 : 1} />;
        })}

        {highlightIdx >= 0 && (
          <>
            <line x1={xFor(highlightIdx)} y1={padding.top} x2={xFor(highlightIdx)} y2={height - padding.bottom} stroke="var(--color-primary)" strokeWidth="1" strokeDasharray="2 4" opacity="0.22" />
            <circle cx={xFor(highlightIdx)} cy={yFor(market[highlightIdx])} r="11" fill="var(--color-primary)" opacity="0.12" />
            <circle cx={xFor(highlightIdx)} cy={yFor(market[highlightIdx])} r="6" fill="#FFFFFF" stroke="var(--color-primary)" strokeWidth="2.5" />
            <circle cx={xFor(highlightIdx)} cy={yFor(market[highlightIdx])} r="2.5" fill="var(--color-primary)" />
          </>
        )}

        {hasFuture && (
          <>
            <line x1={splitX} y1={padding.top} x2={splitX} y2={height - padding.bottom} stroke="var(--color-border-light)" strokeWidth="1" strokeDasharray="3 4" opacity="0.75" />
            <rect x={Math.min(splitX + 5, width - 78)} y={padding.top + 5} width="68" height="18" rx="9" fill="#FFFFFF" stroke="var(--color-border)" />
            <text x={Math.min(splitX + 39, width - 44)} y={padding.top + 17.5} fontSize="8.5" fontWeight="700" fill="var(--color-border-light)" textAnchor="middle">DATI STIMATI</text>
          </>
        )}

        {months.map((m, i) => {
          if (i % labelEvery !== 0 && i !== months.length - 1) return null;
          const anchor = i === 0 ? "start" : (i === months.length - 1 ? "end" : "middle");
          const isFuture = hasFuture && i >= futureIdx;
          return <text key={m} x={xFor(i)} y={height - 8} fontSize="10.5" fontWeight={i === highlightIdx ? "700" : "500"} fill={isFuture ? "var(--color-border-light)" : "var(--color-primary)"} textAnchor={anchor}>{fmtMonthYear(m)}</text>;
        })}
        {tooltip}
      </svg>
    </div>
  );
}
// Grafico a barre per l'andamento del risparmio mensile in un anno: barre verdi (risparmio positivo) o
// rosse (negativo) sopra/sotto una linea a zero, con etichetta del mese sotto ogni barra.
function SavingBarChart({ months, values }) {
  const width = 320, height = 180;
  const padding = { top: 22, right: 6, bottom: 32, left: 6 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const validValues = values.filter((v) => v !== null);
  if (validValues.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "40px 10px", color: "var(--color-primary)", fontSize: 13.5 }}>
        Nessun dato disponibile per disegnare il grafico.
      </div>
    );
  }

  const fmtCompact = (v) => {
    const abs = Math.abs(v);
    const sign = v < 0 ? "-" : "";
    if (abs >= 10000) return `${sign}${Math.round(abs / 1000)}k`;
    if (abs >= 1000) return `${sign}${(abs / 1000).toFixed(1)}k`;
    return `${sign}${Math.round(abs)}`;
  };

  const maxV = Math.max(0, ...validValues);
  const minV = Math.min(0, ...validValues);
  const rawRange = maxV - minV || Math.abs(maxV) || 1;
  const pad = rawRange * 0.18;
  const topV = maxV + pad;
  const botV = minV - pad;
  const range = topV - botV || 1;
  const yFor = (v) => padding.top + innerH - ((v - botV) / range) * innerH;
  const zeroY = yFor(0);

  const n = months.length;
  const slot = innerW / n;
  const barW = Math.min(26, slot * 0.5);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <line x1={padding.left} x2={width - padding.right} y1={zeroY} y2={zeroY} stroke="var(--color-border)" strokeWidth="1" />
      {months.map((m, i) => {
        const v = values[i];
        const x = padding.left + i * slot + (slot - barW) / 2;
        const monthLabelY = height - 6;
        if (v === null) {
          return <text key={i} x={x + barW / 2} y={monthLabelY} textAnchor="middle" fontSize="9" fill="var(--color-border-light)">{m}</text>;
        }
        const barTop = v >= 0 ? yFor(v) : zeroY;
        const barH = Math.max(Math.abs(yFor(v) - zeroY), 2);
        const color = v >= 0 ? "var(--color-success)" : "var(--color-danger)";
        const valueLabelY = v >= 0 ? barTop - 5 : barTop + barH + 11;
        return (
          <g key={i}>
            <rect x={x} y={barTop} width={barW} height={barH} rx={2.5} fill={color} />
            <text x={x + barW / 2} y={valueLabelY} textAnchor="middle" fontSize="8.5" fontWeight="700" fill={color}>{fmtCompact(v)}</text>
            <text x={x + barW / 2} y={monthLabelY} textAnchor="middle" fontSize="9" fontWeight="600" fill="var(--color-border-light)">{m}</text>
          </g>
        );
      })}
    </svg>
  );
}

const PIE_COLORS = ["var(--color-primary)", "#5FBF7A", "#F2A65A", "#B98CD1", "#4FC1C7", "#E0708A", "#8C9EFF", "#F4C542"];



function PerformanceChart({ months, primary, secondary, primaryLabel="Rendimento", secondaryLabel="Patrimonio complessivo" }) {

  const vals=[...primary,...(secondary||[])].filter(Number.isFinite), lo=Math.min(0,...vals), hi=Math.max(0,...vals), span=hi-lo||1, min=lo-span*.1,max=hi+span*.1;

  const path=a=>{const pts=a.map((v,i)=>({x:x(i),y:y(v)}));if(pts.length===2)return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} `;for(let i=0;i<pts.length-1;i++){const p0=pts[i===0?0:i-1],p1=pts[i],p2=pts[i+1],p3=pts[i+2<pts.length?i+2:i+1];const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6,cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;d+=`C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} `;}return d.trim();};
  const pick=e=>{const r=ref.current.getBoundingClientRect();setActive(Math.max(0,Math.min(months.length-1,Math.round((((e.clientX-r.left)/r.width*w)-p.l)/((w-p.l-p.r)/(months.length-1))))))};
  return <div><div style={{display:"flex",justifyContent:"center",gap:16,fontSize:11,fontWeight:600,marginBottom:5,flexWrap:"wrap"}}><span>━ {primaryLabel}</span>{secondary&&<span style={{color:"#9B6CB5"}}>━ {secondaryLabel}</span>}</div><svg ref={ref} viewBox={`0 0 ${w} ${h}`} style={{width:"100%",touchAction:"none"}} onPointerDown={e=>{e.currentTarget.setPointerCapture?.(e.pointerId);pick(e)}} onPointerMove={e=>active!==null&&pick(e)} onPointerUp={()=>setActive(null)} onPointerLeave={()=>setActive(null)}>{[0,.5,1].map(q=>{const v=min+(max-min)*q;return <g key={q}><line x1={p.l} x2={w-p.r} y1={y(v)} y2={y(v)} stroke="var(--color-border)" strokeDasharray="3 4"/><text x={p.l-6} y={y(v)+4} textAnchor="end" fontSize="10" fill="var(--color-border-light)">{v.toFixed(0)}%</text></g>})}<line x1={p.l} x2={w-p.r} y1={y(0)} y2={y(0)} stroke="var(--color-heading)" opacity=".25"/><path d={`${path(primary)} L ${x(primary.length-1)} ${y(0)} L ${x(0)} ${y(0)} Z`} fill="var(--color-primary)" opacity=".07"/><path d={path(primary)} fill="none" stroke="var(--color-primary)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>{secondary&&<path d={path(secondary)} fill="none" stroke="#B98CD1" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}{months.map((m,i)=>(i%Math.max(1,Math.ceil(months.length/6))===0||i===months.length-1)?<text key={m} x={x(i)} y={h-7} textAnchor={i===0?'start':i===months.length-1?'end':'middle'} fontSize="10" fill="var(--color-primary)">{fmtMonthYear(m)}</text>:null)}{active!==null&&<g pointerEvents="none"><line x1={x(active)} x2={x(active)} y1={p.t} y2={h-p.b} stroke="var(--color-heading)" strokeDasharray="3 3"/><rect x={Math.max(3,Math.min(w-184,x(active)-88))} y="3" width="181" height={secondary?61:45} rx="10" fill="#fff" stroke="var(--color-border)"/><text x={Math.max(13,Math.min(w-174,x(active)-78))} y="18" fontSize="10" fontWeight="700">{fmtMonthYear(months[active])}</text><text x={Math.max(13,Math.min(w-174,x(active)-78))} y="35" fontSize="10" fill="var(--color-primary)">{primaryLabel}: {fmtPct(primary[active])}</text>{secondary&&<text x={Math.max(13,Math.min(w-174,x(active)-78))} y="51" fontSize="10" fill="#9B6CB5">{secondaryLabel}: {fmtPct(secondary[active])}</text>}</g>}</svg></div>;
}
function PortfolioPieChart({ rows, activeId, setActiveId }) { const size=170,stroke=28,r=(size-stroke)/2,c=size/2,circ=2*Math.PI*r;let acc=0;const selected=rows.find(x=>x.id===activeId),total=rows.reduce((a,b)=>a+b.value,0);return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={c} cy={c} r={r} fill="none" stroke="var(--color-bg-tint)" strokeWidth={stroke}/><g transform={`rotate(-90 ${c} ${c})`}>{rows.map((row,i)=>{const dash=row.pct/100*circ,off=-acc/100*circ;acc+=row.pct;return <circle key={row.id} cx={c} cy={c} r={r} fill="none" stroke={PIE_COLORS[i%PIE_COLORS.length]} strokeWidth={activeId===row.id?stroke+6:stroke} strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={off} opacity={!activeId||activeId===row.id?1:.25} onClick={()=>setActiveId(activeId===row.id?null:row.id)} style={{cursor:"pointer",transition:"all .18s"}}/>})}</g><text x={c} y={c-8} textAnchor="middle" fontSize="10" fill="var(--color-border-light)">{selected?selected.name:"Totale"}</text><text x={c} y={c+10} textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--color-heading)">{fmtEUR(selected?selected.value:total)}</text>{selected&&<text x={c} y={c+26} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--color-primary)">{selected.pct.toFixed(1)}%</text>}</svg>;}
function sumLatestValuationAsOf(items, valuations, itemIdField, cutoffFullDate) {
  const map = {};
  valuations.forEach((v) => {
    if (v.value_date > cutoffFullDate) return;
    const id = v[itemIdField];
    const cur = map[id];
    if (!cur || v.value_date > cur.value_date) map[id] = v;
  });
  let total = 0;
  items.forEach((it) => { const v = map[it.id]; if (v) total += Number(v.market_value); });
  return total;
}

function sumLatestValuationWithCostAsOf(items, valuations, itemIdField, cutoffFullDate) {
  const map = {};
  valuations.forEach((v) => {
    if (v.value_date > cutoffFullDate) return;
    const id = v[itemIdField];
    const cur = map[id];
    if (!cur || v.value_date > cur.value_date) map[id] = v;
  });
  let marketValue = 0, costBasis = 0;
  items.forEach((it) => {
    const v = map[it.id];
    if (v) { marketValue += Number(v.market_value); costBasis += Number(v.cost_basis); }
  });
  return { marketValue, costBasis };
}

function cashflowBalanceAtMonth(settings, entriesMap, monthKey) {
  if (!settings) return 0;
  if (monthKey === settings.monthKey) return settings.balance;
  if (monthKeyToIdx(monthKey) <= monthKeyToIdx(settings.monthKey)) return 0;
  const yearForChain = Number(monthKey.split("-")[0]);
  const chain = buildCashflowChain(settings, entriesMap, yearForChain);
  const r = chain[monthKey];
  return r && r.bankBalance !== null && r.bankBalance !== undefined ? r.bankBalance : 0;
}

function NetWorthApp({ session, onBack }) {

  const [reValuations, setReValuations] = useState([]);

  const [cfSettings, setCfSettings] = useState([]);
  const [cfEntries, setCfEntries] = useState([]);

  const [cursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [dashboardPeriod, setDashboardPeriod] = useState("ytd");
  const [dashboardPeriodMenuOpen, setDashboardPeriodMenuOpen] = useState(false);
  const [expandedCards, setExpandedCards] = useState({});

  useEffect(() => {
    (async () => {
      const [ih, iv, ip, ipv, rp, rpv, ca, cs, ce] = await Promise.all([
        supabase.from("investment_holdings").select("id"),
        supabase.from("investment_valuations").select("holding_id,value_date,market_value,cost_basis"),
