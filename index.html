<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Personal Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: 'Inter', system-ui, sans-serif; color: #0B2545; background: #FFFFFF; }
input, select, button { font-family: inherit; }
input:focus, select:focus, button:focus-visible { outline: 2px solid #2F6FED; outline-offset: 2px; }
.mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.bar-fill { transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
.fade-in { animation: fadeIn 0.35s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.splash { animation: splashFade 2s ease forwards; }
@keyframes splashFade { 0% { opacity: 0; transform: scale(0.97); } 10% { opacity: 1; transform: scale(1); } 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
.splash-ring { animation: ringPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
@keyframes ringPop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
.splash-bar-fill { animation: splashBar 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
@keyframes splashBar { from { width: 0%; } to { width: 100%; } }
.chip { transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.row-hover:hover { background: #F3F8FD; }
.scrollbar-thin::-webkit-scrollbar { width: 6px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: #DCE9F5; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) {
  .bar-fill, .fade-in, .splash, .splash-ring, .splash-bar-fill { animation: none !important; transition: none !important; }
  .splash-bar-fill { width: 100%; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useMemo } from "https://esm.sh/react@18";
import ReactDOM from "https://esm.sh/react-dom@18/client";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import {
  Home, ShoppingCart, UtensilsCrossed, Gift, AlertTriangle, CircleEllipsis,
  Plus, Download, Trash2, ChevronLeft, ChevronRight, Zap, Plane, Car, List,
  ArrowLeft, X, SlidersHorizontal, Menu, Check, Landmark, Heart, Stethoscope,
  PawPrint, Dumbbell, GraduationCap, Wrench, Smartphone, Coffee, Music,
  Gamepad2, Baby, Wifi, CreditCard, Briefcase, Tag, LogOut, Mail, Lock,
} from "https://esm.sh/lucide-react@0.383.0?deps=react@18";

// ==== Configurazione Supabase ====
const SUPABASE_URL = "https://fynjxnnxaremjazohhck.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tOb1ZKZ0sg4ozI3I80nVkQ_NGAIMZcr";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FIXED_CATEGORIES = [
  { id: "Affitto", label: "Affitto", icon: Home },
  { id: "Supermercato", label: "Supermercato", icon: ShoppingCart },
  { id: "Ristoranti", label: "Ristoranti", icon: UtensilsCrossed },
  { id: "Regali", label: "Regali", icon: Gift },
  { id: "Utenze", label: "Utenze", icon: Zap },
  { id: "Viaggi", label: "Viaggi", icon: Plane },
  { id: "Spostamenti", label: "Spostamenti", icon: Car },
  { id: "Imprevisti", label: "Imprevisti", icon: AlertTriangle },
];
const ALTRO_CATEGORY = { id: "Altro", label: "Altro", icon: CircleEllipsis };

const ICON_CHOICES = [
  { key: "Landmark", icon: Landmark }, { key: "Heart", icon: Heart },
  { key: "Stethoscope", icon: Stethoscope }, { key: "PawPrint", icon: PawPrint },
  { key: "Dumbbell", icon: Dumbbell }, { key: "GraduationCap", icon: GraduationCap },
  { key: "Wrench", icon: Wrench }, { key: "Smartphone", icon: Smartphone },
  { key: "Coffee", icon: Coffee }, { key: "Music", icon: Music },
  { key: "Gamepad2", icon: Gamepad2 }, { key: "Baby", icon: Baby },
  { key: "Wifi", icon: Wifi }, { key: "CreditCard", icon: CreditCard },
  { key: "Briefcase", icon: Briefcase }, { key: "Tag", icon: Tag },
];
const ICON_MAP = ICON_CHOICES.reduce((m, i) => ((m[i.key] = i.icon), m), {});

const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

function fmtEUR(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n);
}
function monthKey(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`;
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function App() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <SplashOnly />;
  if (!session) return <AuthScreen />;
  return <MainApp session={session} />;
}

function SplashOnly() {
  return (
    <div style={{ height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FFFFFF" }}>
      <span className="mono" style={{ color: "#2F6FED", fontSize: 20, fontWeight: 600 }}>€</span>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Controlla la tua email per confermare la registrazione.");
      }
    } catch (err) {
      setError(err.message || "Errore. Riprova.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FFFFFF", padding: 20 }}>
      <div className="fade-in" style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ width: 46, height: 46, borderRadius: "50%", border: "1.5px solid #2F6FED", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}>
            <span className="mono" style={{ fontSize: 20, fontWeight: 600, color: "#2F6FED" }}>€</span>
          </div>
          <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600 }}>Personal Finance</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: "#0B2545" }}>Tracker</div>
        </div>
        <form onSubmit={submit}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid #DCE9F5", borderRadius: 10, padding: "10px 12px", marginBottom: 10 }}>
            <Mail size={16} color="#5B7B9B" />
            <input type="email" required placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid #DCE9F5", borderRadius: 10, padding: "10px 12px", marginBottom: 16 }}>
            <Lock size={16} color="#5B7B9B" />
            <input type="password" required placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} minLength={6} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          {error && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 10 }}>{error}</div>}
          {info && <div style={{ color: "#2F6FED", fontSize: 13, marginBottom: 10 }}>{info}</div>}
          <button type="submit" disabled={loading} style={{ width: "100%", padding: "12px 0", borderRadius: 10, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
            {loading ? "Attendere…" : mode === "signin" ? "Accedi" : "Crea account"}
          </button>
        </form>
        <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setInfo(""); }} style={{ width: "100%", background: "none", border: "none", color: "#5B7B9B", fontSize: 13, marginTop: 16, cursor: "pointer" }}>
          {mode === "signin" ? "Non hai un account? Registrati" : "Hai già un account? Accedi"}
        </button>
      </div>
    </div>
  );
}

function MainApp({ session }) {
  const userId = session.user.id;
  const [splashVisible, setSplashVisible] = useState(true);
  const [expenses, setExpenses] = useState([]);
  const [customCategories, setCustomCategories] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [form, setForm] = useState({ category: "Supermercato", amount: "", date: todayISO(), note: "" });
  const [error, setError] = useState("");
  const [view, setView] = useState("home");
  const [showFilters, setShowFilters] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [newCatIcon, setNewCatIcon] = useState("Tag");
  const [catError, setCatError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [filters, setFilters] = useState({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });

  const CATEGORIES = useMemo(() => [...FIXED_CATEGORIES, ...customCategories.map((c) => ({ id: c.label, label: c.label, icon: ICON_MAP[c.icon_key] || Tag })), ALTRO_CATEGORY], [customCategories]);

  useEffect(() => { const t = setTimeout(() => setSplashVisible(false), 2000); return () => clearTimeout(t); }, []);

  useEffect(() => {
    (async () => {
      const { data: exp, error: expErr } = await supabase.from("expenses").select("*").order("date", { ascending: false });
      if (!expErr && exp) setExpenses(exp.map((e) => ({ id: e.id, category: e.category, amount: Number(e.amount), date: e.date, note: e.note || "" })));
      const { data: cats, error: catErr } = await supabase.from("custom_categories").select("*");
      if (!catErr && cats) setCustomCategories(cats);
      setLoaded(true);
    })();
  }, []);

  const currentKey = `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}`;
  const monthExpenses = useMemo(() => expenses.filter((e) => monthKey(e.date) === currentKey).sort((a, b) => new Date(b.date) - new Date(a.date)), [expenses, currentKey]);
  const byCategory = useMemo(() => {
    const map = {};
    CATEGORIES.forEach((c) => (map[c.id] = 0));
    monthExpenses.forEach((e) => (map[e.category] = (map[e.category] || 0) + Number(e.amount)));
    return map;
  }, [monthExpenses, CATEGORIES]);
  const total = useMemo(() => monthExpenses.reduce((s, e) => s + Number(e.amount), 0), [monthExpenses]);
  const maxCat = Math.max(1, ...Object.values(byCategory));

  const filtersActive = filters.dateFrom || filters.dateTo || filters.category !== "Tutte" || filters.amountMode !== "any";
  const filteredExpenses = useMemo(() => {
    return expenses.filter((e) => {
      if (filters.dateFrom && e.date < filters.dateFrom) return false;
      if (filters.dateTo && e.date > filters.dateTo) return false;
      if (filters.category !== "Tutte" && e.category !== filters.category) return false;
      const min = parseFloat(String(filters.amountMin).replace(",", "."));
      const max = parseFloat(String(filters.amountMax).replace(",", "."));
      if (filters.amountMode === "lt" && !isNaN(min) && !(e.amount < min)) return false;
      if (filters.amountMode === "gt" && !isNaN(min) && !(e.amount > min)) return false;
      if (filters.amountMode === "between") {
        if (!isNaN(min) && e.amount < min) return false;
        if (!isNaN(max) && e.amount > max) return false;
      }
      return true;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [expenses, filters]);
  const filteredTotal = useMemo(() => filteredExpenses.reduce((s, e) => s + Number(e.amount), 0), [filteredExpenses]);
  const resetFilters = () => setFilters({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });

  const goMonth = (delta) => {
    setCursor((c) => {
      let m = c.month + delta, y = c.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      return { year: y, month: m };
    });
  };

  const addExpense = async (e) => {
    e.preventDefault();
    const amt = parseFloat(String(form.amount).replace(",", "."));
    if (!amt || amt <= 0) { setError("Inserisci un importo valido."); return; }
    if (!form.date) { setError("Inserisci una data."); return; }
    setError("");
    setSaveState("saving");
    const { data, error: insErr } = await supabase.from("expenses").insert({ user_id: userId, category: form.category, amount: amt, date: form.date, note: form.note.trim() }).select().single();
    if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }
    setExpenses((prev) => [{ id: data.id, category: data.category, amount: Number(data.amount), date: data.date, note: data.note || "" }, ...prev]);
    setSaveState("saved");
    setForm({ ...form, amount: "", note: "" });
    setView("home");
  };

  const removeExpense = async (id) => {
    const prev = expenses;
    setExpenses(expenses.filter((e) => e.id !== id));
    const { error: delErr } = await supabase.from("expenses").delete().eq("id", id);
    if (delErr) { setExpenses(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
  };

  const addCategory = async () => {
    const label = newCatName.trim();
    if (!label) { setCatError("Inserisci un nome."); return; }
    const exists = CATEGORIES.some((c) => c.id.toLowerCase() === label.toLowerCase());
    if (exists) { setCatError("Questa voce esiste già."); return; }
    const { data, error: insErr } = await supabase.from("custom_categories").insert({ user_id: userId, label, icon_key: newCatIcon }).select().single();
    if (insErr) { setCatError(insErr.message); return; }
    setCustomCategories((prev) => [...prev, data]);
    setNewCatName(""); setNewCatIcon("Tag"); setCatError("");
    setView("home");
  };

  const removeCategory = async (id) => {
    const prev = customCategories;
    setCustomCategories(customCategories.filter((c) => c.id !== id));
    setConfirmDeleteId(null);
    const { error: delErr } = await supabase.from("custom_categories").delete().eq("id", id);
    if (delErr) { setCustomCategories(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
  };

  const exportCSV = (scope) => {
    const rows = scope === "filtered" ? filteredExpenses : [...expenses].sort((a, b) => new Date(a.date) - new Date(b.date));
    if (rows.length === 0) return;
    const header = "Data,Categoria,Importo,Nota";
    const lines = rows.map((e) => `${e.date},${e.category},${e.amount.toFixed(2)},"${(e.note || "").replace(/"/g, '""')}"`);
    const csv = [header, ...lines].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = scope === "filtered" ? "spese_filtrate.csv" : "spese_tutte.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const signOut = () => supabase.auth.signOut();

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      {splashVisible && (
        <div className="splash" style={{ position: "fixed", inset: 0, background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
            <div className="splash-ring" style={{ width: 46, height: 46, borderRadius: "50%", border: "1.5px solid #2F6FED", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <span className="mono" style={{ fontSize: 20, fontWeight: 600, color: "#2F6FED" }}>€</span>
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 4 }}>Personal Finance</div>
              <div style={{ fontSize: 27, fontWeight: 700, color: "#0B2545", letterSpacing: "-0.01em" }}>Tracker</div>
            </div>
            <div style={{ width: 80, height: 3, background: "#EFF5FB", borderRadius: 2, overflow: "hidden" }}>
              <div className="splash-bar-fill" style={{ height: "100%", background: "#2F6FED", borderRadius: 2 }} />
            </div>
          </div>
        </div>
      )}

      <div style={{ position: "relative", flexShrink: 0, zIndex: 30 }}>
        <div style={{ height: 48, background: "#2F6FED", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 16px" }}>
          <span style={{ color: "#FFFFFF", fontSize: 14, fontWeight: 600, letterSpacing: "-0.01em" }}>Personal Finance Tracker</span>
          <button onClick={() => setMenuOpen((s) => !s)} aria-label="Apri menu" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
            <Menu size={22} />
          </button>
        </div>
        {menuOpen && (
          <>
            <div onClick={() => setMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 29 }} />
            <div className="fade-in" style={{ position: "absolute", top: 52, right: 12, background: "#FFFFFF", border: "1px solid #DCE9F5", borderRadius: 10, boxShadow: "0 8px 24px rgba(11,37,69,0.14)", minWidth: 200, overflow: "hidden", zIndex: 31 }}>
              <button onClick={() => { setMenuOpen(false); setCatError(""); setView("addCategory"); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "12px 14px", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0B2545", textAlign: "left", borderBottom: "1px solid #EFF5FB" }}>
                <Plus size={15} color="#5B7B9B" /> Aggiungi nuova voce
              </button>
              <button onClick={() => { setMenuOpen(false); setConfirmDeleteId(null); setView("removeCategory"); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "12px 14px", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0B2545", textAlign: "left", borderBottom: "1px solid #EFF5FB" }}>
                <X size={15} color="#5B7B9B" /> Rimuovi voce
              </button>
              <button onClick={signOut} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "12px 14px", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#B4483A", textAlign: "left" }}>
                <LogOut size={15} /> Esci
              </button>
            </div>
          </>
        )}
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        {view === "home" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <button onClick={() => goMonth(-1)} aria-label="Mese precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B" }}><ChevronLeft size={18} /></button>
              <div style={{ fontSize: 11.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600 }}>{MESI[cursor.month]} {cursor.year}</div>
              <button onClick={() => goMonth(1)} aria-label="Mese successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B" }}><ChevronRight size={18} /></button>
            </div>
            <div key={currentKey} className="fade-in" style={{ textAlign: "center", padding: "2px 0 10px", borderBottom: "1px solid #DCE9F5", flexShrink: 0 }}>
              <div className="mono" style={{ fontSize: 34, fontWeight: 600, letterSpacing: "-0.01em", lineHeight: 1.1 }}>{fmtEUR(total)}</div>
              <div style={{ fontSize: 11.5, color: "#5B7B9B", marginTop: 1 }}>{monthExpenses.length} {monthExpenses.length === 1 ? "movimento" : "movimenti"} questo mese</div>
            </div>
            <div style={{ flexShrink: 0, padding: "6px 0" }}>
              {CATEGORIES.map((c) => {
                const Icon = c.icon;
                const val = byCategory[c.id] || 0;
                const pct = Math.round((val / maxCat) * 100);
                const pctOfTotal = total > 0 ? Math.round((val / total) * 100) : 0;
                return (
                  <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "6px 0" }}>
                    <Icon size={16} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 15, marginBottom: 4 }}>
                        <span>{c.label}</span>
                        <span style={{ display: "flex", alignItems: "baseline", gap: 7 }}>
                          <span className="mono" style={{ fontSize: 12, color: "#B7C9DC", width: 32, textAlign: "right" }}>{val > 0 ? `${pctOfTotal}%` : ""}</span>
                          <span className="mono" style={{ fontSize: 16, fontWeight: 600, color: val > 0 ? "#0B2545" : "#B7C9DC" }}>{fmtEUR(val)}</span>
                        </span>
                      </div>
                      <div style={{ height: 5, background: "#EFF5FB", borderRadius: 3, overflow: "hidden" }}>
                        <div className="bar-fill" style={{ height: "100%", width: `${val > 0 ? pct : 0}%`, background: "#2F6FED", borderRadius: 3 }} />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexShrink: 0 }}>
              <button onClick={() => setView("add")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                <Plus size={16} /> Inserisci movimento
              </button>
              <button onClick={() => setView("list")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#0B2545", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                <List size={16} /> Lista movimenti
              </button>
            </div>
            <div style={{ flex: 1, minHeight: 0 }} />
            <div style={{ textAlign: "center", fontSize: 10.5, color: saveState === "error" ? "#B4483A" : "#B7C9DC", marginTop: 6, flexShrink: 0 }}>
              {loaded ? (saveState === "saving" ? "Salvataggio…" : saveState === "error" ? `Errore: ${lastErrorMsg}` : "Dati sincronizzati") : "Caricamento…"}
            </div>
          </>
        ) : view === "add" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Nuovo movimento</div>
            </div>
            <form onSubmit={addExpense} className="fade-in" style={{ marginTop: 18, flex: 1, minHeight: 0, overflowY: "auto", display: "flex", flexDirection: "column" }}>
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 10 }}>Categoria</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 24 }}>
                {CATEGORIES.map((c) => (
                  <button type="button" key={c.id} className="chip" onClick={() => setForm({ ...form, category: c.id })} style={{ fontSize: 14, padding: "8px 14px", borderRadius: 999, border: form.category === c.id ? "1px solid #2F6FED" : "1px solid #DCE9F5", background: form.category === c.id ? "#2F6FED" : "#FFFFFF", color: form.category === c.id ? "#FFFFFF" : "#0B2545", cursor: "pointer" }}>
                    {c.label}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Importo</div>
              <input type="text" inputMode="decimal" placeholder="0,00 €" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} className="mono" autoFocus style={{ width: "95%", margin: "0 auto 20px", display: "block", padding: "14px 14px", borderRadius: 10, border: "1px solid #DCE9F5", fontSize: 24, fontWeight: 600 }} />
              <div style={{ display: "flex", gap: 12, marginBottom: 20 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Data</div>
                  <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={{ width: "95%", margin: "0 auto", display: "block", padding: "12px 12px", borderRadius: 10, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545" }} />
                </div>
              </div>
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Nota (opzionale)</div>
              <input type="text" placeholder="Es. cena con amici" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} style={{ width: "95%", margin: "0 auto 8px", display: "block", padding: "12px 14px", borderRadius: 10, border: "1px solid #DCE9F5", fontSize: 16 }} />
              {error && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{error}</div>}
              <div style={{ flex: 1, minHeight: 8 }} />
              <button type="submit" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "14px 0", borderRadius: 10, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 15.5, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>
                <Plus size={17} /> Aggiungi movimento
              </button>
            </form>
          </>
        ) : view === "addCategory" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Aggiungi nuova voce</div>
            </div>
            <div style={{ marginTop: 18, flex: 1, minHeight: 0, overflowY: "auto", display: "flex", flexDirection: "column" }} className="scrollbar-thin">
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Nome</div>
              <input type="text" placeholder="Es. Mutuo" value={newCatName} onChange={(e) => { setNewCatName(e.target.value); setCatError(""); }} autoFocus style={{ width: "95%", margin: "0 auto 20px", display: "block", padding: "12px 14px", borderRadius: 10, border: "1px solid #DCE9F5", fontSize: 16 }} />
              <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 10 }}>Icona</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 16 }}>
                {ICON_CHOICES.map(({ key, icon: IconComp }) => (
                  <button type="button" key={key} onClick={() => setNewCatIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, cursor: "pointer", border: newCatIcon === key ? "1.5px solid #2F6FED" : "1px solid #DCE9F5", background: newCatIcon === key ? "#EFF5FB" : "#FFFFFF" }}>
                    <IconComp size={19} color={newCatIcon === key ? "#2F6FED" : "#5B7B9B"} />
                  </button>
                ))}
              </div>
              {catError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{catError}</div>}
              <div style={{ flex: 1, minHeight: 8 }} />
              <button onClick={addCategory} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "14px 0", borderRadius: 10, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 15.5, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>
                <Plus size={17} /> Crea voce
              </button>
            </div>
          </>
        ) : view === "removeCategory" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Rimuovi voce</div>
            </div>
            <div style={{ marginTop: 14, flex: 1, minHeight: 0, overflowY: "auto" }} className="scrollbar-thin">
              {customCategories.length > 0 ? customCategories.map((c) => {
                const IconComp = ICON_MAP[c.icon_key] || Tag;
                const confirming = confirmDeleteId === c.id;
                return (
                  <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 4px", borderBottom: "1px dotted #DCE9F5" }}>
                    <IconComp size={17} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, fontSize: 15 }}>{c.label}</div>
                    {confirming ? (
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 12, color: "#5B7B9B" }}>Confermi?</span>
                        <button onClick={() => removeCategory(c.id)} aria-label="Conferma rimozione" style={{ background: "#B4483A", border: "none", borderRadius: 6, padding: 6, cursor: "pointer", color: "#FFFFFF", display: "flex" }}><Check size={14} /></button>
                        <button onClick={() => setConfirmDeleteId(null)} aria-label="Annulla" style={{ background: "#FFFFFF", border: "1px solid #DCE9F5", borderRadius: 6, padding: 6, cursor: "pointer", color: "#5B7B9B", display: "flex" }}><X size={14} /></button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDeleteId(c.id)} aria-label="Rimuovi" style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#B7C9DC", flexShrink: 0 }}><Trash2 size={15} /></button>
                    )}
                  </div>
                );
              }) : (
                <div style={{ fontSize: 13, color: "#B7C9DC", padding: "10px 4px" }}>Nessuna voce personalizzata da rimuovere. Le categorie predefinite non possono essere eliminate.</div>
              )}
            </div>
          </>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Movimenti</div>
              <button onClick={() => setShowFilters((s) => !s)} style={{ display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 999, border: filtersActive ? "1px solid #2F6FED" : "1px solid #DCE9F5", background: filtersActive ? "#2F6FED" : "#FFFFFF", color: filtersActive ? "#FFFFFF" : "#5B7B9B", fontSize: 12, cursor: "pointer" }}>
                <SlidersHorizontal size={13} /> Filtri
              </button>
            </div>
            {showFilters && (
              <div className="fade-in" style={{ marginTop: 8, padding: 10, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5", flexShrink: 0 }}>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Periodo</div>
                <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                  <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value })} aria-label="Da data" style={{ flex: 1, minWidth: 0, padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545" }} />
                  <input type="date" value={filters.dateTo} onChange={(e) => setFilters({ ...filters, dateTo: e.target.value })} aria-label="A data" style={{ flex: 1, minWidth: 0, padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545" }} />
                </div>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Categoria</div>
                <select value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })} style={{ width: "100%", padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545", marginBottom: 8, background: "#FFFFFF" }}>
                  <option value="Tutte">Tutte le categorie</option>
                  {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Importo</div>
                <select value={filters.amountMode} onChange={(e) => setFilters({ ...filters, amountMode: e.target.value })} style={{ width: "100%", padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545", marginBottom: 6, background: "#FFFFFF" }}>
                  <option value="any">Qualsiasi importo</option>
                  <option value="lt">Inferiore a</option>
                  <option value="gt">Superiore a</option>
                  <option value="between">Compreso tra</option>
                </select>
                {filters.amountMode !== "any" && (
                  <div style={{ display: "flex", gap: 6 }}>
                    <input type="text" inputMode="decimal" placeholder={filters.amountMode === "between" ? "Min €" : "€"} value={filters.amountMin} onChange={(e) => setFilters({ ...filters, amountMin: e.target.value })} className="mono" style={{ flex: 1, minWidth: 0, padding: "6px 10px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16 }} />
                    {filters.amountMode === "between" && (
                      <input type="text" inputMode="decimal" placeholder="Max €" value={filters.amountMax} onChange={(e) => setFilters({ ...filters, amountMax: e.target.value })} className="mono" style={{ flex: 1, minWidth: 0, padding: "6px 10px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16 }} />
                    )}
                  </div>
                )}
                {filtersActive && (
                  <button onClick={resetFilters} style={{ marginTop: 10, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "8px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#B4483A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                    <X size={13} /> Rimuovi filtri
                  </button>
                )}
              </div>
            )}
            <div className="mono" style={{ fontSize: 13, color: "#5B7B9B", padding: "8px 0", borderBottom: "1px solid #DCE9F5", flexShrink: 0, marginTop: showFilters ? 0 : 8 }}>
              Totale: <span style={{ color: "#0B2545", fontWeight: 600 }}>{fmtEUR(filteredTotal)}</span> · {filteredExpenses.length} {filteredExpenses.length === 1 ? "movimento" : "movimenti"}
            </div>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", marginTop: 4 }}>
              {filteredExpenses.length > 0 ? filteredExpenses.map((e) => {
                const cat = CATEGORIES.find((c) => c.id === e.category);
                const Icon = cat ? cat.icon : CircleEllipsis;
                const d = new Date(e.date);
                return (
                  <div key={e.id} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 6px", borderBottom: "1px dotted #DCE9F5" }}>
                    <Icon size={18} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ width: 40, fontSize: 14, color: "#5B7B9B", flexShrink: 0 }}>{String(d.getDate()).padStart(2, "0")}/{String(d.getMonth() + 1).padStart(2, "0")}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 17, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.note ? e.note : cat ? cat.label : e.category}</div>
                      {e.note && <div style={{ fontSize: 13, color: "#B7C9DC" }}>{e.category}</div>}
                    </div>
                    <div className="mono" style={{ fontSize: 18, fontWeight: 600, flexShrink: 0 }}>{fmtEUR(e.amount)}</div>
                    <button onClick={() => removeExpense(e.id)} aria-label="Elimina" style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#B7C9DC", flexShrink: 0 }}><Trash2 size={15} /></button>
                  </div>
                );
              }) : (
                <div style={{ fontSize: 12.5, color: "#B7C9DC", padding: "10px 4px" }}>Nessun movimento corrisponde ai filtri.</div>
              )}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => exportCSV("filtered")} disabled={filteredExpenses.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: filteredExpenses.length ? "#0B2545" : "#B7C9DC", fontSize: 12, cursor: filteredExpenses.length ? "pointer" : "not-allowed" }}>
                <Download size={13} /> CSV filtrato
              </button>
              <button onClick={() => exportCSV("all")} disabled={expenses.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: expenses.length ? "#0B2545" : "#B7C9DC", fontSize: 12, cursor: expenses.length ? "pointer" : "not-allowed" }}>
                <Download size={13} /> CSV completo
              </button>
            </div>
            <div style={{ textAlign: "center", fontSize: 10.5, color: "#B7C9DC", marginTop: 6, flexShrink: 0 }}>Dati sincronizzati</div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
