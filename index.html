        supabase.from("real_estate_properties").select("id"),
        supabase.from("real_estate_valuations").select("property_id,value_date,market_value,cost_basis"),
        supabase.from("cashflow_accounts").select("id"),
        supabase.from("cashflow_settings").select("*"),
        supabase.from("cashflow_entries").select("*"),
      ]);
      setInvestHoldings(ih.data || []);
      setInvestValuations(iv.data || []);
      setInsurancePolicies(ip.data || []);
      setInsuranceValuations(ipv.data || []);
      setReProperties(rp.data || []);
      setReValuations(rpv.data || []);
      setCfAccounts(ca.data || []);
      setCfSettings((cs.data || []).map((s) => ({ id: s.id, account_id: s.account_id, balance: Number(s.opening_balance), monthKey: fullDateToMonth(s.opening_date) })));
      setCfEntries((ce.data || []).map((e) => ({ ...e, income: Number(e.income), investments: Number(e.investments), expenses: Number(e.expenses), bank_balance: e.bank_balance === null ? null : Number(e.bank_balance) })));
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);
  const cursorMonthKey = monthKeyFromIdx(cursor.year * 12 + cursor.month);


  const investTotal = useMemo(() => sumLatestValuationAsOf(investHoldings, investValuations, "holding_id", cursorFullDate), [investHoldings, investValuations, cursorFullDate]);
  const insuranceTotal = useMemo(() => sumLatestValuationAsOf(insurancePolicies, insuranceValuations, "policy_id", cursorFullDate), [insurancePolicies, insuranceValuations, cursorFullDate]);
  const realEstateTotal = useMemo(() => sumLatestValuationAsOf(reProperties, reValuations, "property_id", cursorFullDate), [reProperties, reValuations, cursorFullDate]);

  const cfSettingsByAccount = useMemo(() => {
    const m = {};
    cfSettings.forEach((s) => { m[s.account_id] = s; });
    return m;
  }, [cfSettings]);
  const cfEntriesByAccount = useMemo(() => {
    const m = {};
    cfEntries.forEach((e) => {
      if (!m[e.account_id]) m[e.account_id] = {};
      m[e.account_id][fullDateToMonth(e.value_date)] = e;
    });
    return m;
  }, [cfEntries]);

  const cashflowTotal = useMemo(() => {
    let total = 0;
    cfAccounts.forEach((acc) => {
      const s = cfSettingsByAccount[acc.id];
      total += cashflowBalanceAtMonth(s, cfEntriesByAccount[acc.id] || {}, cursorMonthKey);
    });
    return total;
  }, [cfAccounts, cfSettingsByAccount, cfEntriesByAccount, cursorMonthKey]);

  const grandTotal = investTotal + insuranceTotal + realEstateTotal + cashflowTotal;

  const [dashboardView, setDashboardView] = useState("list");
  const buildNetWorthMapAsOf = (cutoffFullDate) => {
    const mk = fullDateToMonth(cutoffFullDate);
    const invest = sumLatestValuationWithCostAsOf(investHoldings, investValuations, "holding_id", cutoffFullDate);
    const insurance = sumLatestValuationWithCostAsOf(insurancePolicies, insuranceValuations, "policy_id", cutoffFullDate);
    const realestate = sumLatestValuationWithCostAsOf(reProperties, reValuations, "property_id", cutoffFullDate);
    let cashflow = 0;
    cfAccounts.forEach((acc) => {
      const s = cfSettingsByAccount[acc.id];
      cashflow += cashflowBalanceAtMonth(s, cfEntriesByAccount[acc.id] || {}, mk);
    });
    return { invest, insurance, realestate, cashflow: { marketValue: cashflow, costBasis: cashflow } };
  };

  const dashboardEndIdx = cursor.year * 12 + cursor.month;
  const dashboardStartIdx = dashboardPeriod === "month" ? dashboardEndIdx - 1 : dashboardPeriod === "ytd" ? cursor.year * 12 - 1 : dashboardEndIdx - 12;
  const dashboardStartFullDate = monthDateToFull(monthKeyFromIdx(dashboardStartIdx));
  const dashboardPeriodLabel = dashboardPeriod === "month"
    ? `${MESI[cursor.month]} ${cursor.year}`
    : dashboardPeriod === "ytd"
      ? `Gen–${MESI[cursor.month].slice(0, 3)} ${String(cursor.year).slice(-2)}`
      : `${fmtMonthYear(monthKeyFromIdx(dashboardStartIdx + 1))}–${fmtMonthYear(monthKeyFromIdx(dashboardEndIdx))}`;
  const dashboardStartMap = useMemo(() => buildNetWorthMapAsOf(dashboardStartFullDate), [dashboardStartFullDate, investHoldings, investValuations, insurancePolicies, insuranceValuations, reProperties, reValuations, cfAccounts, cfSettingsByAccount, cfEntriesByAccount]);
  const dashboardEndMap = useMemo(() => buildNetWorthMapAsOf(cursorFullDate), [cursorFullDate, investHoldings, investValuations, insurancePolicies, insuranceValuations, reProperties, reValuations, cfAccounts, cfSettingsByAccount, cfEntriesByAccount]);
  const dashboardSeriesMonths = useMemo(() => {
    const months = [];
    for (let idx = dashboardStartIdx; idx <= dashboardEndIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [dashboardStartIdx, dashboardEndIdx]);
  const totalsForKeys = (map, keys) => keys.reduce((acc, key) => {
    const t = map[key] || { marketValue: 0, costBasis: 0 };
    acc.marketValue += t.marketValue;
    acc.costBasis += t.costBasis;
    return acc;
  }, { marketValue: 0, costBasis: 0 });
  const dashboardCardData = (keys) => {
    const end = totalsForKeys(dashboardEndMap, keys);
    const start = totalsForKeys(dashboardStartMap, keys);
    const gain = end.marketValue - end.costBasis;
    const gainPct = end.costBasis > 0 ? (gain / end.costBasis) * 100 : null;
    const investedDelta = end.costBasis - start.costBasis;
    const sparklineValues = dashboardSeriesMonths.map((mk) => {
      const t = totalsForKeys(buildNetWorthMapAsOf(monthDateToFull(mk)), keys);
      return t.costBasis > 0 ? ((t.marketValue - t.costBasis) / t.costBasis) * 100 : null;
    }).filter((v) => v !== null && Number.isFinite(v));
    const startReturn = start.costBasis > 0 ? ((start.marketValue - start.costBasis) / start.costBasis) * 100 : null;
    const periodReturnDelta = gainPct !== null && startReturn !== null ? gainPct - startReturn : null;
    return { ...end, gain, gainPct, investedDelta, sparklineValues, periodReturnDelta };
  };
  const investDashboard = dashboardCardData(["invest"]);

    return { marketValue, gain, costBasis };

    const endIdx = Math.max(...monthKeys.map(toIdx));

    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));

                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} className="btn-outline-strong" style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", fontSize: 14, marginBottom: 8 }}>Elimina solo questo mese</button>
                      <button onClick={async () => { await deleteValuation("all"); setEditingValId(null); }} className="btn-danger-outline">Elimina tutti i {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  ) : (
                    <>
                      <div className="text-md" style={{ marginBottom: 6 }}>Eliminare questo valore?</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} className="btn-danger-outline">Sì, elimina</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  )}
                </div>
              </>
            )}

            {removalHolding && (
              <>
                <div onClick={() => setRemovalHolding(null)} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in modal-panel" style={{ zIndex: 40 }}>
                  <div className="text-md" style={{ marginBottom: 6 }}>Eliminare "{removalHolding.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questo titolo. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deleteHolding(); setView("portfolio"); }} className="btn-danger-outline">Sì, elimina titolo</button>
                  <button onClick={() => setRemovalHolding(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function InsuranceApp({ session, onBack }) {
  const kbOffset = useKeyboardOffset();
  const userId = session.user.id;
  const [policies, setPolicies] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePolicyId, setActivePolicyId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  const [addingPolicy, setAddingPolicy] = useState(false);
  const [newPolicyName, setNewPolicyName] = useState("");
  const [newPolicyIcon, setNewPolicyIcon] = useState("Shield");
  const [policyError, setPolicyError] = useState("");
  const [policyBusy, setPolicyBusy] = useState(false);
  const [removalPolicy, setRemovalPolicy] = useState(null);
  const [editingPolicyId, setEditingPolicyId] = useState(null);
  const [editPolicyName, setEditPolicyName] = useState("");
  const [editPolicyIcon, setEditPolicyIcon] = useState("Shield");
  const [editPolicyError, setEditPolicyError] = useState("");
  const [editPolicyBusy, setEditPolicyBusy] = useState(false);


  useEffect(() => {
    (async () => {
      const { data: pol, error: polErr } = await supabase.from("insurance_policies").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("insurance_valuations").select("*").order("value_date", { ascending: false });
      setPolicies(!polErr && pol ? pol : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.policy_id];
      if (!cur || v.value_date > cur.value_date) map[v.policy_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);

  const policyTotalsFromMap = (policyId, map) => {
    const v = map[policyId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const policyTotals = (policyId) => policyTotalsFromMap(policyId, valuationAsOfCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    policies.forEach((p) => {
      const t = policyTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [policies, valuations, valuationAsOfCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);

  const [dashboardView, setDashboardView] = useState("chart");
  const historyMonths = useMemo(() => {
    if (valuations.length === 0) return [];
    const monthKeys = valuations.map((v) => fullDateToMonth(v.value_date));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx));
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [valuations]);

  const policySparkline = (policyId) => {
    const relevantMonths = [...new Set(valuations.filter((v) => v.policy_id === policyId && v.value_date <= cursorFullDate).map((v) => fullDateToMonth(v.value_date)))].sort();
    const lastMonths = relevantMonths.slice(-6);
    return lastMonths
      .map((mk) => returnPct(policyTotalsFromMap(policyId, buildValuationMap(monthDateToFull(mk)))))
      .filter((v) => v !== null);
  };

  const activePolicy = policies.find((p) => p.id === activePolicyId);
  const policyValuations = useMemo(() => valuations.filter((v) => v.policy_id === activePolicyId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activePolicyId]);

  const openPolicy = (p) => { setActivePolicyId(p.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("policy"); };

  const addPolicy = async () => {
    if (policyBusy) return;
    const name = newPolicyName.trim();
    if (!name) { setPolicyError("Inserisci un nome."); return; }
    setPolicyBusy(true);
    const { data, error: insErr } = await supabase.from("insurance_policies").insert({ user_id: userId, name, icon_key: newPolicyIcon }).select().single();
    setPolicyBusy(false);
    if (insErr) { setPolicyError(insErr.message); return; }
    setPolicies((prev) => [...prev, data]);
    setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); setAddingPolicy(false);
  };

  const openEditPolicy = (p) => {
    setEditingPolicyId(p.id);
    setEditPolicyName(p.name);
    setEditPolicyIcon(p.icon_key || "Shield");
    setEditPolicyError("");
  };

  const saveEditPolicy = async () => {
    if (editPolicyBusy) return;
    const name = editPolicyName.trim();
    if (!name) { setEditPolicyError("Inserisci un nome."); return; }
    setEditPolicyBusy(true);
    const { data, error: updErr } = await supabase.from("insurance_policies").update({ name, icon_key: editPolicyIcon }).eq("id", editingPolicyId).select().single();
    setEditPolicyBusy(false);
    if (updErr) { setEditPolicyError(updErr.message); return; }
    setPolicies((prev) => prev.map((p) => (p.id === editingPolicyId ? data : p)));
    setEditingPolicyId(null);
  };

  const deletePolicy = async () => {
    const p = removalPolicy;
    const { error: delErr } = await supabase.from("insurance_policies").delete().eq("id", p.id);
    if (!delErr) {
      setPolicies((prev) => prev.filter((x) => x.id !== p.id));
      setValuations((prev) => prev.filter((v) => v.policy_id !== p.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalPolicy(null);
  };

  const val = useValuations({
    userId, table: "insurance_valuations", idField: "policy_id", activeId: activePolicyId,
    valuations, setValuations,
    mvErrorMsg: "Inserisci un valore attuale valido.", cbErrorMsg: "Inserisci un valore versato valido.",
    supportsPAC: true,
    onDeleteError: (msg) => { setSaveState("error"); setLastErrorMsg(msg); },
  });
  const {
    valForm, setValForm, valError, setValError,
    editingValId, setEditingValId,
    editValForm, setEditValForm, editValScope, setEditValScope, editValError, setEditValError,
    removalValuation, setRemovalValuation,
    bulkOverrideConfirm, setBulkOverrideConfirm, pendingManualCount,
    addValuation, openEditValuation, editValGroupSize, isContributionGroup, saveEditValuation, deleteValuation,
  } = val;

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando assicurazioni e previdenza…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", minWidth: 0 }}>
          <button onClick={() => {
            if (view === "policy") { setView("home"); setEditingValId(null); }
            else onBack();
          }} aria-label="Torna indietro" className="btn-icon" style={{ padding: 8, color: "#FFFFFF" }}>
            <ArrowLeft size={22} />
          </button>
          <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {view === "home" ? "Assicurazioni e Previdenza" : (activePolicy ? activePolicy.name : "")}
          </span>
        </div>
        {view === "home" && (
          <button onClick={() => setAddingPolicy(true)} aria-label="Nuova polizza o fondo" style={{ width: 36, height: 36, borderRadius: "var(--radius-sm)", border: "none", background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, marginRight: 4 }}>
            <Plus size={20} color="var(--color-primary)" />
          </button>
        )}
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        {view === "home" ? (
          <>
            <div style={{ display: "flex", justifyContent: "center", gap: 28, padding: "4px 0 12px", flexShrink: 0, borderBottom: "1px solid var(--color-border)" }}>
              <button onClick={() => setDashboardView("chart")} style={{ background: "none", border: "none", borderBottom: dashboardView === "chart" ? "2px solid var(--color-primary)" : "2px solid transparent", padding: "0 2px 10px", marginBottom: -1, color: dashboardView === "chart" ? "var(--color-heading)" : "var(--color-border-light)", fontSize: 14.5, fontWeight: 600, cursor: "pointer" }}>
                Statistiche
              </button>
              <button onClick={() => setDashboardView("list")} style={{ background: "none", border: "none", borderBottom: dashboardView === "list" ? "2px solid var(--color-primary)" : "2px solid transparent", padding: "0 2px 10px", marginBottom: -1, color: dashboardView === "list" ? "var(--color-heading)" : "var(--color-border-light)", fontSize: 14.5, fontWeight: 600, cursor: "pointer" }}>
                Elenco
              </button>
            </div>

            {dashboardView === "chart" ? (
              <StatsSection
                items={policies}
                getName={(p) => p.name}
                getIcon={(p) => INSURANCE_ICON_MAP[p.icon_key] || Shield}
                buildMapAsOf={buildValuationMap}
                getTotalsFromMap={(p, map) => policyTotalsFromMap(p.id, map)}
                historyMonths={historyMonths}
                cursorFullDate={cursorFullDate}
                chartTitle="Andamento del capitale"
                compositionTitle="Composizione polizze e fondi"
                biggestLabel="Voce più grande"
                performantLabel="Voce più performante"
                growthLabel="In maggior crescita"
                emptyMessage="Non hai ancora nessuna polizza o fondo."
              />
            ) : (
              <>
            <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <button onClick={() => goCursor(-1)} aria-label="Mese precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--color-border-light)", flexShrink: 0 }}><ChevronLeft size={18} /></button>
              <div onClick={() => { setPickerYear(cursor.year); setDatePickerOpen(true); }} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 13, letterSpacing: "0.01em", color: "var(--color-border-light)", fontWeight: 600, whiteSpace: "nowrap", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", cursor: "pointer", textTransform: "capitalize" }}>
                <Calendar size={13} />
                {MESI[cursor.month]} {String(cursor.year).slice(-2)}
              </div>
              <button onClick={() => goCursor(1)} aria-label="Mese successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--color-border-light)", flexShrink: 0 }}><ChevronRight size={18} /></button>

              {datePickerOpen && (
                <MonthYearPickerPopup
                  pickerYear={pickerYear} setPickerYear={setPickerYear}
                  selectedYear={cursor.year} selectedMonth={cursor.month}
                  onSelectMonth={(y, m) => { setCursor({ year: y, month: m }); setDatePickerOpen(false); }}
                  onClose={() => setDatePickerOpen(false)}
                />
              )}
            </div>
            <div key={`${cursor.year}-${cursor.month}`} className="fade-in" style={{ textAlign: "center", padding: "4px 0 14px", borderBottom: "1px solid var(--color-border)", flexShrink: 0 }}>
              <div className="mono" style={{ fontSize: 32, fontWeight: 600, letterSpacing: "-0.01em", color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal.marketValue)}</Money></div>
              <div style={{ display: "inline-flex", alignItems: "center", marginTop: 3, padding: "5px 14px", borderRadius: 20, background: "var(--color-bg-tint)" }}>
                <span className="mono text-xs" style={{ color: grandTotal.gain > 0 ? "var(--color-success)" : grandTotal.gain < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
                  <Money>{grandTotal.gain > 0 ? "+" : ""}{fmtEUR(grandTotal.gain)}</Money>{returnPct(grandTotal) !== null && ` (${fmtPct(returnPct(grandTotal))})`}
                </span>
              </div>
            </div>

            <div className="scrollbar-thin" style={{ flex: "1 1 auto", maxHeight: 487, minHeight: 0, overflowY: "auto", padding: "10px 0", display: "flex", flexDirection: "column", gap: 8 }}>
              {policies.length === 0 ? (
                <div style={{ textAlign: "center", padding: "30px 10px" }}>
                  <Shield size={34} color="var(--color-border-light)" style={{ marginBottom: 12 }} />
                  <div style={{ fontSize: 14, color: "var(--color-primary)" }}>Non hai ancora nessuna polizza o fondo.</div>
                </div>
              ) : policies.map((p) => {
                const t = policyTotals(p.id);
                const PIcon = INSURANCE_ICON_MAP[p.icon_key] || Shield;
                const weightPct = grandTotal.marketValue > 0 ? (t.marketValue / grandTotal.marketValue) * 100 : 0;
                const rPct = returnPct(t);
                return (
                  <ListItemCard
                    key={p.id}
                    icon={PIcon}
                    name={p.name}
                    value={t.marketValue}
                    hasData={t.hasData}
                    gain={t.gain}
                    gainPct={rPct}
                    weightPct={weightPct}
                    sparklineValues={policySparkline(p.id)}
                    onClick={() => openPolicy(p)}
                  />
                );
              })}
            </div>

            {addingPolicy && (
              <>
                <div onClick={() => { setAddingPolicy(false); setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); }} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in scrollbar-thin modal-panel" style={{ bottom: 24 + kbOffset, maxHeight: "75dvh", overflowY: "auto", zIndex: 40 }}>
                  <div className="text-md" style={{ marginBottom: 14 }}>Nuova polizza o fondo</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome polizza o fondo</div>
                  <input type="text" placeholder="Es. Fondo Pensione Aperto" value={newPolicyName} onChange={(e) => { setNewPolicyName(e.target.value); setPolicyError(""); }} autoFocus className="input-field-lg" />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {INSURANCE_ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setNewPolicyIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "var(--radius-md)", cursor: "pointer", border: newPolicyIcon === key ? "1.5px solid var(--color-primary)" : "1px solid var(--color-border)", background: newPolicyIcon === key ? "var(--color-bg-tint)" : "#FFFFFF" }}>
                        <IconComp size={19} color={newPolicyIcon === key ? "var(--color-primary)" : "var(--color-primary)"} />
                      </button>
                    ))}
                  </div>
                  {policyError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{policyError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setAddingPolicy(false); setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); }} className="btn-outline" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>Annulla</button>
                    <button onClick={addPolicy} disabled={policyBusy} className="text-sm" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", border: "none", background: policyBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", cursor: policyBusy ? "default" : "pointer" }}>Crea</button>
                  </div>
                </div>
              </>
            )}

              </>
            )}

            {removalPolicy && (
              <>
                <div onClick={() => setRemovalPolicy(null)} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in modal-panel" style={{ zIndex: 40 }}>
                  <div className="text-md" style={{ marginBottom: 6 }}>Eliminare "{removalPolicy.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questa voce. L'operazione non è reversibile.</div>
                  <button onClick={deletePolicy} className="btn-danger-outline">Sì, elimina</button>
                  <button onClick={() => setRemovalPolicy(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        ) : (
          <>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 0" }}>
              <div className="section-label" style={{ marginBottom: 10 }}>Aggiungi valore mensile</div>
              <form onSubmit={addValuation} style={{ padding: 12, background: "var(--color-bg-tint)", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border)", marginBottom: 20 }}>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                    <div className="section-label" style={{ marginBottom: 6 }}>Mese</div>
                    <input type="month" value={valForm.value_date} onChange={(e) => setValForm({ ...valForm, value_date: e.target.value })} className="input-month" />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="section-label" style={{ marginBottom: 6 }}>Valore attuale</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.market_value} onChange={(e) => setValForm({ ...valForm, market_value: e.target.value })} className="mono input-field" />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="section-label" style={{ marginBottom: 6 }}>Versato</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.cost_basis} onChange={(e) => setValForm({ ...valForm, cost_basis: e.target.value })} className="mono input-field" />
                  </div>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div onClick={() => { const next = !valForm.carryForward; setValForm({ ...valForm, carryForward: next, carryUntil: next ? valForm.value_date : "", recurringContribution: false, contributionUntil: "", contributionAmount: "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: valForm.carryForward ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: valForm.carryForward ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {valForm.carryForward && <Check size={12} color="#FFFFFF" />}
                    </div>
                    <span style={{ fontSize: 13.5, color: "var(--color-heading)" }}>Porta avanti questo valore fino a...</span>
                  </div>
                  {valForm.carryForward && (
                    <div className="fade-in" style={{ marginTop: 8 }}>
                      <input type="month" value={valForm.carryUntil} min={valForm.value_date} onChange={(e) => setValForm({ ...valForm, carryUntil: e.target.value })} className="input-month" />
                      <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginTop: 6 }}>Stesso valore di mercato e costo storico ripetuto ogni mese fino a quello scelto (incluso). Potrai comunque modificarlo in un mese specifico in seguito.</div>
                    </div>
                  )}
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div onClick={() => { const next = !valForm.recurringContribution; setValForm({ ...valForm, recurringContribution: next, contributionUntil: next ? valForm.value_date : "", contributionAmount: next ? valForm.contributionAmount : "", carryForward: false, carryUntil: "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: valForm.recurringContribution ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: valForm.recurringContribution ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {valForm.recurringContribution && <Check size={12} color="#FFFFFF" />}
                    </div>
                    <span style={{ fontSize: 13.5, color: "var(--color-heading)" }}>Versamento ricorrente (PAC)</span>
                  </div>
                  {valForm.recurringContribution && (
                    <div className="fade-in" style={{ marginTop: 8 }}>
                      <div style={{ display: "flex", flexWrap: "nowrap", gap: 8, marginBottom: 8 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Fino a</div>
                          <input type="month" value={valForm.contributionUntil} min={valForm.value_date} onChange={(e) => setValForm({ ...valForm, contributionUntil: e.target.value })} className="input-month" />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versamento mensile</div>
                          <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.contributionAmount} onChange={(e) => setValForm({ ...valForm, contributionAmount: e.target.value })} className="mono" style={{ width: "100%", boxSizing: "border-box", padding: "9px 10px", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                        </div>
                      </div>
                      <div style={{ fontSize: 11.5, color: "var(--color-primary)" }}>Ogni mese, a partire dal successivo, valore di mercato e costo storico aumenteranno di questo importo rispetto al mese precedente, fino al mese scelto incluso.</div>
                    </div>
                  )}
                </div>
                {valError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{valError}</div>}
                <button type="submit" className="btn-primary" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
                  <Plus size={15} /> Aggiungi
                </button>
              </form>

              <div className="section-label" style={{ marginBottom: 8 }}>Storico valori</div>
              {policyValuations.length === 0 ? (
                <div style={{ fontSize: 13, color: "var(--color-border-light)", padding: "6px 4px" }}>Nessun valore ancora registrato.</div>
              ) : policyValuations.map((v) => {
                const gain = v.market_value - v.cost_basis;
                const isEditing = editingValId === v.id;
                if (isEditing) {
                  return (
                    <div key={v.id} className="fade-in" style={{ padding: 12, background: "var(--color-bg-tint)", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border)", marginBottom: 10 }}>
                      {editValGroupSize > 1 && (
                        <div style={{ marginBottom: 10, padding: 10, background: "var(--color-warning-bg)", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-warning-border)" }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-warning)", fontWeight: 600, marginBottom: 6 }}>{isContributionGroup ? "Versamento ricorrente" : "Valore \"portato avanti\""} · {editValGroupSize} mesi</div>
                          <div style={{ display: "flex", gap: 6 }}>
                            <button type="button" onClick={() => setEditValScope("single")} style={{ flex: 1, padding: "6px 0", borderRadius: 6, border: editValScope === "single" ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: editValScope === "single" ? "var(--color-primary)" : "#FFFFFF", color: editValScope === "single" ? "#FFFFFF" : "var(--color-heading)", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>Solo questo mese</button>
                            <button type="button" onClick={() => setEditValScope("all")} style={{ flex: 1, padding: "6px 0", borderRadius: 6, border: editValScope === "all" ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: editValScope === "all" ? "var(--color-primary)" : "#FFFFFF", color: editValScope === "all" ? "#FFFFFF" : "var(--color-heading)", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>Tutti i {editValGroupSize} mesi</button>
                          </div>
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                        <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                          <div className="section-label" style={{ marginBottom: 6 }}>Mese</div>
                          <input type="month" value={editValForm.value_date} disabled={editValScope === "all"} onChange={(e) => setEditValForm({ ...editValForm, value_date: e.target.value })} className="input-month" style={{ opacity: editValScope === "all" ? 0.5 : 1 }} />
                        </div>
                      </div>
                      {editValScope === "all" && isContributionGroup ? (
                        <>
                          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div className="section-label" style={{ marginBottom: 6 }}>Valore attuale di partenza</div>
                              <input type="text" inputMode="decimal" value={editValForm.base_market_value} onChange={(e) => setEditValForm({ ...editValForm, base_market_value: e.target.value })} className="mono input-field" />
                            </div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div className="section-label" style={{ marginBottom: 6 }}>Versato di partenza</div>
                              <input type="text" inputMode="decimal" value={editValForm.base_cost_basis} onChange={(e) => setEditValForm({ ...editValForm, base_cost_basis: e.target.value })} className="mono input-field" />
                            </div>
                          </div>
                          <div style={{ marginBottom: 10 }}>
                            <div className="section-label" style={{ marginBottom: 6 }}>Versamento mensile</div>
                            <input type="text" inputMode="decimal" value={editValForm.contribution_amount} onChange={(e) => setEditValForm({ ...editValForm, contribution_amount: e.target.value })} className="mono input-field" />
                          </div>
                          <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginBottom: 10 }}>Ricalcola tutti i {editValGroupSize} mesi a partire da questi valori, aggiungendo il versamento mensile ad ogni mese successivo.</div>
                        </>
                      ) : (
                        <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div className="section-label" style={{ marginBottom: 6 }}>Valore attuale</div>
                            <input type="text" inputMode="decimal" value={editValForm.market_value} onChange={(e) => setEditValForm({ ...editValForm, market_value: e.target.value })} className="mono input-field" />
                          </div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div className="section-label" style={{ marginBottom: 6 }}>Versato</div>
                            <input type="text" inputMode="decimal" value={editValForm.cost_basis} onChange={(e) => setEditValForm({ ...editValForm, cost_basis: e.target.value })} className="mono input-field" />
                          </div>
                        </div>
                      )}
                      {editValError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editValError}</div>}
                      {bulkOverrideConfirm ? (
                        <div style={{ padding: 10, background: "var(--color-danger-bg)", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-danger-border)" }}>
                          <div style={{ fontSize: 12.5, color: "var(--color-heading)", marginBottom: 10 }}>{pendingManualCount} {pendingManualCount === 1 ? "mese di questo gruppo è stato modificato manualmente" : "mesi di questo gruppo sono stati modificati manualmente"} in precedenza. Continuando, verranno sovrascritti con il valore ricalcolato. Vuoi continuare?</div>
                          <div style={{ display: "flex", gap: 8 }}>
                            <button onClick={() => setBulkOverrideConfirm(false)} className="btn-outline" style={{ flex: 1, padding: "9px 0", borderRadius: "var(--radius-sm)", fontSize: 13.5 }}>Annulla</button>
                            <button onClick={() => saveEditValuation(true)} style={{ flex: 1, padding: "9px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-danger)", color: "#FFFFFF", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Sì, sovrascrivi tutto</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => setEditingValId(null)} className="btn-outline" style={{ flex: 1, padding: "9px 0", borderRadius: "var(--radius-sm)", fontSize: 13.5 }}>Annulla</button>
                          <button onClick={() => setRemovalValuation(v)} style={{ flex: 1, padding: "9px 0", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 13.5, cursor: "pointer" }}>Elimina</button>
                          <button onClick={() => saveEditValuation()} className="btn-primary" style={{ flex: 1, padding: "9px 0", borderRadius: "var(--radius-sm)", fontSize: 13.5 }}>{editValScope === "all" ? `Salva su ${editValGroupSize}` : "Salva"}</button>
                        </div>
                      )}
                    </div>
                  );
                }
                return (
                  <div key={v.id} onClick={() => openEditValuation(v)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 6px", borderBottom: "1px dotted var(--color-border)", cursor: "pointer" }}>
                    <div style={{ width: 54, fontSize: 13.5, color: "var(--color-primary)", flexShrink: 0, textTransform: "capitalize", whiteSpace: "nowrap" }}>{fmtMonthYear(fullDateToMonth(v.value_date))}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="mono text-lg"><Money>{fmtEUR(v.market_value)}</Money></div>
                      <div style={{ fontSize: 12, color: "var(--color-border-light)" }}>Versato: <Money>{fmtEUR(v.cost_basis)}</Money></div>
                    </div>
                    <div className="mono text-sm" style={{ color: gain > 0 ? "var(--color-success)" : gain < 0 ? "var(--color-danger)" : "var(--color-border-light)", flexShrink: 0 }}><Money>{gain > 0 ? "+" : ""}{fmtEUR(gain)}</Money></div>
                  </div>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => openEditPolicy(activePolicy)} className="btn-outline-strong" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: "var(--radius-sm)", fontSize: 13 }}>
                Modifica
              </button>
              <button onClick={() => setRemovalPolicy(activePolicy)} className="text-xs" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", cursor: "pointer" }}>
                <Trash2 size={14} /> Elimina
              </button>
            </div>

            {editingPolicyId && (
              <>
                <div onClick={() => setEditingPolicyId(null)} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in scrollbar-thin modal-panel" style={{ bottom: 24 + kbOffset, maxHeight: "75dvh", overflowY: "auto", zIndex: 40 }}>
                  <div className="text-md" style={{ marginBottom: 14 }}>Modifica</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" value={editPolicyName} onChange={(e) => { setEditPolicyName(e.target.value); setEditPolicyError(""); }} autoFocus className="input-field-lg" />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {INSURANCE_ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setEditPolicyIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "var(--radius-md)", cursor: "pointer", border: editPolicyIcon === key ? "1.5px solid var(--color-primary)" : "1px solid var(--color-border)", background: editPolicyIcon === key ? "var(--color-bg-tint)" : "#FFFFFF" }}>
                        <IconComp size={19} color={editPolicyIcon === key ? "var(--color-primary)" : "var(--color-primary)"} />
                      </button>
                    ))}
                  </div>
                  {editPolicyError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editPolicyError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setEditingPolicyId(null)} className="btn-outline" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>Annulla</button>
                    <button onClick={saveEditPolicy} disabled={editPolicyBusy} className="text-sm" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", border: "none", background: editPolicyBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", cursor: editPolicyBusy ? "default" : "pointer" }}>Salva</button>
                  </div>
                </div>
              </>
            )}

            {removalPolicy && (
              <>
                <div onClick={() => setRemovalPolicy(null)} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in modal-panel" style={{ zIndex: 40 }}>
                  <div className="text-md" style={{ marginBottom: 6 }}>Eliminare "{removalPolicy.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questa voce. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deletePolicy(); setView("home"); }} className="btn-danger-outline">Sì, elimina</button>
                  <button onClick={() => setRemovalPolicy(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}

            {removalValuation && (
              <>
                <div onClick={() => setRemovalValuation(null)} className="modal-overlay" style={{ zIndex: 39 }} />
                <div className="fade-in modal-panel" style={{ zIndex: 40 }}>
                  {removalValuation.carry_group_id && valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length > 1 ? (
                    <>
                      <div className="text-md" style={{ marginBottom: 6 }}>{removalValuation.contribution_amount != null ? "Versamento ricorrente" : 'Valore "portato avanti"'}</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Questo valore fa parte di un gruppo di {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi creati insieme. Cosa vuoi eliminare?</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} className="btn-outline-strong" style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", fontSize: 14, marginBottom: 8 }}>Elimina solo questo mese</button>
                      <button onClick={async () => { await deleteValuation("all"); setEditingValId(null); }} className="btn-danger-outline">Elimina tutti i {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  ) : (
                    <>
                      <div className="text-md" style={{ marginBottom: 6 }}>Eliminare questo valore?</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} className="btn-danger-outline">Sì, elimina</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  )}
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function RealEstateApp({ session, onBack }) {
  const kbOffset = useKeyboardOffset();
  const userId = session.user.id;
  const [properties, setPolicies] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePropertyId, setActivePropertyId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  const [addingProperty, setAddingProperty] = useState(false);
  const [newPropertyName, setNewPropertyName] = useState("");
  const [newPropertyIcon, setNewPropertyIcon] = useState("Home");
  const [propertyError, setPropertyError] = useState("");
  const [propertyBusy, setPropertyBusy] = useState(false);
  const [removalProperty, setRemovalProperty] = useState(null);
  const [editingPropertyId, setEditingPropertyId] = useState(null);
  const [editPropertyName, setEditPropertyName] = useState("");
  const [editPropertyIcon, setEditPropertyIcon] = useState("Home");
  const [editPropertyError, setEditPropertyError] = useState("");
  const [editPropertyBusy, setEditPropertyBusy] = useState(false);


  useEffect(() => {
    (async () => {
      const { data: pol, error: polErr } = await supabase.from("real_estate_properties").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("real_estate_valuations").select("*").order("value_date", { ascending: false });
      setPolicies(!polErr && pol ? pol : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.property_id];
      if (!cur || v.value_date > cur.value_date) map[v.property_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);

  const propertyTotalsFromMap = (propertyId, map) => {
    const v = map[propertyId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const propertyTotals = (propertyId) => propertyTotalsFromMap(propertyId, valuationAsOfCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    properties.forEach((p) => {
      const t = propertyTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [properties, valuations, valuationAsOfCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);

  const propertySparkline = (propertyId) => {
    const relevantMonths = [...new Set(valuations.filter((v) => v.property_id === propertyId && v.value_date <= cursorFullDate).map((v) => fullDateToMonth(v.value_date)))].sort();
    const lastMonths = relevantMonths.slice(-6);
    return lastMonths
      .map((mk) => returnPct(propertyTotalsFromMap(propertyId, buildValuationMap(monthDateToFull(mk)))))
      .filter((v) => v !== null);
  };

  const activeProperty = properties.find((p) => p.id === activePropertyId);
  const propertyValuations = useMemo(() => valuations.filter((v) => v.property_id === activePropertyId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activePropertyId]);

  const openProperty = (p) => { setActivePropertyId(p.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("property"); };

  const addProperty = async () => {
    if (propertyBusy) return;
    const name = newPropertyName.trim();
    if (!name) { setPropertyError("Inserisci un nome."); return; }
    setPropertyBusy(true);
    const { data, error: insErr } = await supabase.from("real_estate_properties").insert({ user_id: userId, name, icon_key: newPropertyIcon }).select().single();
    setPropertyBusy(false);
    if (insErr) { setPropertyError(insErr.message); return; }
    setPolicies((prev) => [...prev, data]);
    setNewPropertyName(""); setNewPropertyIcon("Home"); setPropertyError(""); setAddingProperty(false);
  };

  const openEditProperty = (p) => {
    setEditingPropertyId(p.id);
    setEditPropertyName(p.name);
    setEditPropertyIcon(p.icon_key || "Home");
    setEditPropertyError("");
  };

  const saveEditProperty = async () => {
    if (editPropertyBusy) return;
    const name = editPropertyName.trim();
    if (!name) { setEditPropertyError("Inserisci un nome."); return; }
    setEditPropertyBusy(true);
    const { data, error: updErr } = await supabase.from("real_estate_properties").update({ name, icon_key: editPropertyIcon }).eq("id", editingPropertyId).select().single();
    setEditPropertyBusy(false);
    if (updErr) { setEditPropertyError(updErr.message); return; }
    setPolicies((prev) => prev.map((p) => (p.id === editingPropertyId ? data : p)));
    setEditingPropertyId(null);
  };

  const deleteProperty = async () => {
    const p = removalProperty;
    const { error: delErr } = await supabase.from("real_estate_properties").delete().eq("id", p.id);
    if (!delErr) {
      setPolicies((prev) => prev.filter((x) => x.id !== p.id));
      setValuations((prev) => prev.filter((v) => v.property_id !== p.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalProperty(null);
  };

  const val = useValuations({
    userId, table: "real_estate_valuations", idField: "property_id", activeId: activePropertyId,
    valuations, setValuations,
    mvErrorMsg: "Inserisci un valore attuale valido.", cbErrorMsg: "Inserisci un costo storico valido.",
