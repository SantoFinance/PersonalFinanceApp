                    <div style={{ width: 54, fontSize: 13.5, color: "var(--color-primary)", flexShrink: 0, textTransform: "capitalize", whiteSpace: "nowrap" }}>{fmtMonthYear(fullDateToMonth(v.value_date))}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="mono" style={{ fontSize: 16, fontWeight: 600 }}><Money>{fmtEUR(v.market_value)}</Money></div>
                      <div style={{ fontSize: 12, color: "var(--color-border-light)" }}>Costo: <Money>{fmtEUR(v.cost_basis)}</Money></div>
                    </div>
                    <div className="mono" style={{ fontSize: 14, fontWeight: 600, color: gain > 0 ? "var(--color-success)" : gain < 0 ? "var(--color-danger)" : "var(--color-border-light)", flexShrink: 0 }}><Money>{gain > 0 ? "+" : ""}{fmtEUR(gain)}</Money></div>
                  </div>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => openEditHolding(activeHolding)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-heading)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                Modifica titolo
              </button>
              <button onClick={() => setRemovalHolding(activeHolding)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                <Trash2 size={14} /> Elimina
              </button>
            </div>

            {editingHoldingId && (
              <>
                <div onClick={() => setEditingHoldingId(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24 + kbOffset, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Modifica titolo</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" value={editHoldingName} onChange={(e) => { setEditHoldingName(e.target.value); setEditHoldingError(""); }} autoFocus style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
                  {editHoldingError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editHoldingError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setEditingHoldingId(null)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={saveEditHolding} disabled={editHoldingBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: editHoldingBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: editHoldingBusy ? "default" : "pointer" }}>Salva</button>
                  </div>
                </div>
              </>
            )}

            {removalValuation && (
              <>
                <div onClick={() => setRemovalValuation(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  {removalValuation.carry_group_id && valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length > 1 ? (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>{removalValuation.contribution_amount != null ? "Versamento ricorrente" : 'Valore "portato avanti"'}</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Questo valore fa parte di un gruppo di {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi creati insieme. Cosa vuoi eliminare?</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-heading)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Elimina solo questo mese</button>
                      <button onClick={async () => { await deleteValuation("all"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Elimina tutti i {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare questo valore?</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  )}
                </div>
              </>
            )}

            {removalHolding && (
              <>
                <div onClick={() => setRemovalHolding(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalHolding.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questo titolo. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deleteHolding(); setView("portfolio"); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina titolo</button>
                  <button onClick={() => setRemovalHolding(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function InsuranceApp({ session, onBack }) {
  const kbOffset = useKeyboardOffset();
  const userId = session.user.id;
  const [policies, setPolicies] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePolicyId, setActivePolicyId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  const [addingPolicy, setAddingPolicy] = useState(false);
  const [newPolicyName, setNewPolicyName] = useState("");
  const [newPolicyIcon, setNewPolicyIcon] = useState("Shield");
  const [policyError, setPolicyError] = useState("");
  const [policyBusy, setPolicyBusy] = useState(false);
  const [removalPolicy, setRemovalPolicy] = useState(null);
  const [editingPolicyId, setEditingPolicyId] = useState(null);
  const [editPolicyName, setEditPolicyName] = useState("");
  const [editPolicyIcon, setEditPolicyIcon] = useState("Shield");
  const [editPolicyError, setEditPolicyError] = useState("");
  const [editPolicyBusy, setEditPolicyBusy] = useState(false);

  const [valForm, setValForm] = useState({ value_date: currentMonthISO(), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  const [valError, setValError] = useState("");
  const [editingValId, setEditingValId] = useState(null);
  const [editValForm, setEditValForm] = useState({ value_date: "", market_value: "", cost_basis: "", carry_group_id: null, contribution_amount: null, base_market_value: "", base_cost_basis: "" });
  const [editValScope, setEditValScope] = useState("single");
  const [bulkOverrideConfirm, setBulkOverrideConfirm] = useState(false);
  const [pendingManualCount, setPendingManualCount] = useState(0);
  const [editValError, setEditValError] = useState("");
  const [removalValuation, setRemovalValuation] = useState(null);

  useEffect(() => {
    (async () => {
      const { data: pol, error: polErr } = await supabase.from("insurance_policies").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("insurance_valuations").select("*").order("value_date", { ascending: false });
      setPolicies(!polErr && pol ? pol : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.policy_id];
      if (!cur || v.value_date > cur.value_date) map[v.policy_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);

  const policyTotalsFromMap = (policyId, map) => {
    const v = map[policyId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const policyTotals = (policyId) => policyTotalsFromMap(policyId, valuationAsOfCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    policies.forEach((p) => {
      const t = policyTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [policies, valuations, valuationAsOfCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);
  const fmtPct = (p) => `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;

  const [dashboardView, setDashboardView] = useState("list");
  const historyMonths = useMemo(() => {
    if (valuations.length === 0) return [];
    const monthKeys = valuations.map((v) => fullDateToMonth(v.value_date));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx));
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [valuations]);

  const activePolicy = policies.find((p) => p.id === activePolicyId);
  const policyValuations = useMemo(() => valuations.filter((v) => v.policy_id === activePolicyId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activePolicyId]);

  const openPolicy = (p) => { setActivePolicyId(p.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("policy"); };

  const addPolicy = async () => {
    if (policyBusy) return;
    const name = newPolicyName.trim();
    if (!name) { setPolicyError("Inserisci un nome."); return; }
    setPolicyBusy(true);
    const { data, error: insErr } = await supabase.from("insurance_policies").insert({ user_id: userId, name, icon_key: newPolicyIcon }).select().single();
    setPolicyBusy(false);
    if (insErr) { setPolicyError(insErr.message); return; }
    setPolicies((prev) => [...prev, data]);
    setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); setAddingPolicy(false);
  };

  const openEditPolicy = (p) => {
    setEditingPolicyId(p.id);
    setEditPolicyName(p.name);
    setEditPolicyIcon(p.icon_key || "Shield");
    setEditPolicyError("");
  };

  const saveEditPolicy = async () => {
    if (editPolicyBusy) return;
    const name = editPolicyName.trim();
    if (!name) { setEditPolicyError("Inserisci un nome."); return; }
    setEditPolicyBusy(true);
    const { data, error: updErr } = await supabase.from("insurance_policies").update({ name, icon_key: editPolicyIcon }).eq("id", editingPolicyId).select().single();
    setEditPolicyBusy(false);
    if (updErr) { setEditPolicyError(updErr.message); return; }
    setPolicies((prev) => prev.map((p) => (p.id === editingPolicyId ? data : p)));
    setEditingPolicyId(null);
  };

  const deletePolicy = async () => {
    const p = removalPolicy;
    const { error: delErr } = await supabase.from("insurance_policies").delete().eq("id", p.id);
    if (!delErr) {
      setPolicies((prev) => prev.filter((x) => x.id !== p.id));
      setValuations((prev) => prev.filter((v) => v.policy_id !== p.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalPolicy(null);
  };

  const addValuation = async (e) => {
    e.preventDefault();
    const mv = parseFloat(String(valForm.market_value).replace(",", "."));
    const cb = parseFloat(String(valForm.cost_basis).replace(",", "."));
    if (!valForm.value_date) { setValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setValError("Inserisci un valore attuale valido."); return; }
    if (isNaN(cb) || cb < 0) { setValError("Inserisci un valore versato valido."); return; }
    if (valForm.carryForward) {
      if (!valForm.carryUntil) { setValError("Seleziona fino a quale mese portare avanti il valore."); return; }
      if (monthKeyToIdx(valForm.carryUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.carryUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v.policy_id === activePolicyId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di portare avanti il dato su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, policy_id: activePolicyId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv, cost_basis: cb, carry_group_id: groupId, manually_edited: false });
      }
      const { data, error: insErr } = await supabase.from("insurance_valuations").insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
      return;
    }
    if (valForm.recurringContribution) {
      const contrib = parseFloat(String(valForm.contributionAmount).replace(",", "."));
      if (!valForm.contributionUntil) { setValError("Seleziona fino a quale mese effettuare il versamento ricorrente."); return; }
      if (isNaN(contrib) || contrib <= 0) { setValError("Inserisci un importo di versamento mensile valido."); return; }
      if (monthKeyToIdx(valForm.contributionUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.contributionUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v.policy_id === activePolicyId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di impostare il versamento ricorrente su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const offset = idx - startIdx;
        rows.push({ user_id: userId, policy_id: activePolicyId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv + offset * contrib, cost_basis: cb + offset * contrib, carry_group_id: groupId, contribution_amount: contrib, manually_edited: false });
      }
      const { data, error: insErr } = await supabase.from("insurance_valuations").insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
      return;
    }
    const duplicate = valuations.some((v) => v.policy_id === activePolicyId && fullDateToMonth(v.value_date) === valForm.value_date);
    if (duplicate) {
      const [dy, dm] = valForm.value_date.split("-").map(Number);
      setValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setValError("");
    const { data, error: insErr } = await supabase.from("insurance_valuations").insert({ user_id: userId, policy_id: activePolicyId, value_date: monthDateToFull(valForm.value_date), market_value: mv, cost_basis: cb }).select().single();
    if (insErr) { setValError(insErr.message); return; }
    setValuations((prev) => [{ ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) }, ...prev]);
    setValForm({ value_date: monthKeyFromIdx(monthKeyToIdx(valForm.value_date) + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  };

  const openEditValuation = (v) => {
    setEditingValId(v.id);
    const groupRows = v.carry_group_id ? valuations.filter((x) => x.policy_id === activePolicyId && x.carry_group_id === v.carry_group_id) : [];
    const firstRow = groupRows.length > 0 ? groupRows.reduce((a, b) => (a.value_date < b.value_date ? a : b)) : null;
    setEditValForm({
      value_date: fullDateToMonth(v.value_date),
      market_value: String(v.market_value).replace(".", ","),
      cost_basis: String(v.cost_basis).replace(".", ","),
      carry_group_id: v.carry_group_id || null,
      contribution_amount: v.contribution_amount != null ? v.contribution_amount : null,
      base_market_value: firstRow ? String(firstRow.market_value).replace(".", ",") : "",
      base_cost_basis: firstRow ? String(firstRow.cost_basis).replace(".", ",") : "",
    });
    setEditValScope("single");
    setBulkOverrideConfirm(false);
    setEditValError("");
  };

  const editValGroupSize = editValForm.carry_group_id ? valuations.filter((v) => v.carry_group_id === editValForm.carry_group_id).length : 1;
  const isContributionGroup = editValForm.contribution_amount != null;

  const saveEditValuation = async (forceOverride) => {
    if (editValScope === "all" && editValForm.carry_group_id && editValForm.contribution_amount != null) {
      const baseMv = parseFloat(String(editValForm.base_market_value).replace(",", "."));
      const baseCb = parseFloat(String(editValForm.base_cost_basis).replace(",", "."));
      const contrib = parseFloat(String(editValForm.contribution_amount).replace(",", "."));
      if (isNaN(baseMv) || baseMv < 0) { setEditValError("Inserisci un valore di partenza valido."); return; }
      if (isNaN(baseCb) || baseCb < 0) { setEditValError("Inserisci un costo storico di partenza valido."); return; }
      if (isNaN(contrib) || contrib <= 0) { setEditValError("Inserisci un versamento mensile valido."); return; }
      const groupRows = valuations.filter((v) => v.policy_id === activePolicyId && v.carry_group_id === editValForm.carry_group_id).slice().sort((a, b) => (a.value_date < b.value_date ? -1 : a.value_date > b.value_date ? 1 : 0));
      if (!forceOverride) {
        const manualCount = groupRows.filter((v) => v.manually_edited).length;
        if (manualCount > 0) {
          setPendingManualCount(manualCount);
          setBulkOverrideConfirm(true);
          return;
        }
      }
      setBulkOverrideConfirm(false);
      setEditValError("");
      const updates = groupRows.map((v, i) => ({ id: v.id, market_value: baseMv + i * contrib, cost_basis: baseCb + i * contrib }));
      const results = await Promise.all(updates.map((u) => supabase.from("insurance_valuations").update({ market_value: u.market_value, cost_basis: u.cost_basis, contribution_amount: contrib, manually_edited: false }).eq("id", u.id).select().single()));
      const failed = results.find((r) => r.error);
      if (failed) { setEditValError(failed.error.message); return; }
      setValuations((prev) => prev.map((v) => {
        const upd = updates.find((u) => u.id === v.id);
        return upd ? { ...v, market_value: upd.market_value, cost_basis: upd.cost_basis, contribution_amount: contrib, manually_edited: false } : v;
      }));
      setEditingValId(null);
      return;
    }
    const mv = parseFloat(String(editValForm.market_value).replace(",", "."));
    const cb = parseFloat(String(editValForm.cost_basis).replace(",", "."));
    if (editValScope === "single" && !editValForm.value_date) { setEditValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setEditValError("Inserisci un valore attuale valido."); return; }
    if (isNaN(cb) || cb < 0) { setEditValError("Inserisci un valore versato valido."); return; }
    if (editValScope === "all" && editValForm.carry_group_id) {
      const { error: updErr } = await supabase.from("insurance_valuations").update({ market_value: mv, cost_basis: cb }).eq("carry_group_id", editValForm.carry_group_id);
      if (updErr) { setEditValError(updErr.message); return; }
      setValuations((prev) => prev.map((v) => (v.carry_group_id === editValForm.carry_group_id ? { ...v, market_value: mv, cost_basis: cb } : v)));
      setEditingValId(null);
      return;
    }
    const duplicate = valuations.some((v) => v.id !== editingValId && v.policy_id === activePolicyId && fullDateToMonth(v.value_date) === editValForm.value_date);
    if (duplicate) {
      const [dy, dm] = editValForm.value_date.split("-").map(Number);
      setEditValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setEditValError("");
    const payload = { value_date: monthDateToFull(editValForm.value_date), market_value: mv, cost_basis: cb };
    if (editValForm.carry_group_id) payload.manually_edited = true;
    const { data, error: updErr } = await supabase.from("insurance_valuations").update(payload).eq("id", editingValId).select().single();
    if (updErr) { setEditValError(updErr.message); return; }
    setValuations((prev) => prev.map((v) => (v.id === editingValId ? { ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) } : v)));
    setEditingValId(null);
  };

  const deleteValuation = async (scope) => {
    const v = removalValuation;
    if (scope === "all" && v.carry_group_id) {
      const prev = valuations;
      setValuations((p) => p.filter((x) => x.carry_group_id !== v.carry_group_id));
      const { error: delErr } = await supabase.from("insurance_valuations").delete().eq("carry_group_id", v.carry_group_id);
      if (delErr) { setValuations(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
    } else {
      const { error: delErr } = await supabase.from("insurance_valuations").delete().eq("id", v.id);
      if (!delErr) setValuations((prev) => prev.filter((x) => x.id !== v.id));
      else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    }
    setRemovalValuation(null);
  };

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando assicurazioni e previdenza…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={() => {
          if (view === "policy") { setView("home"); setEditingValId(null); }
          else onBack();
        }} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
          <ArrowLeft size={22} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>
          {view === "home" ? "Assicurazioni e Previdenza" : (activePolicy ? activePolicy.name : "")}
        </span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        {view === "home" ? (
          <>
            <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <button onClick={() => goCursor(-1)} aria-label="Mese precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronLeft size={32} /></button>
              <div onClick={() => { setPickerYear(cursor.year); setDatePickerOpen(true); }} style={{ fontSize: "clamp(18px, 6vw, 28px)", letterSpacing: "0.01em", color: "var(--color-heading)", fontWeight: 700, whiteSpace: "nowrap", flex: 1, minWidth: 0, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", cursor: "pointer", textTransform: "capitalize" }}>{MESI[cursor.month]} {String(cursor.year).slice(-2)}</div>
              <button onClick={() => goCursor(1)} aria-label="Mese successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronRight size={32} /></button>

              {datePickerOpen && (
                <>
                  <div onClick={() => setDatePickerOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 39 }} />
                  <div className="fade-in" style={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: 6, zIndex: 40 }}>
                    <div style={{ maxWidth: 260, margin: "0 auto", background: "#FFFFFF", border: "1px solid var(--color-border)", borderRadius: 12, boxShadow: "0 12px 28px rgba(5,91,101,0.16)", padding: 14 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                        <button onClick={() => setPickerYear((y) => y - 1)} aria-label="Anno precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronLeft size={18} /></button>
                        <div style={{ fontSize: 15, fontWeight: 700, color: "var(--color-heading)" }}>{pickerYear}</div>
                        <button onClick={() => setPickerYear((y) => y + 1)} aria-label="Anno successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronRight size={18} /></button>
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
                        {MESI.map((m, i) => {
                          const isSelected = pickerYear === cursor.year && i === cursor.month;
                          return (
                            <button key={m} onClick={() => { setCursor({ year: pickerYear, month: i }); setDatePickerOpen(false); }} style={{ padding: "9px 0", borderRadius: 8, border: isSelected ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: isSelected ? "var(--color-primary)" : "#FFFFFF", color: isSelected ? "#FFFFFF" : "var(--color-heading)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                              {m.slice(0, 3)}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
            <div key={`${cursor.year}-${cursor.month}`} className="fade-in" style={{ textAlign: "center", padding: "4px 0 14px", borderBottom: "1px solid var(--color-border)", flexShrink: 0 }}>
              <div className="mono" style={{ fontSize: 32, fontWeight: 600, letterSpacing: "-0.01em", color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal.marketValue)}</Money></div>
              <div className="mono" style={{ fontSize: 14, fontWeight: 600, marginTop: 2, color: grandTotal.gain > 0 ? "var(--color-success)" : grandTotal.gain < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
                <Money>{grandTotal.gain > 0 ? "+" : ""}{fmtEUR(grandTotal.gain)}</Money>{returnPct(grandTotal) !== null && ` (${fmtPct(returnPct(grandTotal))})`}
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "center", padding: "10px 0", flexShrink: 0 }}>
              <div style={{ display: "flex", background: "var(--color-bg-tint)", borderRadius: 10, padding: 3, width: "100%", maxWidth: 280 }}>
                <button onClick={() => setDashboardView("list")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: dashboardView === "list" ? "#FFFFFF" : "transparent", color: dashboardView === "list" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "list" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>

                <button onClick={() => setDashboardView("chart")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: dashboardView === "chart" ? "#FFFFFF" : "transparent", color: dashboardView === "chart" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "chart" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
                  Statistiche
                </button>
              </div>
            </div>

            {dashboardView === "chart" ? (
              <StatsSection

                getName={(p) => p.name}

                performantLabel="Voce più performante"

              />
            ) : (
              <>
            <div className="scrollbar-thin" style={{ flex: "1 1 auto", maxHeight: 400, minHeight: 0, overflowY: "auto", padding: "6px 0" }}>

                  <Shield size={34} color="var(--color-border-light)" style={{ marginBottom: 12 }} />

                const t = policyTotals(p.id);
                const PIcon = INSURANCE_ICON_MAP[p.icon_key] || Shield;
                const weightPct = grandTotal.marketValue > 0 ? (t.marketValue / grandTotal.marketValue) * 100 : 0;
                const rPct = returnPct(t);
                return (
                  <div key={p.id} onClick={() => openPolicy(p)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 6px", cursor: "pointer" }}>
                    <div style={{ width: 38, height: 38, borderRadius: 9, background: "var(--color-bg-tint)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <PIcon size={17} color="var(--color-primary)" />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: t.hasData ? 4 : 0 }}>
                        <span style={{ fontSize: 16, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                        {t.hasData && <span className="mono" style={{ fontSize: 16, fontWeight: 600, flexShrink: 0, marginLeft: 8 }}><Money>{fmtEUR(t.marketValue)}</Money></span>}
                      </div>
                      {t.hasData ? (
                        <>
                          <div style={{ height: 4, background: "var(--color-bg-tint)", borderRadius: 2, overflow: "hidden", marginBottom: 4 }}>
                            <div className="bar-fill" style={{ height: "100%", width: `${weightPct}%`, background: "var(--color-primary)", borderRadius: 2 }} />
                          </div>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                            <span style={{ fontSize: 12, color: "var(--color-border-light)" }}>{weightPct.toFixed(0)}% del totale</span>
                            <span className="mono" style={{ fontSize: 12, fontWeight: 600, color: t.gain > 0 ? "var(--color-success)" : t.gain < 0 ? "var(--color-danger)" : "var(--color-border-light)" }}><Money>{t.gain > 0 ? "+" : ""}{fmtEUR(t.gain)}</Money>{rPct !== null && ` (${fmtPct(rPct)})`}</span>
                          </div>
                        </>
                      ) : (
                        <div style={{ fontSize: 12.5, color: "var(--color-border-light)" }}>Non esisteva ancora in questo mese</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {addingPolicy && (
              <>
                <div onClick={() => { setAddingPolicy(false); setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); }} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in scrollbar-thin" style={{ position: "fixed", left: 20, right: 20, bottom: 24 + kbOffset, maxWidth: 520, margin: "0 auto", maxHeight: "75dvh", overflowY: "auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Nuova polizza o fondo</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome polizza o fondo</div>
                  <input type="text" placeholder="Es. Fondo Pensione Aperto" value={newPolicyName} onChange={(e) => { setNewPolicyName(e.target.value); setPolicyError(""); }} autoFocus style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {INSURANCE_ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setNewPolicyIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, cursor: "pointer", border: newPolicyIcon === key ? "1.5px solid var(--color-primary)" : "1px solid var(--color-border)", background: newPolicyIcon === key ? "var(--color-bg-tint)" : "#FFFFFF" }}>
                        <IconComp size={19} color={newPolicyIcon === key ? "var(--color-primary)" : "var(--color-primary)"} />
                      </button>
                    ))}
                  </div>
                  {policyError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{policyError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setAddingPolicy(false); setNewPolicyName(""); setNewPolicyIcon("Shield"); setPolicyError(""); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={addPolicy} disabled={policyBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: policyBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: policyBusy ? "default" : "pointer" }}>Crea</button>
                  </div>
                </div>
              </>
            )}
            {!addingPolicy && (
              <button onClick={() => setAddingPolicy(true)} style={{ marginTop: 12, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "1px dashed var(--color-primary)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>
                <Plus size={16} /> Nuova polizza o fondo
              </button>
            )}
              </>
            )}

            {removalPolicy && (
              <>
                <div onClick={() => setRemovalPolicy(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalPolicy.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questa voce. L'operazione non è reversibile.</div>
                  <button onClick={deletePolicy} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                  <button onClick={() => setRemovalPolicy(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        ) : (
          <>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 0" }}>
              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 10 }}>Aggiungi valore mensile</div>
              <form onSubmit={addValuation} style={{ padding: 12, background: "var(--color-bg-tint)", borderRadius: 10, border: "1px solid var(--color-border)", marginBottom: 20 }}>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Mese</div>
                    <input type="month" value={valForm.value_date} onChange={(e) => setValForm({ ...valForm, value_date: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF" }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Valore attuale</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.market_value} onChange={(e) => setValForm({ ...valForm, market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versato</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.cost_basis} onChange={(e) => setValForm({ ...valForm, cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div onClick={() => { const next = !valForm.carryForward; setValForm({ ...valForm, carryForward: next, carryUntil: next ? valForm.value_date : "", recurringContribution: false, contributionUntil: "", contributionAmount: "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: valForm.carryForward ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: valForm.carryForward ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {valForm.carryForward && <Check size={12} color="#FFFFFF" />}
                    </div>
                    <span style={{ fontSize: 13.5, color: "var(--color-heading)" }}>Porta avanti questo valore fino a...</span>
                  </div>
                  {valForm.carryForward && (
                    <div className="fade-in" style={{ marginTop: 8 }}>
                      <input type="month" value={valForm.carryUntil} min={valForm.value_date} onChange={(e) => setValForm({ ...valForm, carryUntil: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF" }} />
                      <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginTop: 6 }}>Stesso valore di mercato e costo storico ripetuto ogni mese fino a quello scelto (incluso). Potrai comunque modificarlo in un mese specifico in seguito.</div>
                    </div>
                  )}
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div onClick={() => { const next = !valForm.recurringContribution; setValForm({ ...valForm, recurringContribution: next, contributionUntil: next ? valForm.value_date : "", contributionAmount: next ? valForm.contributionAmount : "", carryForward: false, carryUntil: "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: valForm.recurringContribution ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: valForm.recurringContribution ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {valForm.recurringContribution && <Check size={12} color="#FFFFFF" />}
                    </div>
                    <span style={{ fontSize: 13.5, color: "var(--color-heading)" }}>Versamento ricorrente (PAC)</span>
                  </div>
                  {valForm.recurringContribution && (
                    <div className="fade-in" style={{ marginTop: 8 }}>
                      <div style={{ display: "flex", flexWrap: "nowrap", gap: 8, marginBottom: 8 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Fino a</div>
                          <input type="month" value={valForm.contributionUntil} min={valForm.value_date} onChange={(e) => setValForm({ ...valForm, contributionUntil: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF" }} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versamento mensile</div>
                          <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.contributionAmount} onChange={(e) => setValForm({ ...valForm, contributionAmount: e.target.value })} className="mono" style={{ width: "100%", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                        </div>
                      </div>
                      <div style={{ fontSize: 11.5, color: "var(--color-primary)" }}>Ogni mese, a partire dal successivo, valore di mercato e costo storico aumenteranno di questo importo rispetto al mese precedente, fino al mese scelto incluso.</div>
                    </div>
                  )}
                </div>
                {valError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{valError}</div>}
                <button type="submit" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "none", background: "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                  <Plus size={15} /> Aggiungi
                </button>
              </form>

              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Storico valori</div>
              {policyValuations.length === 0 ? (
                <div style={{ fontSize: 13, color: "var(--color-border-light)", padding: "6px 4px" }}>Nessun valore ancora registrato.</div>

                const gain = v.market_value - v.cost_basis;
                const isEditing = editingValId === v.id;
                if (isEditing) {
                  return (
                    <div key={v.id} className="fade-in" style={{ padding: 12, background: "var(--color-bg-tint)", borderRadius: 10, border: "1px solid var(--color-border)", marginBottom: 10 }}>
                      {editValGroupSize > 1 && (
                        <div style={{ marginBottom: 10, padding: 10, background: "var(--color-warning-bg)", borderRadius: 8, border: "1px solid var(--color-warning-border)" }}>
                          <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-warning)", fontWeight: 600, marginBottom: 6 }}>{isContributionGroup ? "Versamento ricorrente" : "Valore \"portato avanti\""} · {editValGroupSize} mesi</div>
                          <div style={{ display: "flex", gap: 6 }}>
                            <button type="button" onClick={() => setEditValScope("single")} style={{ flex: 1, padding: "6px 0", borderRadius: 6, border: editValScope === "single" ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: editValScope === "single" ? "var(--color-primary)" : "#FFFFFF", color: editValScope === "single" ? "#FFFFFF" : "var(--color-heading)", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>Solo questo mese</button>
                            <button type="button" onClick={() => setEditValScope("all")} style={{ flex: 1, padding: "6px 0", borderRadius: 6, border: editValScope === "all" ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: editValScope === "all" ? "var(--color-primary)" : "#FFFFFF", color: editValScope === "all" ? "#FFFFFF" : "var(--color-heading)", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>Tutti i {editValGroupSize} mesi</button>
                          </div>
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                        <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                          <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Mese</div>
                          <input type="month" value={editValForm.value_date} disabled={editValScope === "all"} onChange={(e) => setEditValForm({ ...editValForm, value_date: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF", opacity: editValScope === "all" ? 0.5 : 1 }} />
                        </div>
                      </div>
                      {editValScope === "all" && isContributionGroup ? (
                        <>
                          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Valore attuale di partenza</div>
                              <input type="text" inputMode="decimal" value={editValForm.base_market_value} onChange={(e) => setEditValForm({ ...editValForm, base_market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                            </div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versato di partenza</div>
                              <input type="text" inputMode="decimal" value={editValForm.base_cost_basis} onChange={(e) => setEditValForm({ ...editValForm, base_cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                            </div>
                          </div>
                          <div style={{ marginBottom: 10 }}>
                            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versamento mensile</div>
                            <input type="text" inputMode="decimal" value={editValForm.contribution_amount} onChange={(e) => setEditValForm({ ...editValForm, contribution_amount: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                          </div>
                          <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginBottom: 10 }}>Ricalcola tutti i {editValGroupSize} mesi a partire da questi valori, aggiungendo il versamento mensile ad ogni mese successivo.</div>
                        </>
                      ) : (
                        <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Valore attuale</div>
                            <input type="text" inputMode="decimal" value={editValForm.market_value} onChange={(e) => setEditValForm({ ...editValForm, market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                          </div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Versato</div>
                            <input type="text" inputMode="decimal" value={editValForm.cost_basis} onChange={(e) => setEditValForm({ ...editValForm, cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
