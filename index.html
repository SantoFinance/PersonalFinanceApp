function monthKeyFromIdx(idx) {
  const y = Math.floor(idx / 12);
  const m = ((idx % 12) + 12) % 12;
  return `${y}-${String(m + 1).padStart(2, "0")}`;

function yy(year) {

function periodLabel(periodMode, cursor) {
  if (periodMode === "month") return `${MESI[cursor.month]} ${yy(cursor.year)}`;
  if (periodMode === "quarter" || periodMode === "semester" || periodMode === "year") {
    const months = periodMode === "quarter" ? 3 : periodMode === "semester" ? 6 : 12;
    const startIdx = cursor.year * 12 + cursor.month - (months - 1);
    const startYear = Math.floor(startIdx / 12);
    const startMonth = ((startIdx % 12) + 12) % 12;
    if (startYear === cursor.year) return `${MESI[startMonth].slice(0, 3)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Controlla la tua email per confermare la registrazione.");
      }
    } catch (err) {
      setError(err.message || "Errore. Riprova.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FFFFFF", padding: 20 }}>
      <div className="fade-in" style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ width: 46, height: 46, borderRadius: "50%", border: "1.5px solid #2F6FED", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}>
            <span className="mono" style={{ fontSize: 20, fontWeight: 600, color: "#2F6FED" }}>€</span>
          </div>
          <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600 }}>Personal Finance</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: "#0B2545" }}>Tracker</div>
        </div>
        <form onSubmit={submit}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid #DCE9F5", borderRadius: 10, padding: "10px 12px", marginBottom: 10 }}>
            <Mail size={16} color="#5B7B9B" />
            <input type="email" required placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid #DCE9F5", borderRadius: 10, padding: "10px 12px", marginBottom: 16 }}>
            <Lock size={16} color="#5B7B9B" />
            <input type="password" required placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} minLength={6} style={{ border: "none", outline: "none", flex: 1, fontSize: 16 }} />
          </div>
          {error && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 10 }}>{error}</div>}
          {info && <div style={{ color: "#2F6FED", fontSize: 13, marginBottom: 10 }}>{info}</div>}
          <button type="submit" disabled={loading} style={{ width: "100%", padding: "12px 0", borderRadius: 10, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
            {loading ? "Attendere…" : mode === "signin" ? "Accedi" : "Crea account"}
          </button>
        </form>
        <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setInfo(""); }} style={{ width: "100%", background: "none", border: "none", color: "#5B7B9B", fontSize: 13, marginTop: 16, cursor: "pointer" }}>
          {mode === "signin" ? "Non hai un account? Registrati" : "Hai già un account? Accedi"}
        </button>
      </div>
    </div>
  );
}

function MainApp({ session, onBack }) {
  const userId = session.user.id;
  const [expenses, setExpenses] = useState([]);
  const [categories, setCategories] = useState([]);
  const [categoriesLoaded, setCategoriesLoaded] = useState(false);
  const [accounts, setAccounts] = useState([]);
  const [accountsLoaded, setAccountsLoaded] = useState(false);
  const [activeAccountId, setActiveAccountId] = useState("all");
  const [addingAccount, setAddingAccount] = useState(false);
  const [newAccountName, setNewAccountName] = useState("");
  const [accError, setAccError] = useState("");
  const [accBusy, setAccBusy] = useState(false);
  const [accRemovalTarget, setAccRemovalTarget] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [form, setForm] = useState({ category: "Altro", account_id: "", amount: "", date: todayISO(), note: "" });
  const [error, setError] = useState("");
  const [view, setView] = useState("home");
  const [showFilters, setShowFilters] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [addingCustom, setAddingCustom] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [newCatIcon, setNewCatIcon] = useState("Tag");
  const [catError, setCatError] = useState("");
  const [removalTarget, setRemovalTarget] = useState(null);
  const [removalStage, setRemovalStage] = useState("choose");
  const [filters, setFilters] = useState({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });
  const [periodMode, setPeriodMode] = useState("month");
  const [lastMonthCursor, setLastMonthCursor] = useState(null);
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ category: "", account_id: "", amount: "", date: "", note: "" });
  const [editError, setEditError] = useState("");
  const [editDeleteConfirm, setEditDeleteConfirm] = useState(false);

  const CATEGORIES = useMemo(() => [...categories.map((c) => ({ id: c.label, label: c.label, icon: ICON_MAP[c.icon_key] || (SUGGESTED_MAP[c.label] && SUGGESTED_MAP[c.label].icon) || Tag, archived: c.archived })), ALTRO_CATEGORY], [categories]);
  const activeCategories = useMemo(() => CATEGORIES.filter((c) => !c.archived), [CATEGORIES]);

  useEffect(() => {
    if (categoriesLoaded && !activeCategories.some((c) => c.id === form.category)) {
      setForm((f) => ({ ...f, category: (activeCategories.find((c) => c.id !== "Altro") || activeCategories[0] || ALTRO_CATEGORY).id }));
    }
  }, [categoriesLoaded, activeCategories]);

  useEffect(() => {
    if (accountsLoaded && accounts.length > 0 && !accounts.some((a) => a.id === form.account_id)) {
      const preferred = activeAccountId !== "all" && accounts.some((a) => a.id === activeAccountId) ? activeAccountId : accounts[0].id;
      setForm((f) => ({ ...f, account_id: preferred }));
    }
  }, [accountsLoaded, accounts, activeAccountId]);


  useEffect(() => {
    (async () => {
      const { data: exp, error: expErr } = await supabase.from("expenses").select("*").order("date", { ascending: false });
      const expList = (!expErr && exp) ? exp.map((e) => ({ id: e.id, category: e.category, account_id: e.account_id, amount: Number(e.amount), date: e.date, note: e.note || "" })) : [];
      setExpenses(expList);

      let { data: cats, error: catErr } = await supabase.from("categories").select("*").order("created_at", { ascending: true });
      if (catErr) cats = [];

      if (cats && cats.length === 0) {
        const { data: oldCustom } = await supabase.from("custom_categories").select("*");
        const toInsert = [];
        const seen = new Set();
        [...new Set(expList.map((e) => e.category))].forEach((label) => {
          if (seen.has(label) || label === "Altro") return;
          seen.add(label);
          const oc = (oldCustom || []).find((o) => o.label === label);
          toInsert.push({ user_id: userId, label, icon_key: oc ? oc.icon_key : null });
        });
        (oldCustom || []).forEach((o) => {
          if (seen.has(o.label)) return;
          seen.add(o.label);
          toInsert.push({ user_id: userId, label: o.label, icon_key: o.icon_key });
        });
        if (toInsert.length > 0) {
          const { data: inserted, error: migErr } = await supabase.from("categories").insert(toInsert).select();
          if (!migErr && inserted) cats = inserted;
        }
      }
      setCategories(cats || []);
      setCategoriesLoaded(true);

      let { data: accs, error: accErr } = await supabase.from("accounts").select("*").order("created_at", { ascending: true });
      if (accErr) accs = [];
      setAccounts(accs || []);
      setAccountsLoaded(true);

      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (periodMode === "month") setLastMonthCursor(cursor);
  }, [periodMode, cursor]);

  const periodMonthKeys = useMemo(() => {
    const idx = cursor.year * 12 + cursor.month;
    if (periodMode === "month") return [monthKeyFromIdx(idx)];
    if (periodMode === "quarter") return Array.from({ length: 3 }, (_, i) => monthKeyFromIdx(idx - 2 + i));
    if (periodMode === "semester") return Array.from({ length: 6 }, (_, i) => monthKeyFromIdx(idx - 5 + i));
    if (periodMode === "year") return Array.from({ length: 12 }, (_, i) => monthKeyFromIdx(idx - 11 + i));
    if (periodMode === "ytd") return Array.from({ length: cursor.month + 1 }, (_, i) => monthKeyFromIdx(cursor.year * 12 + i));
    return [];
  }, [cursor, periodMode]);
  const periodExpenses = useMemo(() => expenses.filter((e) => periodMonthKeys.includes(monthKey(e.date)) && (activeAccountId === "all" || e.account_id === activeAccountId)).sort((a, b) => new Date(b.date) - new Date(a.date)), [expenses, periodMonthKeys, activeAccountId]);
  const byCategory = useMemo(() => {
    const map = {};
    CATEGORIES.forEach((c) => (map[c.id] = 0));
    periodExpenses.forEach((e) => (map[e.category] = (map[e.category] || 0) + Number(e.amount)));
    return map;
  }, [periodExpenses, CATEGORIES]);
  const total = useMemo(() => periodExpenses.reduce((s, e) => s + Number(e.amount), 0), [periodExpenses]);
  const maxCat = Math.max(1, ...Object.values(byCategory));

  const filtersActive = filters.dateFrom || filters.dateTo || filters.category !== "Tutte" || filters.amountMode !== "any";
  const filteredExpenses = useMemo(() => {
    return expenses.filter((e) => {
      if (filters.dateFrom && e.date < filters.dateFrom) return false;
      if (filters.dateTo && e.date > filters.dateTo) return false;
      if (filters.category !== "Tutte" && e.category !== filters.category) return false;
      if (activeAccountId !== "all" && e.account_id !== activeAccountId) return false;
      const min = parseFloat(String(filters.amountMin).replace(",", "."));
      const max = parseFloat(String(filters.amountMax).replace(",", "."));
      if (filters.amountMode === "lt" && !isNaN(min) && !(e.amount < min)) return false;
      if (filters.amountMode === "gt" && !isNaN(min) && !(e.amount > min)) return false;
      if (filters.amountMode === "between") {
        if (!isNaN(min) && e.amount < min) return false;
        if (!isNaN(max) && e.amount > max) return false;
      }
      return true;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [expenses, filters, activeAccountId]);
  const filteredTotal = useMemo(() => filteredExpenses.reduce((s, e) => s + Number(e.amount), 0), [filteredExpenses]);
  const resetFilters = () => setFilters({ dateFrom: "", dateTo: "", category: "Tutte", amountMode: "any", amountMin: "", amountMax: "" });

  const goPeriod = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const changePeriod = (id) => {
    if (id === "month") {
      setCursor(lastMonthCursor || cursor);
    }
    setPeriodMode(id);
  };

  const addExpense = async (e) => {
    e.preventDefault();
    const amt = parseFloat(String(form.amount).replace(",", "."));
    if (!amt || amt <= 0) { setError("Inserisci un importo valido."); return; }
    if (!form.date) { setError("Inserisci una data."); return; }
    if (!form.account_id) { setError("Seleziona un conto."); return; }
    setError("");
    setSaveState("saving");
    const { data, error: insErr } = await supabase.from("expenses").insert({ user_id: userId, category: form.category, account_id: form.account_id, amount: amt, date: form.date, note: form.note.trim() }).select().single();
    if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }
    setExpenses((prev) => [{ id: data.id, category: data.category, account_id: data.account_id, amount: Number(data.amount), date: data.date, note: data.note || "" }, ...prev]);
    setSaveState("saved");
    setForm({ ...form, amount: "", note: "" });
    setView("home");
  };

  const removeExpense = async (id) => {
    const prev = expenses;
    setExpenses(expenses.filter((e) => e.id !== id));
    const { error: delErr } = await supabase.from("expenses").delete().eq("id", id);
    if (delErr) { setExpenses(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
  };

  const openEdit = (exp) => {
    setEditingId(exp.id);
    setEditForm({ category: exp.category, account_id: exp.account_id, amount: String(exp.amount).replace(".", ","), date: exp.date, note: exp.note || "" });
    setEditError(""); setEditDeleteConfirm(false);
    setView("editExpense");
  };

  const saveEditExpense = async () => {
    const amt = parseFloat(String(editForm.amount).replace(",", "."));
    if (!amt || amt <= 0) { setEditError("Inserisci un importo valido."); return; }
    if (!editForm.date) { setEditError("Inserisci una data."); return; }
    setEditError("");
    const { data, error: updErr } = await supabase.from("expenses").update({ category: editForm.category, account_id: editForm.account_id, amount: amt, date: editForm.date, note: editForm.note.trim() }).eq("id", editingId).select().single();
    if (updErr) { setEditError(updErr.message); return; }
    setExpenses((prev) => prev.map((e) => (e.id === editingId ? { id: data.id, category: data.category, account_id: data.account_id, amount: Number(data.amount), date: data.date, note: data.note || "" } : e)));
    setEditingId(null);
    setView("list");
  };

  const confirmDeleteEditing = async () => {
    await removeExpense(editingId);
    setEditingId(null); setEditDeleteConfirm(false);
    setView("list");
  };

  const [catBusy, setCatBusy] = useState(false);

  const activateSuggested = async (sugg) => {
    if (catBusy) return;
    setCatBusy(true);
    const existing = categories.find((c) => c.label === sugg.label);
    if (existing) {
      const { error: updErr } = await supabase.from("categories").update({ archived: false }).eq("id", existing.id);
      if (!updErr) setCategories((prev) => prev.map((c) => (c.id === existing.id ? { ...c, archived: false } : c)));
      else { setSaveState("error"); setLastErrorMsg(updErr.message); }
      setCatBusy(false);
      return;
    }
    const { data, error: insErr } = await supabase.from("categories").insert({ user_id: userId, label: sugg.label, icon_key: null }).select().single();
    if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); setCatBusy(false); return; }
    setCategories((prev) => [...prev, data]);
    setCatBusy(false);
  };

  const addCustomCategory = async () => {
    if (catBusy) return;
    const label = newCatName.trim();
    if (!label) { setCatError("Inserisci un nome."); return; }
    const existsActive = activeCategories.some((c) => c.label.toLowerCase() === label.toLowerCase());
    if (existsActive) { setCatError("Questa voce esiste già."); return; }
    setCatBusy(true);
    const archivedMatch = categories.find((c) => c.archived && c.label.toLowerCase() === label.toLowerCase());
    if (archivedMatch) {
      const { error: updErr } = await supabase.from("categories").update({ archived: false, icon_key: newCatIcon }).eq("id", archivedMatch.id);
      if (updErr) { setCatError(updErr.message); setCatBusy(false); return; }
      setCategories((prev) => prev.map((c) => (c.id === archivedMatch.id ? { ...c, archived: false, icon_key: newCatIcon } : c)));
    } else {
      const { data, error: insErr } = await supabase.from("categories").insert({ user_id: userId, label, icon_key: newCatIcon }).select().single();
      if (insErr) { setCatError(insErr.message); setCatBusy(false); return; }
      setCategories((prev) => [...prev, data]);
    }
    setNewCatName(""); setNewCatIcon("Tag"); setCatError(""); setAddingCustom(false);
    setCatBusy(false);
  };

  const requestRemoval = (cat) => { setRemovalTarget(cat); setRemovalStage("choose"); };
  const cancelRemoval = () => { setRemovalTarget(null); setRemovalStage("choose"); };

  const archiveCategory = async () => {
    const cat = removalTarget;
    const { error: updErr } = await supabase.from("categories").update({ archived: true }).eq("id", cat.rowId);
    if (!updErr) setCategories((prev) => prev.map((c) => (c.id === cat.rowId ? { ...c, archived: true } : c)));
    else { setSaveState("error"); setLastErrorMsg(updErr.message); }
    cancelRemoval();
  };

  const deleteForever = async () => {
    const cat = removalTarget;
    const { error: expDelErr } = await supabase.from("expenses").delete().eq("user_id", userId).eq("category", cat.label);
    if (!expDelErr) setExpenses((prev) => prev.filter((e) => e.category !== cat.label));
    const { error: catDelErr } = await supabase.from("categories").delete().eq("id", cat.rowId);
    if (!catDelErr) setCategories((prev) => prev.filter((c) => c.id !== cat.rowId));
    cancelRemoval();
  };

  const addAccount = async () => {
    if (accBusy) return;
    const name = newAccountName.trim();
    if (!name) { setAccError("Inserisci un nome."); return; }
    const existsActive = accounts.some((a) => a.name.toLowerCase() === name.toLowerCase());
    if (existsActive) { setAccError("Hai già un conto con questo nome."); return; }
    setAccBusy(true);
    const { data, error: insErr } = await supabase.from("accounts").insert({ user_id: userId, name }).select().single();
    setAccBusy(false);
    if (insErr) { setAccError(insErr.message); return; }
    setAccounts((prev) => [...prev, data]);
    setNewAccountName(""); setAccError(""); setAddingAccount(false);
  };

  const requestAccountRemoval = (acc) => setAccRemovalTarget(acc);
  const cancelAccountRemoval = () => setAccRemovalTarget(null);

  const deleteAccount = async () => {
    const acc = accRemovalTarget;
    const { error: delErr } = await supabase.from("accounts").delete().eq("id", acc.id);
    if (!delErr) {
      setAccounts((prev) => prev.filter((a) => a.id !== acc.id));
      setExpenses((prev) => prev.filter((e) => e.account_id !== acc.id));
      if (activeAccountId === acc.id) setActiveAccountId("all");
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    cancelAccountRemoval();
  };

  const exportCSV = (scope) => {
    const rows = scope === "filtered" ? filteredExpenses : [...expenses].sort((a, b) => new Date(a.date) - new Date(b.date));
    if (rows.length === 0) return;
    const header = "Data,Categoria,Conto,Importo,Nota";
    const accName = (id) => (accounts.find((a) => a.id === id) || {}).name || "";
    const lines = rows.map((e) => `${e.date},${e.category},${accName(e.account_id)},${e.amount.toFixed(2)},"${(e.note || "").replace(/"/g, '""')}"`);
    const csv = [header, ...lines].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = scope === "filtered" ? "spese_filtrate.csv" : "spese_tutte.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const signOut = () => supabase.auth.signOut();

  if (!loaded || !categoriesLoaded || !accountsLoaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid #DCE9F5", borderTopColor: "#2F6FED" }} />
        <div style={{ fontSize: 13.5, color: "#5B7B9B" }}>Sto caricando le spese…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>

              {addingAccount ? (
                <div className="fade-in" style={{ marginTop: 16, padding: 12, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5" }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" placeholder="Es. Conto principale" value={newAccountName} onChange={(e) => { setNewAccountName(e.target.value); setAccError(""); }} autoFocus style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #DCE9F5", fontSize: 16, marginBottom: 14 }} />
                  {accError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{accError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    {accounts.length > 0 && (
                      <button onClick={() => { setAddingAccount(false); setNewAccountName(""); setAccError(""); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    )}
                    <button onClick={addAccount} disabled={accBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: accBusy ? "#7D93A8" : "#0B2545", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: accBusy ? "default" : "pointer" }}>Crea conto</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAddingAccount(true)} style={{ marginTop: 16, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "1px dashed #2F6FED", background: "#FFFFFF", color: "#2F6FED", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                  <Plus size={16} /> Crea conto
                </button>
              )}
            </div>

            {accRemovalTarget && (
              <>
                <div onClick={cancelAccountRemoval} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{accRemovalTarget.name}"?</div>
                  <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Verranno eliminate anche tutte le spese registrate su questo conto. L'operazione non è reversibile.</div>
                  <button onClick={deleteAccount} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>
                    Sì, elimina conto e spese
                  </button>
                  <button onClick={cancelAccountRemoval} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#F3F8FD", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>
                    Annulla
                  </button>
                </div>
              </>
            )}
          </>
        ) : view === "categories" ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Gestisci categorie</div>
            </div>
            <div className="scrollbar-thin" style={{ marginTop: 14, flex: 1, minHeight: 0, overflowY: "auto" }}>
              <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Voci suggerite</div>
              {SUGGESTED_CATEGORIES.map((sugg) => {
                const row = categories.find((c) => c.label === sugg.label && !c.archived);
                const active = !!row;
                const Icon = sugg.icon;
                return (
                  <div key={sugg.id} onClick={() => (active ? requestRemoval({ rowId: row.id, label: sugg.label }) : activateSuggested(sugg))} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 4px", borderBottom: "1px dotted #DCE9F5", cursor: "pointer" }}>
                    <div style={{ width: 20, height: 20, borderRadius: 5, border: active ? "1.5px solid #2F6FED" : "1.5px solid #DCE9F5", background: active ? "#2F6FED" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {active && <Check size={13} color="#FFFFFF" />}
                    </div>
                    <Icon size={17} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, fontSize: 15 }}>{sugg.label}</div>
                  </div>
                );
              })}

              <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, margin: "18px 0 8px" }}>Voci personalizzate</div>
              {categories.filter((c) => !c.archived && !SUGGESTED_MAP[c.label]).length > 0 ? categories.filter((c) => !c.archived && !SUGGESTED_MAP[c.label]).map((c) => {
                const IconComp = ICON_MAP[c.icon_key] || Tag;
                return (
                  <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 4px", borderBottom: "1px dotted #DCE9F5" }}>
                    <IconComp size={17} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, fontSize: 15 }}>{c.label}</div>
                    <button onClick={() => requestRemoval({ rowId: c.id, label: c.label })} aria-label="Rimuovi" style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#B7C9DC", flexShrink: 0 }}><Trash2 size={15} /></button>
                  </div>
                );
              }) : (
                <div style={{ fontSize: 13, color: "#B7C9DC", padding: "6px 4px" }}>Nessuna voce personalizzata.</div>
              )}

              {addingCustom ? (
                <div className="fade-in" style={{ marginTop: 16, padding: 12, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5" }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" placeholder="Es. Mutuo secondo immobile" value={newCatName} onChange={(e) => { setNewCatName(e.target.value); setCatError(""); }} autoFocus style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #DCE9F5", fontSize: 16, marginBottom: 14 }} />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setNewCatIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, cursor: "pointer", border: newCatIcon === key ? "1.5px solid #2F6FED" : "1px solid #DCE9F5", background: newCatIcon === key ? "#EFF5FB" : "#FFFFFF" }}>
                        <IconComp size={19} color={newCatIcon === key ? "#2F6FED" : "#5B7B9B"} />
                      </button>
                    ))}
                  </div>
                  {catError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{catError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setAddingCustom(false); setNewCatName(""); setCatError(""); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={addCustomCategory} disabled={catBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: catBusy ? "#7D93A8" : "#0B2545", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: catBusy ? "default" : "pointer" }}>Crea voce</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAddingCustom(true)} style={{ marginTop: 16, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "1px dashed #2F6FED", background: "#FFFFFF", color: "#2F6FED", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                  <Plus size={16} /> Crea voce personalizzata
                </button>
              )}
            </div>

            {removalTarget && (
              <>
                <div onClick={cancelRemoval} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  {removalStage === "choose" ? (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Rimuovere "{removalTarget.label}"?</div>
                      <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Scegli cosa fare delle spese già registrate in questa categoria.</div>
                      <button onClick={() => setRemovalStage("confirmDelete")} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>
                        Sì, elimina — non mi interessa tenere traccia
                      </button>
                      <button onClick={archiveCategory} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#0B2545", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>
                        No, mantieni lo storico
                      </button>
                      <button onClick={cancelRemoval} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "none", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>
                        Annulla
                      </button>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Sei sicuro?</div>
                      <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Questa azione eliminerà definitivamente "{removalTarget.label}" e tutte le spese collegate. Non si può annullare.</div>
                      <button onClick={deleteForever} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#B4483A", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>
                        Conferma eliminazione definitiva
                      </button>
                      <button onClick={cancelRemoval} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>
                        Annulla
                      </button>
                    </>
                  )}
                </div>
              </>
            )}
          </>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <button onClick={() => setView("home")} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "#5B7B9B", display: "flex", alignItems: "center" }}><ArrowLeft size={18} /></button>
              <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>Movimenti</div>
              <button onClick={() => setShowFilters((s) => !s)} style={{ display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 999, border: filtersActive ? "1px solid #2F6FED" : "1px solid #DCE9F5", background: filtersActive ? "#2F6FED" : "#FFFFFF", color: filtersActive ? "#FFFFFF" : "#5B7B9B", fontSize: 12, cursor: "pointer" }}>
                <SlidersHorizontal size={13} /> Filtri
              </button>
            </div>
            {showFilters && (
              <div className="fade-in" style={{ marginTop: 8, padding: 10, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5", flexShrink: 0 }}>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Periodo</div>
                <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                  <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value })} aria-label="Da data" style={{ flex: 1, minWidth: 0, padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545" }} />
                  <input type="date" value={filters.dateTo} onChange={(e) => setFilters({ ...filters, dateTo: e.target.value })} aria-label="A data" style={{ flex: 1, minWidth: 0, padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545" }} />
                </div>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Categoria</div>
                <select value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })} style={{ width: "100%", padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545", marginBottom: 8, background: "#FFFFFF" }}>
                  <option value="Tutte">Tutte le categorie</option>
                  {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}{c.archived ? " (archiviata)" : ""}</option>)}
                </select>
                <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 5 }}>Importo</div>
                <select value={filters.amountMode} onChange={(e) => setFilters({ ...filters, amountMode: e.target.value })} style={{ width: "100%", padding: "6px 8px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16, color: "#0B2545", marginBottom: 6, background: "#FFFFFF" }}>
                  <option value="any">Qualsiasi importo</option>
                  <option value="lt">Inferiore a</option>
                  <option value="gt">Superiore a</option>
                  <option value="between">Compreso tra</option>
                </select>
                {filters.amountMode !== "any" && (
                  <div style={{ display: "flex", gap: 6 }}>
                    <input type="text" inputMode="decimal" placeholder={filters.amountMode === "between" ? "Min €" : "€"} value={filters.amountMin} onChange={(e) => setFilters({ ...filters, amountMin: e.target.value })} className="mono" style={{ flex: 1, minWidth: 0, padding: "6px 10px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16 }} />
                    {filters.amountMode === "between" && (
                      <input type="text" inputMode="decimal" placeholder="Max €" value={filters.amountMax} onChange={(e) => setFilters({ ...filters, amountMax: e.target.value })} className="mono" style={{ flex: 1, minWidth: 0, padding: "6px 10px", borderRadius: 7, border: "1px solid #DCE9F5", fontSize: 16 }} />
                    )}
                  </div>
                )}
                {filtersActive && (
                  <button onClick={resetFilters} style={{ marginTop: 10, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "8px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#B4483A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                    <X size={13} /> Rimuovi filtri
                  </button>
                )}
              </div>
            )}
            <div className="mono" style={{ fontSize: 13, color: "#5B7B9B", padding: "8px 0", borderBottom: "1px solid #DCE9F5", flexShrink: 0, marginTop: showFilters ? 0 : 8 }}>
              Totale: <span style={{ color: "#0B2545", fontWeight: 600 }}>{fmtEUR(filteredTotal)}</span> · {filteredExpenses.length} {filteredExpenses.length === 1 ? "movimento" : "movimenti"}
            </div>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", marginTop: 4 }}>
              {filteredExpenses.length > 0 ? filteredExpenses.map((e) => {
                const cat = CATEGORIES.find((c) => c.id === e.category);
                const Icon = cat ? cat.icon : CircleEllipsis;
                const d = new Date(e.date);
                return (
                  <div key={e.id} className="row-hover" onClick={() => openEdit(e)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 6px", borderBottom: "1px dotted #DCE9F5", cursor: "pointer" }}>
                    <Icon size={18} color="#5B7B9B" style={{ flexShrink: 0 }} />
                    <div style={{ width: 40, fontSize: 14, color: "#5B7B9B", flexShrink: 0 }}>{String(d.getDate()).padStart(2, "0")}/{String(d.getMonth() + 1).padStart(2, "0")}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 17, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.note ? e.note : cat ? cat.label : e.category}</div>
                      {e.note && <div style={{ fontSize: 13, color: "#B7C9DC" }}>{e.category}</div>}
                    </div>
                    <div className="mono" style={{ fontSize: 18, fontWeight: 600, flexShrink: 0 }}>{fmtEUR(e.amount)}</div>
                  </div>
                );
              }) : (
                <div style={{ fontSize: 12.5, color: "#B7C9DC", padding: "10px 4px" }}>Nessun movimento corrisponde ai filtri.</div>
              )}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => exportCSV("filtered")} disabled={filteredExpenses.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: filteredExpenses.length ? "#0B2545" : "#B7C9DC", fontSize: 12, cursor: filteredExpenses.length ? "pointer" : "not-allowed" }}>
                <Download size={13} /> CSV filtrato
              </button>
              <button onClick={() => exportCSV("all")} disabled={expenses.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 7, border: "1px solid #DCE9F5", background: "#FFFFFF", color: expenses.length ? "#0B2545" : "#B7C9DC", fontSize: 12, cursor: expenses.length ? "pointer" : "not-allowed" }}>
                <Download size={13} /> CSV completo
              </button>
            </div>
            <div style={{ textAlign: "center", fontSize: 10.5, color: "#B7C9DC", marginTop: 6, flexShrink: 0 }}>Dati sincronizzati</div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
