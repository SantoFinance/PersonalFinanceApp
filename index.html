<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root {
  --color-primary: #45828B;
  --color-heading: #055B65;
  --color-border: #E0E5E9;
  --color-border-light: #B2C9C5;
  --color-bg-tint: #F6FAFA;
  --color-success: #1BD488;
  --color-danger: #B4483A;
  --color-danger-border: #EAC4BC;
  --color-danger-bg: #FBEEEC;
  --color-warning: #A5720B;
  --color-warning-bg: #FFF8EC;
  --color-warning-border: #F0D9A6;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: 'Public Sans', system-ui, sans-serif; color: var(--color-heading); background: #FFFFFF; }
input, select, button { font-family: inherit; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.mono { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; }
.bar-fill { transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
.fade-in { animation: fadeIn 0.35s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.splash { animation: splashFade 2s ease forwards; }
@keyframes splashFade { 0% { opacity: 0; transform: scale(0.97); } 10% { opacity: 1; transform: scale(1); } 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
.splash-ring { animation: ringPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
@keyframes ringPop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
.splash-bar-fill { animation: splashBar 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
@keyframes splashBar { from { width: 0%; } to { width: 100%; } }
.chip { transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.spinner { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.row-hover:hover { background: var(--color-bg-tint); }
.scrollbar-thin::-webkit-scrollbar { width: 6px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
.no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
.no-scrollbar::-webkit-scrollbar { display: none; height: 0; width: 0; }
@media (prefers-reduced-motion: reduce) {
  .bar-fill, .fade-in, .splash, .splash-ring, .splash-bar-fill { animation: none !important; transition: none !important; }
  .splash-bar-fill { width: 100%; }
}
</style>
</head>
<body>

function monthKeyFromIdx(idx) {
  const y = Math.floor(idx / 12);
  const m = ((idx % 12) + 12) % 12;
  return `${y}-${String(m + 1).padStart(2, "0")}`;
}
function monthKeyToIdx(k) {
  const [y, m] = k.split("-").map(Number);
  return y * 12 + (m - 1);
}
function yy(year) {
  return String(year).slice(-2);
}
function periodLabel(periodMode, cursor) {

    const startMonth = ((startIdx % 12) + 12) % 12;
    if (startYear === cursor.year) return `${MESI[startMonth].slice(0, 3)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
    return `${MESI[startMonth].slice(0, 3)} ${yy(startYear)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
  }
  if (periodMode === "ytd") return `Gen–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
}

function fmtEUR(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
}

const PrivacyContext = React.createContext({ hideAmounts: false, toggleHideAmounts: () => {} });
function usePrivacy() {

}
function Money({ children, className, style }) {

function monthKey(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`;
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function currentMonthISO() {
  return new Date().toISOString().slice(0, 7);
}
function monthDateToFull(m) {
  return `${m}-01`;
}
function fullDateToMonth(d) {
  return String(d).slice(0, 7);
}
function fmtMonthYear(m) {
  const [y, mo] = m.split("-").map(Number);
  return `${MESI[mo - 1].slice(0, 3)} ${String(y).slice(-2)}`;
}
function addMonthsToDate(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const idx = y * 12 + (m - 1) + n;
  const targetY = Math.floor(idx / 12);
  const targetM = ((idx % 12) + 12) % 12;
  const daysInTarget = new Date(targetY, targetM + 1, 0).getDate();
  const targetD = Math.min(d, daysInTarget);
  return `${targetY}-${String(targetM + 1).padStart(2, "0")}-${String(targetD).padStart(2, "0")}`;
}
function genGroupId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : ("g-" + Date.now() + "-" + Math.random().toString(36).slice(2));
}
function getGreeting() {
  const h = new Date().getHours();
  if (h < 5) return "Buonanotte";
  if (h < 12) return "Buongiorno";
  if (h < 18) return "Buon pomeriggio";
  return "Buonasera";
}
function useKeyboardOffset() {
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const update = () => {
      const kb = window.innerHeight - vv.height - vv.offsetTop;
      setOffset(kb > 40 ? kb : 0);
    };
    update();
    vv.addEventListener("resize", update);
    vv.addEventListener("scroll", update);
    return () => {
      vv.removeEventListener("resize", update);
      vv.removeEventListener("scroll", update);
    };
  }, []);
  return offset;
}

        if (cf === undefined) return;
        hasAny = true;
        const tracked = (trackedByAccountMonth[accId] && trackedByAccountMonth[accId][mk]) || 0;
        value += cf - tracked;
      });
    });
    return { value, hasAny };
  }, [activeAccountId, accounts, periodMonthKeys, cfExpensesByAccountMonth, trackedByAccountMonth]);

  const grandTotal = total + (untrackedInfo.hasAny ? untrackedInfo.value : 0);

      const min = parseFloat(String(filters.amountMin).replace(",", "."));

      if (filters.amountMode === "lt" && !isNaN(min) && !(e.amount < min)) return false;
      if (filters.amountMode === "gt" && !isNaN(min) && !(e.amount > min)) return false;
      if (filters.amountMode === "between") {
        if (!isNaN(min) && e.amount < min) return false;
        if (!isNaN(max) && e.amount > max) return false;

  const addExpense = async (e) => {

    if (!form.account_id) { setError("Seleziona un conto."); return; }
    if (form.recurring) {
      if (!form.recurringUntil) { setError("Seleziona fino a quale mese ripetere la spesa."); return; }

    }
    setError("");
    setSaveState("saving");
    if (form.recurring) {
      const startIdx = monthKeyToIdx(fullDateToMonth(form.date));
      const endIdx = monthKeyToIdx(form.recurringUntil);
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, category: form.category, account_id: form.account_id, amount: amt, date: addMonthsToDate(form.date, idx - startIdx), note: form.note.trim(), recurring_group_id: groupId });

      const { data, error: insErr } = await supabase.from("expenses").insert(rows).select();
      if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }
      setExpenses((prev) => [...data.map((d) => ({ id: d.id, category: d.category, account_id: d.account_id, amount: Number(d.amount), date: d.date, note: d.note || "", recurring_group_id: d.recurring_group_id || null })), ...prev]);
    } else {
      const { data, error: insErr } = await supabase.from("expenses").insert({ user_id: userId, category: form.category, account_id: form.account_id, amount: amt, date: form.date, note: form.note.trim() }).select().single();
      if (insErr) { setSaveState("error"); setLastErrorMsg(insErr.message); return; }
      setExpenses((prev) => [{ id: data.id, category: data.category, account_id: data.account_id, amount: Number(data.amount), date: data.date, note: data.note || "", recurring_group_id: data.recurring_group_id || null }, ...prev]);

                <div style={{ fontSize: 16, fontWeight: 600, color: "var(--color-heading)", marginBottom: 6 }}>Crea il tuo primo conto</div>
                <div style={{ fontSize: 13.5, color: "var(--color-primary)", marginBottom: 18, maxWidth: 260 }}>I conti si creano da Profilo → Gestione conti, e vengono usati sia qui che in Flussi di cassa.</div>
                <button onClick={onBack} style={{ padding: "11px 22px", borderRadius: 8, border: "none", background: "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>

                    {accounts.map((a) => (
                      <button key={a.id} onClick={() => setActiveAccountId(a.id)} style={{ padding: "6px 12px", borderRadius: 999, border: activeAccountId === a.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: activeAccountId === a.id ? "var(--color-primary)" : "#FFFFFF", color: activeAccountId === a.id ? "#FFFFFF" : "var(--color-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{a.name}</button>

function CapitalChart({ months, market, cost, futureFromMonth }) {
  const { hideAmounts } = usePrivacy();
  const width = 460, height = 190;
  const padding = { top: 14, right: 12, bottom: 26, left: 4 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const svgRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(null);

  if (months.length < 2) {
    return (
      <div style={{ textAlign: "center", padding: "40px 10px", color: "var(--color-primary)", fontSize: 13.5 }}>
        Servono almeno due mesi di dati per disegnare l'andamento.
      </div>
    );
  }

  const allValues = [...market, ...cost];
  const rawMax = Math.max(...allValues);
  const rawMin = Math.min(...allValues);
  const rawRange = rawMax - rawMin || Math.abs(rawMax) || 1;
  const pad = rawRange * 0.12;
  const maxV = rawMax + pad;
  const minV = rawMin - pad;
  const range = maxV - minV || 1;
  const xStep = innerW / (months.length - 1);
  const xFor = (i) => padding.left + i * xStep;
  const yFor = (v) => padding.top + innerH - ((v - minV) / range) * innerH;
  const pathForRange = (series, startIdx, endIdx) => {
    let d = "";
    for (let i = startIdx; i <= endIdx; i++) d += `${i === startIdx ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(series[i]).toFixed(1)} `;
    return d.trim();
  };

  const futureIdx = futureFromMonth ? months.findIndex((m) => m > futureFromMonth) : -1;
  const hasFuture = futureIdx > 0 && futureIdx < months.length;
  const splitX = hasFuture ? (xFor(futureIdx - 1) + xFor(futureIdx)) / 2 : null;

  const labelEvery = Math.max(1, Math.ceil(months.length / 6));

  const indexFromClientX = (clientX) => {
    const svg = svgRef.current;
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    if (rect.width === 0) return null;
    const relX = ((clientX - rect.left) / rect.width) * width;
    const idx = Math.round((relX - padding.left) / xStep);
    return Math.min(months.length - 1, Math.max(0, idx));
  };

  const handlePointerDown = (e) => {
    e.currentTarget.setPointerCapture?.(e.pointerId);
    const idx = indexFromClientX(e.clientX);
    if (idx !== null) setActiveIndex(idx);
  };
  const handlePointerMove = (e) => {
    if (activeIndex === null) return;
    const idx = indexFromClientX(e.clientX);
    if (idx !== null) setActiveIndex(idx);
  };
  const handlePointerUp = () => setActiveIndex(null);

  let tooltip = null;
  if (activeIndex !== null) {
    const tx = xFor(activeIndex);
    const boxW = 150, boxH = 60;
    let boxX = tx - boxW / 2;
    if (boxX < 2) boxX = 2;
    if (boxX + boxW > width - 2) boxX = width - 2 - boxW;
    const boxY = padding.top + 2;
    tooltip = (
      <g pointerEvents="none">
        <line x1={tx} y1={padding.top} x2={tx} y2={height - padding.bottom} stroke="var(--color-heading)" strokeWidth="1" strokeDasharray="3 3" opacity="0.35" />
        <circle cx={tx} cy={yFor(cost[activeIndex])} r="4.5" fill="var(--color-border-light)" stroke="#FFFFFF" strokeWidth="1.5" />
        <circle cx={tx} cy={yFor(market[activeIndex])} r="5" fill="var(--color-primary)" stroke="#FFFFFF" strokeWidth="1.5" />
        <rect x={boxX} y={boxY} width={boxW} height={boxH} rx="9" fill="var(--color-heading)" opacity="0.94" />
        <text x={boxX + 11} y={boxY + 17} fontSize="11.5" fill="var(--color-border-light)" textAnchor="start" style={{ textTransform: "capitalize" }}>{fmtMonthYear(months[activeIndex])}</text>
        <text x={boxX + 11} y={boxY + 36} fontSize="16" fontWeight="700" fill="#FFFFFF" textAnchor="start">{fmtEUR(market[activeIndex])}</text>
        <text x={boxX + 11} y={boxY + 52} fontSize="12.5" fill="var(--color-border-light)" textAnchor="start">Costo: {fmtEUR(cost[activeIndex])}</text>
      </g>
    );
  }

  return (
    <div style={{ width: "100%", maxWidth: "100%", margin: "0 auto", overflow: "hidden", boxSizing: "border-box" }}>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${width} ${height}`}
        style={{ display: "block", width: "100%", maxWidth: "100%", height: "auto", filter: hideAmounts ? "blur(6px)" : "none", transition: "filter 0.15s", touchAction: "none", cursor: "crosshair" }}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerLeave={handlePointerUp}
        onPointerCancel={handlePointerUp}
      >
        {hasFuture && (
          <rect x={splitX} y={padding.top} width={Math.max(0, width - padding.right - splitX)} height={innerH} fill="var(--color-heading)" opacity="0.035" />
        )}
        {hasFuture ? (
          <>
            <path d={pathForRange(cost, 0, futureIdx)} fill="none" stroke="var(--color-border-light)" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" />
            <path d={pathForRange(cost, futureIdx, months.length - 1)} fill="none" stroke="var(--color-border-light)" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="4 3" opacity="0.6" />
            <path d={pathForRange(market, 0, futureIdx)} fill="none" stroke="var(--color-primary)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
            <path d={pathForRange(market, futureIdx, months.length - 1)} fill="none" stroke="var(--color-primary)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="4 3" opacity="0.6" />
          </>
        ) : (
          <>
            <path d={pathForRange(cost, 0, months.length - 1)} fill="none" stroke="var(--color-border-light)" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" />
            <path d={pathForRange(market, 0, months.length - 1)} fill="none" stroke="var(--color-primary)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
          </>
        )}
        {months.map((m, i) => {
          const isFuture = hasFuture && i >= futureIdx;
          return <circle key={`c${m}`} cx={xFor(i)} cy={yFor(cost[i])} r={2.5} fill={isFuture ? "#FFFFFF" : "var(--color-border-light)"} stroke={isFuture ? "var(--color-border-light)" : "none"} strokeWidth={isFuture ? 1.3 : 0} opacity={isFuture ? 0.75 : 1} />;
        })}
        {months.map((m, i) => {
          const isFuture = hasFuture && i >= futureIdx;
          return <circle key={`m${m}`} cx={xFor(i)} cy={yFor(market[i])} r={3} fill={isFuture ? "#FFFFFF" : "var(--color-primary)"} stroke={isFuture ? "var(--color-primary)" : "none"} strokeWidth={isFuture ? 1.5 : 0} opacity={isFuture ? 0.8 : 1} />;
        })}
        {hasFuture && (
          <>
            <line x1={splitX} y1={padding.top} x2={splitX} y2={height - padding.bottom} stroke="var(--color-primary)" strokeWidth="1" strokeDasharray="2 2" opacity="0.5" />
            <text x={splitX} y={padding.top - 3} fontSize="8" fill="var(--color-primary)" textAnchor="middle">Oggi</text>
          </>
        )}
        {months.map((m, i) => {
          if (i % labelEvery !== 0) return null;
          const anchor = i === 0 ? "start" : (i === months.length - 1 ? "end" : "middle");
          const isFuture = hasFuture && i >= futureIdx;
          return <text key={m} x={xFor(i)} y={height - 8} fontSize="11" fill={isFuture ? "var(--color-border-light)" : "var(--color-primary)"} textAnchor={anchor}>{fmtMonthYear(m)}</text>;
        })}
        {tooltip}
      </svg>
    </div>
  );
}

const PIE_COLORS = ["var(--color-primary)", "#5FBF7A", "#F2A65A", "#B98CD1", "#4FC1C7", "#E0708A", "#8C9EFF", "#F4C542"];

function PortfolioPieChart({ portfolios, getPct }) {
  const size = 140, stroke = 26;
  const r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let cumulative = 0;

  if (portfolios.length === 0 || portfolios.every((p) => getPct(p) === 0)) {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--color-bg-tint)" strokeWidth={stroke} />
      </svg>
    );
  }

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`rotate(-90 ${cx} ${cy})`}>
        {portfolios.map((p, i) => {
          const pct = getPct(p);
          if (pct <= 0) return null;
          const dash = (pct / 100) * circumference;
          const gap = circumference - dash;
          const offset = -(cumulative / 100) * circumference;
          cumulative += pct;
          return (
            <circle key={p.id} cx={cx} cy={cy} r={r} fill="none" stroke={PIE_COLORS[i % PIE_COLORS.length]} strokeWidth={stroke} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={offset} />
          );
        })}
      </g>
    </svg>
  );
}

function sumLatestValuationAsOf(items, valuations, itemIdField, cutoffFullDate) {
  const map = {};
  valuations.forEach((v) => {
    if (v.value_date > cutoffFullDate) return;
    const id = v[itemIdField];
    const cur = map[id];
    if (!cur || v.value_date > cur.value_date) map[id] = v;
  });
  let total = 0;
  items.forEach((it) => { const v = map[it.id]; if (v) total += Number(v.market_value); });
  return total;
}

function sumLatestValuationWithCostAsOf(items, valuations, itemIdField, cutoffFullDate) {
  const map = {};
  valuations.forEach((v) => {
    if (v.value_date > cutoffFullDate) return;
    const id = v[itemIdField];
    const cur = map[id];
    if (!cur || v.value_date > cur.value_date) map[id] = v;
  });
  let marketValue = 0, costBasis = 0;
  items.forEach((it) => {
    const v = map[it.id];
    if (v) { marketValue += Number(v.market_value); costBasis += Number(v.cost_basis); }
  });
  return { marketValue, costBasis };
}

function cashflowBalanceAtMonth(settings, entriesMap, monthKey) {
  if (!settings) return 0;
  if (monthKey === settings.monthKey) return settings.balance;
  if (monthKeyToIdx(monthKey) <= monthKeyToIdx(settings.monthKey)) return 0;
  const yearForChain = Number(monthKey.split("-")[0]);
  const chain = buildCashflowChain(settings, entriesMap, yearForChain);
  const r = chain[monthKey];
  return r && r.bankBalance !== null && r.bankBalance !== undefined ? r.bankBalance : 0;
}

    const { data, error: insErr } = await supabase.from("cashflow_accounts").insert({ user_id: session.user.id, name }).select().single();
    setAccBusy(false);
    if (insErr) { setAccError(insErr.message); return; }
    setAccounts((prev) => [...prev, data]);
    setNewAccountName(""); setAccError(""); setAddingAccount(false);
  };

  const openEditAccount = (a) => {
    setEditingAccountId(a.id);
    setEditAccountName(a.name);
    setEditAccountError("");
  };

  const saveEditAccount = async () => {
    if (editAccountBusy) return;
    const name = editAccountName.trim();
    if (!name) { setEditAccountError("Inserisci un nome."); return; }
    setEditAccountBusy(true);
    const { data, error: updErr } = await supabase.from("cashflow_accounts").update({ name }).eq("id", editingAccountId).select().single();
    setEditAccountBusy(false);
    if (updErr) { setEditAccountError(updErr.message); return; }
    setAccounts((prev) => prev.map((a) => (a.id === editingAccountId ? data : a)));
    setEditingAccountId(null);
  };

  const deleteAccount = async () => {
    const acc = removalAccount;
    const { error: delErr } = await supabase.from("cashflow_accounts").delete().eq("id", acc.id);

                <UserCircle size={18} color="var(--color-primary)" />

              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 15.5, fontWeight: 600, color: "var(--color-heading)" }}>Nome utente</div>
                <div style={{ fontSize: 12.5, color: "var(--color-primary)", marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fullName || "Non impostato"}</div>
              </div>
              <ChevronRight size={16} color="var(--color-border-light)" />
            </button>

            <button onClick={() => { setAccountsLoaded(false); setView("accounts"); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 14, padding: "16px 14px", borderRadius: 12, border: "1px solid var(--color-border)", background: "#FFFFFF", cursor: "pointer", textAlign: "left" }}>

                <Landmark size={18} color="var(--color-primary)" />

              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 15.5, fontWeight: 600, color: "var(--color-heading)" }}>Gestione conti</div>
                <div style={{ fontSize: 12.5, color: "var(--color-primary)", marginTop: 1 }}>Usati in Le mie spese e Flussi di cassa</div>

              <ChevronRight size={16} color="var(--color-border-light)" />
            </button>
          </>
        )}

        {view === "name" && (
          <>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome e cognome</div>
            <input type="text" placeholder="Es. Mario Rossi" value={nameInput} onChange={(e) => { setNameInput(e.target.value); setNameError(""); }} autoFocus style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
            {nameError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{nameError}</div>}
            <button onClick={saveName} disabled={nameBusy} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: nameBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: nameBusy ? "default" : "pointer" }}>Salva</button>
          </>

        {view === "accounts" && (
          !accountsLoaded ? (
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>

          ) : (
            <>

                {accounts.length > 0 ? accounts.map((a) => (
                  <div key={a.id} onClick={() => openEditAccount(a)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 6px", borderBottom: "1px dotted var(--color-border)", cursor: "pointer" }}>
                    <Landmark size={17} color="var(--color-primary)" style={{ flexShrink: 0 }} />
                    <div style={{ flex: 1, fontSize: 15 }}>{a.name}</div>
                    <ChevronRight size={16} color="var(--color-border-light)" />
                  </div>
                )) : (
                  <div style={{ fontSize: 13, color: "var(--color-border-light)", padding: "6px 4px" }}>Nessun conto ancora.</div>
                )}
              </div>

              {addingAccount ? (
                <div className="fade-in" style={{ marginTop: 12, padding: 12, background: "var(--color-bg-tint)", borderRadius: 10, border: "1px solid var(--color-border)", flexShrink: 0 }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" placeholder="Es. Conto principale" value={newAccountName} onChange={(e) => { setNewAccountName(e.target.value); setAccError(""); }} autoFocus style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
                  {accError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{accError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setAddingAccount(false); setNewAccountName(""); setAccError(""); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={addAccount} disabled={accBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: accBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: accBusy ? "default" : "pointer" }}>Crea conto</button>

                </button>
              )}

          )

      </div>

      {editingAccountId && (

          <div onClick={() => setEditingAccountId(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
          <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24 + kbOffset, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Modifica conto</div>
            <input type="text" value={editAccountName} onChange={(e) => { setEditAccountName(e.target.value); setEditAccountError(""); }} autoFocus style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
            {editAccountError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editAccountError}</div>}
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button onClick={() => setEditingAccountId(null)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
              <button onClick={saveEditAccount} disabled={editAccountBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: editAccountBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: editAccountBusy ? "default" : "pointer" }}>Salva</button>
            </div>
            <button onClick={() => setRemovalAccount(accounts.find((a) => a.id === editingAccountId))} style={{ width: "100%", padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <Trash2 size={13} /> Elimina conto
            </button>
          </div>
        </>
      )}

      {removalAccount && (
        <>
          <div onClick={() => setRemovalAccount(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 41 }} />
          <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 42 }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalAccount.name}"?</div>
            <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16, lineHeight: 1.5 }}>Verranno eliminati anche tutti i dati collegati a questo conto in Le mie spese e Flussi di cassa (spese, saldo di apertura, mesi registrati). L'operazione non è reversibile.</div>
            <button onClick={deleteAccount} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina conto</button>
            <button onClick={() => setRemovalAccount(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
          </div>
        </>
      )}
    </div>
  );
}

function NetWorthApp({ session, onBack }) {
  const [loaded, setLoaded] = useState(false);
  const [investHoldings, setInvestHoldings] = useState([]);
  const [investValuations, setInvestValuations] = useState([]);
  const [insurancePolicies, setInsurancePolicies] = useState([]);
  const [insuranceValuations, setInsuranceValuations] = useState([]);
  const [reProperties, setReProperties] = useState([]);
  const [reValuations, setReValuations] = useState([]);
  const [cfAccounts, setCfAccounts] = useState([]);
  const [cfSettings, setCfSettings] = useState([]);
  const [cfEntries, setCfEntries] = useState([]);

  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  useEffect(() => {
    (async () => {
      const [ih, iv, ip, ipv, rp, rpv, ca, cs, ce] = await Promise.all([
        supabase.from("investment_holdings").select("id"),
        supabase.from("investment_valuations").select("holding_id,value_date,market_value,cost_basis"),
        supabase.from("insurance_policies").select("id"),
        supabase.from("insurance_valuations").select("policy_id,value_date,market_value,cost_basis"),
        supabase.from("real_estate_properties").select("id"),
        supabase.from("real_estate_valuations").select("property_id,value_date,market_value,cost_basis"),
        supabase.from("cashflow_accounts").select("id"),
        supabase.from("cashflow_settings").select("*"),
        supabase.from("cashflow_entries").select("*"),
      ]);
      setInvestHoldings(ih.data || []);
      setInvestValuations(iv.data || []);
      setInsurancePolicies(ip.data || []);
      setInsuranceValuations(ipv.data || []);
      setReProperties(rp.data || []);
      setReValuations(rpv.data || []);
      setCfAccounts(ca.data || []);
      setCfSettings((cs.data || []).map((s) => ({ id: s.id, account_id: s.account_id, balance: Number(s.opening_balance), monthKey: fullDateToMonth(s.opening_date) })));
      setCfEntries((ce.data || []).map((e) => ({ ...e, income: Number(e.income), investments: Number(e.investments), expenses: Number(e.expenses), bank_balance: e.bank_balance === null ? null : Number(e.bank_balance) })));
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);
  const cursorMonthKey = monthKeyFromIdx(cursor.year * 12 + cursor.month);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      return { year: Math.floor(idx / 12), month: ((idx % 12) + 12) % 12 };
    });
  };

  const investTotal = useMemo(() => sumLatestValuationAsOf(investHoldings, investValuations, "holding_id", cursorFullDate), [investHoldings, investValuations, cursorFullDate]);
  const insuranceTotal = useMemo(() => sumLatestValuationAsOf(insurancePolicies, insuranceValuations, "policy_id", cursorFullDate), [insurancePolicies, insuranceValuations, cursorFullDate]);
  const realEstateTotal = useMemo(() => sumLatestValuationAsOf(reProperties, reValuations, "property_id", cursorFullDate), [reProperties, reValuations, cursorFullDate]);

  const cfSettingsByAccount = useMemo(() => {
    const m = {};
    cfSettings.forEach((s) => { m[s.account_id] = s; });
    return m;
  }, [cfSettings]);
  const cfEntriesByAccount = useMemo(() => {
    const m = {};
    cfEntries.forEach((e) => {
      if (!m[e.account_id]) m[e.account_id] = {};
      m[e.account_id][fullDateToMonth(e.value_date)] = e;
    });
    return m;
  }, [cfEntries]);

  const cashflowTotal = useMemo(() => {
    let total = 0;
    cfAccounts.forEach((acc) => {
      const s = cfSettingsByAccount[acc.id];
      total += cashflowBalanceAtMonth(s, cfEntriesByAccount[acc.id] || {}, cursorMonthKey);
    });
    return total;
  }, [cfAccounts, cfSettingsByAccount, cfEntriesByAccount, cursorMonthKey]);

  const grandTotal = investTotal + insuranceTotal + realEstateTotal + cashflowTotal;

  const rows = [
    { key: "invest", label: "Investimenti", icon: TrendingUp, value: investTotal },
    { key: "realestate", label: "Immobili", icon: Home, value: realEstateTotal },
    { key: "insurance", label: "Assicurazioni e Previdenza", icon: Shield, value: insuranceTotal },
    { key: "cashflow", label: "Conto corrente", icon: ArrowLeftRight, value: cashflowTotal },
  ];

  const [dashboardView, setDashboardView] = useState("list");

  const buildNetWorthMapAsOf = (cutoffFullDate) => {
    const mk = fullDateToMonth(cutoffFullDate);
    const invest = sumLatestValuationWithCostAsOf(investHoldings, investValuations, "holding_id", cutoffFullDate);
    const insurance = sumLatestValuationWithCostAsOf(insurancePolicies, insuranceValuations, "policy_id", cutoffFullDate);
    const realestate = sumLatestValuationWithCostAsOf(reProperties, reValuations, "property_id", cutoffFullDate);
    let cashflow = 0;
    cfAccounts.forEach((acc) => {
      const s = cfSettingsByAccount[acc.id];
      cashflow += cashflowBalanceAtMonth(s, cfEntriesByAccount[acc.id] || {}, mk);
    });
    return { invest, insurance, realestate, cashflow: { marketValue: cashflow, costBasis: cashflow } };
  };

  const netWorthItems = [
    { id: "invest", name: "Investimenti", icon: TrendingUp },
    { id: "realestate", name: "Immobili", icon: Home },
    { id: "insurance", name: "Assicurazioni e Previdenza", icon: Shield },
    { id: "cashflow", name: "Conto corrente", icon: ArrowLeftRight },
  ];
  const netWorthGetTotalsFromMap = (item, map) => {
    const v = map[item.id] || { marketValue: 0, costBasis: 0 };
    return { marketValue: v.marketValue, costBasis: v.costBasis, gain: v.marketValue - v.costBasis, hasData: true };
  };

  const historyMonths = useMemo(() => {
    const allDates = [
      ...investValuations.map((v) => v.value_date),
      ...insuranceValuations.map((v) => v.value_date),
      ...reValuations.map((v) => v.value_date),
      ...cfEntries.map((e) => e.value_date),
      ...cfSettings.map((s) => monthDateToFull(s.monthKey)),
    ];
    if (allDates.length === 0) return [];
    const monthKeys = allDates.map((d) => fullDateToMonth(d));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx), cursor.year * 12 + cursor.month);
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [investValuations, insuranceValuations, reValuations, cfEntries, cfSettings, cursor]);

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto calcolando il patrimonio…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={onBack} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
          <ArrowLeft size={22} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>Patrimonio</span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "0 0 10px", flexShrink: 0 }}>
          <div style={{ display: "flex", background: "var(--color-bg-tint)", borderRadius: 10, padding: 3, width: "100%", maxWidth: 380 }}>
            <button onClick={() => setDashboardView("list")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: dashboardView === "list" ? "#FFFFFF" : "transparent", color: dashboardView === "list" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "list" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
              Elenco
            </button>
            <button onClick={() => setDashboardView("chart")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: dashboardView === "chart" ? "#FFFFFF" : "transparent", color: dashboardView === "chart" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "chart" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
              Statistiche
            </button>
            <button onClick={() => setDashboardView("balance")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: dashboardView === "balance" ? "#FFFFFF" : "transparent", color: dashboardView === "balance" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "balance" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
              Bilancio
            </button>
          </div>
        </div>

        {dashboardView === "list" && (
          <>
        <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
          <button onClick={() => goCursor(-1)} aria-label="Mese precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronLeft size={32} /></button>
          <div onClick={() => { setPickerYear(cursor.year); setDatePickerOpen(true); }} style={{ fontSize: "clamp(18px, 6vw, 28px)", letterSpacing: "0.01em", color: "var(--color-heading)", fontWeight: 700, whiteSpace: "nowrap", flex: 1, minWidth: 0, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", cursor: "pointer", textTransform: "capitalize" }}>{MESI[cursor.month]} {String(cursor.year).slice(-2)}</div>
          <button onClick={() => goCursor(1)} aria-label="Mese successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronRight size={32} /></button>

          {datePickerOpen && (
            <>
              <div onClick={() => setDatePickerOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 39 }} />
              <div className="fade-in" style={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: 6, zIndex: 40 }}>
                <div style={{ maxWidth: 260, margin: "0 auto", background: "#FFFFFF", border: "1px solid var(--color-border)", borderRadius: 12, boxShadow: "0 12px 28px rgba(5,91,101,0.16)", padding: 14 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                    <button onClick={() => setPickerYear((y) => y - 1)} aria-label="Anno precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronLeft size={18} /></button>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "var(--color-heading)" }}>{pickerYear}</div>
                    <button onClick={() => setPickerYear((y) => y + 1)} aria-label="Anno successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronRight size={18} /></button>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
                    {MESI.map((m, i) => {
                      const isSelected = pickerYear === cursor.year && i === cursor.month;
                      return (
