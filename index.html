.bar-fill { transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

@keyframes spin { to { transform: rotate(360deg); } }

.no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

@media (prefers-reduced-motion: reduce) {
  .bar-fill, .fade-in, .splash, .splash-ring, .splash-bar-fill { animation: none !important; transition: none !important; }

  if (periodMode === "month") return `${MESI[cursor.month]} ${yy(cursor.year)}`;
  if (periodMode === "quarter" || periodMode === "semester" || periodMode === "year") {
    const months = periodMode === "quarter" ? 3 : periodMode === "semester" ? 6 : 12;
    const startIdx = cursor.year * 12 + cursor.month - (months - 1);
    const startYear = Math.floor(startIdx / 12);
    const startMonth = ((startIdx % 12) + 12) % 12;
    if (startYear === cursor.year) return `${MESI[startMonth].slice(0, 3)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
    return `${MESI[startMonth].slice(0, 3)} ${yy(startYear)}–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
  }
  if (periodMode === "ytd") return `Gen–${MESI[cursor.month].slice(0, 3)} ${yy(cursor.year)}`;
}

function fmtEUR(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n);
}

function monthKey(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`;
}
function todayISO() {

}
function currentMonthISO() {
  return new Date().toISOString().slice(0, 7);
}
function monthDateToFull(m) {

}
function fullDateToMonth(d) {

}
function fmtMonthYear(m) {
  const [y, mo] = m.split("-").map(Number);
  return `${MESI[mo - 1].slice(0, 3)} ${String(y).slice(-2)}`;

function CapitalChart({ months, market, cost }) {
  const { hideAmounts } = usePrivacy();
  const width = 320, height = 220;
  const padding = { top: 14, right: 12, bottom: 26, left: 4 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  if (months.length < 2) {
    return (
      <div style={{ textAlign: "center", padding: "40px 10px", color: "#5B7B9B", fontSize: 13.5 }}>
        Servono almeno due mesi di dati per disegnare l'andamento.
      </div>
    );
  }

  const allValues = [...market, ...cost, 0];
  const maxV = Math.max(...allValues);
  const minV = Math.min(...allValues);
  const range = maxV - minV || 1;
  const xStep = innerW / (months.length - 1);
  const xFor = (i) => padding.left + i * xStep;
  const yFor = (v) => padding.top + innerH - ((v - minV) / range) * innerH;
  const pathFor = (series) => series.map((v, i) => `${i === 0 ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(v).toFixed(1)}`).join(" ");

  const labelEvery = Math.max(1, Math.ceil(months.length / 6));

  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", filter: hideAmounts ? "blur(6px)" : "none", transition: "filter 0.15s" }}>
        <line x1={padding.left} y1={yFor(0)} x2={width - padding.right} y2={yFor(0)} stroke="#EFF5FB" strokeWidth="1" />
        <path d={pathFor(cost)} fill="none" stroke="#B7C9DC" strokeWidth="2" />
        <path d={pathFor(market)} fill="none" stroke="#2F6FED" strokeWidth="2.5" />
        {months.map((m, i) => (
          <circle key={`c${m}`} cx={xFor(i)} cy={yFor(cost[i])} r="2" fill="#B7C9DC" />
        ))}
        {months.map((m, i) => (
          <circle key={`m${m}`} cx={xFor(i)} cy={yFor(market[i])} r="2.5" fill="#2F6FED" />
        ))}
        {months.map((m, i) => (
          i % labelEvery === 0 && (
            <text key={m} x={xFor(i)} y={height - 8} fontSize="9" fill="#5B7B9B" textAnchor="middle">{fmtMonthYear(m)}</text>
          )
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "center", gap: 20, marginTop: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#5B7B9B" }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#2F6FED" }} /> Valore di mercato
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#5B7B9B" }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#B7C9DC" }} /> Costo storico
        </div>
      </div>
    </div>
  );
}

function InvestApp({ session, onBack }) {
  const userId = session.user.id;
  const [portfolios, setPortfolios] = useState([]);
  const [holdings, setHoldings] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePortfolioId, setActivePortfolioId] = useState(null);
  const [activeHoldingId, setActiveHoldingId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());
  const [addingPortfolio, setAddingPortfolio] = useState(false);
  const [newPortfolioName, setNewPortfolioName] = useState("");
  const [newPortfolioIcon, setNewPortfolioIcon] = useState("Briefcase");
  const [portfolioError, setPortfolioError] = useState("");
  const [portfolioBusy, setPortfolioBusy] = useState(false);
  const [removalPortfolio, setRemovalPortfolio] = useState(null);
  const [editingPortfolioId, setEditingPortfolioId] = useState(null);
  const [editPortfolioName, setEditPortfolioName] = useState("");
  const [editPortfolioIcon, setEditPortfolioIcon] = useState("Briefcase");
  const [editPortfolioError, setEditPortfolioError] = useState("");
  const [editPortfolioBusy, setEditPortfolioBusy] = useState(false);

  const [addingHolding, setAddingHolding] = useState(false);
  const [newHoldingName, setNewHoldingName] = useState("");
  const [holdingError, setHoldingError] = useState("");
  const [holdingBusy, setHoldingBusy] = useState(false);
  const [removalHolding, setRemovalHolding] = useState(null);
  const [editingHoldingId, setEditingHoldingId] = useState(null);
  const [editHoldingName, setEditHoldingName] = useState("");
  const [editHoldingError, setEditHoldingError] = useState("");
  const [editHoldingBusy, setEditHoldingBusy] = useState(false);

  const [valForm, setValForm] = useState({ value_date: currentMonthISO(), market_value: "", cost_basis: "" });
  const [valError, setValError] = useState("");
  const [editingValId, setEditingValId] = useState(null);
  const [editValForm, setEditValForm] = useState({ value_date: "", market_value: "", cost_basis: "" });
  const [editValError, setEditValError] = useState("");
  const [removalValuation, setRemovalValuation] = useState(null);

  useEffect(() => {
    (async () => {
      const { data: pf, error: pfErr } = await supabase.from("investment_portfolios").select("*").order("created_at", { ascending: true });
      const { data: hd, error: hdErr } = await supabase.from("investment_holdings").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("investment_valuations").select("*").order("value_date", { ascending: false });
      setPortfolios(!pfErr && pf ? pf : []);
      setHoldings(!hdErr && hd ? hd : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);
  const prevCursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month - 1)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.holding_id];
      if (!cur || v.value_date > cur.value_date) map[v.holding_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);
  const valuationAsOfPrevCursor = useMemo(() => buildValuationMap(prevCursorFullDate), [valuations, prevCursorFullDate]);

  const holdingTotalsFromMap = (holdingId, map) => {
    const v = map[holdingId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const holdingTotals = (holdingId) => holdingTotalsFromMap(holdingId, valuationAsOfCursor);

  const portfolioTotalsFromMap = (portfolioId, map) => {
    const hs = holdings.filter((h) => h.portfolio_id === portfolioId);
    let marketValue = 0, gain = 0, costBasis = 0;
    hs.forEach((h) => {
      const t = holdingTotalsFromMap(h.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis, count: hs.length };
  };
  const portfolioTotals = (portfolioId) => portfolioTotalsFromMap(portfolioId, valuationAsOfCursor);
  const prevPortfolioTotals = (portfolioId) => portfolioTotalsFromMap(portfolioId, valuationAsOfPrevCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    portfolios.forEach((p) => {
      const t = portfolioTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [portfolios, holdings, valuations, valuationAsOfCursor]);
  const prevGrandTotal = useMemo(() => grandTotalFromMap(valuationAsOfPrevCursor), [portfolios, holdings, valuations, valuationAsOfPrevCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);
  const deltaVsPrev = (curT, prevT) => {
    const delta = curT.marketValue - prevT.marketValue;
    const pct = prevT.marketValue > 0 ? (delta / prevT.marketValue) * 100 : null;
    return { delta, pct };
  };
  const fmtPct = (p) => `${p > 0 ? "+" : ""}${p.toFixed(1)}%`;

  const [dashboardView, setDashboardView] = useState("list");

  const capitalSeries = useMemo(() => {
    if (valuations.length === 0) return { months: [], market: [], cost: [] };
    const monthKeys = valuations.map((v) => fullDateToMonth(v.value_date));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx));
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    const market = [], cost = [];
    months.forEach((mk) => {
      const map = buildValuationMap(monthDateToFull(mk));
      const t = grandTotalFromMap(map);
      market.push(t.marketValue);
      cost.push(t.costBasis);
    });
    return { months, market, cost };
  }, [valuations, portfolios, holdings]);

  const [chartRange, setChartRange] = useState("1Y");
  const RANGE_OPTIONS = ["3M", "6M", "YTD", "1Y", "5Y"];

  const chartSeries = useMemo(() => {
    const { months, market, cost } = capitalSeries;
    if (months.length === 0) return capitalSeries;
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const lastIdx = toIdx(months[months.length - 1]);
    const firstIdx = toIdx(months[0]);
    let wantedStartIdx;
    if (chartRange === "3M") wantedStartIdx = lastIdx - 2;
    else if (chartRange === "6M") wantedStartIdx = lastIdx - 5;
    else if (chartRange === "YTD") { const [y] = months[months.length - 1].split("-").map(Number); wantedStartIdx = y * 12; }
    else if (chartRange === "1Y") wantedStartIdx = lastIdx - 11;
    else wantedStartIdx = lastIdx - 59;
    const clampedStartIdx = Math.max(wantedStartIdx, firstIdx);
    const startPos = months.findIndex((mk) => toIdx(mk) >= clampedStartIdx);
    return { months: months.slice(startPos), market: market.slice(startPos), cost: cost.slice(startPos) };
  }, [capitalSeries, chartRange]);

  const chartStats = useMemo(() => {
    const { months, market } = chartSeries;
    if (months.length === 0) return null;
    const first = market[0];
    const last = market[market.length - 1];
    let maxV = market[0], maxM = months[0], minV = market[0], minM = months[0];
    market.forEach((v, i) => {
      if (v > maxV) { maxV = v; maxM = months[i]; }
      if (v < minV) { minV = v; minM = months[i]; }
    });
    const delta = last - first;
    const deltaPct = first > 0 ? (delta / first) * 100 : null;
    return { delta, deltaPct, maxV, maxM, minV, minM };
  }, [chartSeries]);

  const activePortfolio = portfolios.find((p) => p.id === activePortfolioId);
  const activeHolding = holdings.find((h) => h.id === activeHoldingId);
  const portfolioHoldings = useMemo(() => holdings.filter((h) => h.portfolio_id === activePortfolioId), [holdings, activePortfolioId]);
  const holdingValuations = useMemo(() => valuations.filter((v) => v.holding_id === activeHoldingId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activeHoldingId]);

  const openPortfolio = (p) => { setActivePortfolioId(p.id); setView("portfolio"); };
  const openHolding = (h) => { setActiveHoldingId(h.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("holding"); };

  const addPortfolio = async () => {
    if (portfolioBusy) return;
    const name = newPortfolioName.trim();
    if (!name) { setPortfolioError("Inserisci un nome."); return; }
    setPortfolioBusy(true);
    const { data, error: insErr } = await supabase.from("investment_portfolios").insert({ user_id: userId, name, icon_key: newPortfolioIcon }).select().single();
    setPortfolioBusy(false);
    if (insErr) { setPortfolioError(insErr.message); return; }
    setPortfolios((prev) => [...prev, data]);
    setNewPortfolioName(""); setNewPortfolioIcon("Briefcase"); setPortfolioError(""); setAddingPortfolio(false);
  };

  const openEditPortfolio = (p) => {
    setEditingPortfolioId(p.id);
    setEditPortfolioName(p.name);
    setEditPortfolioIcon(p.icon_key || "Briefcase");
    setEditPortfolioError("");
  };

  const saveEditPortfolio = async () => {
    if (editPortfolioBusy) return;
    const name = editPortfolioName.trim();
    if (!name) { setEditPortfolioError("Inserisci un nome."); return; }
    setEditPortfolioBusy(true);
    const { data, error: updErr } = await supabase.from("investment_portfolios").update({ name, icon_key: editPortfolioIcon }).eq("id", editingPortfolioId).select().single();
    setEditPortfolioBusy(false);
    if (updErr) { setEditPortfolioError(updErr.message); return; }
    setPortfolios((prev) => prev.map((p) => (p.id === editingPortfolioId ? data : p)));
    setEditingPortfolioId(null);
  };

  const deletePortfolio = async () => {
    const p = removalPortfolio;
    const { error: delErr } = await supabase.from("investment_portfolios").delete().eq("id", p.id);
    if (!delErr) {
      setPortfolios((prev) => prev.filter((x) => x.id !== p.id));
      const removedHoldingIds = holdings.filter((h) => h.portfolio_id === p.id).map((h) => h.id);
      setHoldings((prev) => prev.filter((h) => h.portfolio_id !== p.id));
      setValuations((prev) => prev.filter((v) => !removedHoldingIds.includes(v.holding_id)));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalPortfolio(null);
  };

  const addHolding = async () => {
    if (holdingBusy) return;
    const name = newHoldingName.trim();
    if (!name) { setHoldingError("Inserisci un nome."); return; }
    setHoldingBusy(true);
    const { data, error: insErr } = await supabase.from("investment_holdings").insert({ user_id: userId, portfolio_id: activePortfolioId, name }).select().single();
    setHoldingBusy(false);
    if (insErr) { setHoldingError(insErr.message); return; }
    setHoldings((prev) => [...prev, data]);
    setNewHoldingName(""); setHoldingError(""); setAddingHolding(false);
  };

  const openEditHolding = (h) => {
    setEditingHoldingId(h.id);
    setEditHoldingName(h.name);
    setEditHoldingError("");
  };

  const saveEditHolding = async () => {
    if (editHoldingBusy) return;
    const name = editHoldingName.trim();
    if (!name) { setEditHoldingError("Inserisci un nome."); return; }
    setEditHoldingBusy(true);
    const { data, error: updErr } = await supabase.from("investment_holdings").update({ name }).eq("id", editingHoldingId).select().single();
    setEditHoldingBusy(false);
    if (updErr) { setEditHoldingError(updErr.message); return; }
    setHoldings((prev) => prev.map((h) => (h.id === editingHoldingId ? data : h)));
    setEditingHoldingId(null);
  };

  const deleteHolding = async () => {
    const h = removalHolding;
    const { error: delErr } = await supabase.from("investment_holdings").delete().eq("id", h.id);
    if (!delErr) {
      setHoldings((prev) => prev.filter((x) => x.id !== h.id));
      setValuations((prev) => prev.filter((v) => v.holding_id !== h.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalHolding(null);
  };

  const addValuation = async (e) => {
    e.preventDefault();
    const mv = parseFloat(String(valForm.market_value).replace(",", "."));
    const cb = parseFloat(String(valForm.cost_basis).replace(",", "."));
    if (!valForm.value_date) { setValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setValError("Inserisci un valore di mercato valido."); return; }
    if (isNaN(cb) || cb < 0) { setValError("Inserisci un costo storico valido."); return; }
    const duplicate = valuations.some((v) => v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === valForm.value_date);
    if (duplicate) {
      const [dy, dm] = valForm.value_date.split("-").map(Number);
      setValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setValError("");
    const { data, error: insErr } = await supabase.from("investment_valuations").insert({ user_id: userId, holding_id: activeHoldingId, value_date: monthDateToFull(valForm.value_date), market_value: mv, cost_basis: cb }).select().single();
    if (insErr) { setValError(insErr.message); return; }
    setValuations((prev) => [{ ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) }, ...prev]);
    setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" });
  };

  const openEditValuation = (v) => {
    setEditingValId(v.id);
    setEditValForm({ value_date: fullDateToMonth(v.value_date), market_value: String(v.market_value).replace(".", ","), cost_basis: String(v.cost_basis).replace(".", ",") });
    setEditValError("");
  };

  const saveEditValuation = async () => {
    const mv = parseFloat(String(editValForm.market_value).replace(",", "."));
    const cb = parseFloat(String(editValForm.cost_basis).replace(",", "."));
    if (!editValForm.value_date) { setEditValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setEditValError("Inserisci un valore di mercato valido."); return; }
    if (isNaN(cb) || cb < 0) { setEditValError("Inserisci un costo storico valido."); return; }
    const duplicate = valuations.some((v) => v.id !== editingValId && v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === editValForm.value_date);
    if (duplicate) {
      const [dy, dm] = editValForm.value_date.split("-").map(Number);
      setEditValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setEditValError("");
    const { data, error: updErr } = await supabase.from("investment_valuations").update({ value_date: monthDateToFull(editValForm.value_date), market_value: mv, cost_basis: cb }).eq("id", editingValId).select().single();
    if (updErr) { setEditValError(updErr.message); return; }
    setValuations((prev) => prev.map((v) => (v.id === editingValId ? { ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) } : v)));
    setEditingValId(null);
  };

  const deleteValuation = async () => {
    const v = removalValuation;
    const { error: delErr } = await supabase.from("investment_valuations").delete().eq("id", v.id);
    if (!delErr) setValuations((prev) => prev.filter((x) => x.id !== v.id));
    else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalValuation(null);
  };

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid #DCE9F5", borderTopColor: "#2F6FED" }} />
        <div style={{ fontSize: 13.5, color: "#5B7B9B" }}>Sto caricando gli investimenti…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 48, background: "#2F6FED", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={() => {
          if (view === "holding") { setView("portfolio"); setEditingValId(null); }
          else if (view === "portfolio") { setView("home"); }
          else onBack();
        }} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
          <ArrowLeft size={20} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 14, fontWeight: 600, letterSpacing: "-0.01em" }}>
          {view === "home" ? "Portafoglio Investimenti" : view === "portfolio" ? (activePortfolio ? activePortfolio.name : "") : (activeHolding ? activeHolding.name : "")}
        </span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        {view === "home" ? (
          <>
            <div style={{ display: "flex", justifyContent: "center", padding: "4px 0 10px", flexShrink: 0 }}>
              <div style={{ display: "flex", background: "#F3F8FD", borderRadius: 10, padding: 3, width: "100%", maxWidth: 280 }}>
                <button onClick={() => setDashboardView("list")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: dashboardView === "list" ? "#FFFFFF" : "transparent", color: dashboardView === "list" ? "#0B2545" : "#5B7B9B", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "list" ? "0 1px 4px rgba(11,37,69,0.1)" : "none" }}>
                  Elenco
                </button>
                <button onClick={() => setDashboardView("chart")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: dashboardView === "chart" ? "#FFFFFF" : "transparent", color: dashboardView === "chart" ? "#0B2545" : "#5B7B9B", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: dashboardView === "chart" ? "0 1px 4px rgba(11,37,69,0.1)" : "none" }}>
                  Grafico
                </button>
              </div>
            </div>

            {dashboardView === "chart" ? (
              <div className="fade-in scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 4px" }}>
                <div style={{ textAlign: "center", marginBottom: 10 }}>
                  <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600 }}>Andamento del capitale</div>
                </div>
                <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
                  {RANGE_OPTIONS.map((r) => (
                    <button key={r} onClick={() => setChartRange(r)} style={{ padding: "6px 14px", borderRadius: 999, border: chartRange === r ? "1px solid #2F6FED" : "1px solid #DCE9F5", background: chartRange === r ? "#2F6FED" : "#FFFFFF", color: chartRange === r ? "#FFFFFF" : "#5B7B9B", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                      {r}
                    </button>
                  ))}
                </div>
                <CapitalChart months={chartSeries.months} market={chartSeries.market} cost={chartSeries.cost} />

                {chartStats && (
                  <div style={{ marginTop: 20, borderTop: "1px solid #DCE9F5", paddingTop: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px" }}>
                      <span style={{ fontSize: 13, color: "#5B7B9B" }}>Variazione nel periodo</span>
                      <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: chartStats.delta > 0 ? "#2F8F5B" : chartStats.delta < 0 ? "#B4483A" : "#5B7B9B" }}>
                        <Money>{chartStats.delta > 0 ? "+" : ""}{fmtEUR(chartStats.delta)}</Money>{chartStats.deltaPct !== null && ` (${fmtPct(chartStats.deltaPct)})`}
                      </span>
                    </div>

                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalPortfolio.name}"?</div>
                  <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Verranno eliminati anche tutti i titoli e i valori registrati al suo interno. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deletePortfolio(); setView("home"); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina portafoglio</button>
                  <button onClick={() => setRemovalPortfolio(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#F3F8FD", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}

            {removalHolding && (
              <>
                <div onClick={() => setRemovalHolding(null)} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalHolding.name}"?</div>
                  <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questo titolo. L'operazione non è reversibile.</div>
                  <button onClick={deleteHolding} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina titolo</button>
                  <button onClick={() => setRemovalHolding(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#F3F8FD", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        ) : (
          <>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 0" }}>
              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 10 }}>Aggiungi valore mensile</div>
              <form onSubmit={addValuation} style={{ padding: 12, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5", marginBottom: 20 }}>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Mese</div>
                    <input type="month" value={valForm.value_date} onChange={(e) => setValForm({ ...valForm, value_date: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, color: "#0B2545", background: "#FFFFFF" }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Valore di mercato</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.market_value} onChange={(e) => setValForm({ ...valForm, market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Costo storico</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.cost_basis} onChange={(e) => setValForm({ ...valForm, cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                </div>
                {valError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{valError}</div>}
                <button type="submit" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                  <Plus size={15} /> Aggiungi
                </button>
              </form>

              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Storico valori</div>
              {holdingValuations.length === 0 ? (
                <div style={{ fontSize: 13, color: "#B7C9DC", padding: "6px 4px" }}>Nessun valore ancora registrato.</div>
              ) : holdingValuations.map((v) => {
                const gain = v.market_value - v.cost_basis;
                const isEditing = editingValId === v.id;
                if (isEditing) {
                  return (
                    <div key={v.id} className="fade-in" style={{ padding: 12, background: "#F3F8FD", borderRadius: 10, border: "1px solid #DCE9F5", marginBottom: 10 }}>
                      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                        <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                          <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Mese</div>
                          <input type="month" value={editValForm.value_date} onChange={(e) => setEditValForm({ ...editValForm, value_date: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, color: "#0B2545", background: "#FFFFFF" }} />
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Valore di mercato</div>
                          <input type="text" inputMode="decimal" value={editValForm.market_value} onChange={(e) => setEditValForm({ ...editValForm, market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, background: "#FFFFFF" }} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 6 }}>Costo storico</div>
                          <input type="text" inputMode="decimal" value={editValForm.cost_basis} onChange={(e) => setEditValForm({ ...editValForm, cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #DCE9F5", fontSize: 15, background: "#FFFFFF" }} />
                        </div>
                      </div>
                      {editValError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{editValError}</div>}
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => setEditingValId(null)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#5B7B9B", fontSize: 13.5, cursor: "pointer" }}>Annulla</button>
                        <button onClick={() => setRemovalValuation(v)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid #EAC4BC", background: "#FFFFFF", color: "#B4483A", fontSize: 13.5, cursor: "pointer" }}>Elimina</button>
                        <button onClick={saveEditValuation} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", background: "#0B2545", color: "#FFFFFF", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Salva</button>
                      </div>
                    </div>
                  );
                }
                return (
                  <div key={v.id} onClick={() => openEditValuation(v)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 6px", borderBottom: "1px dotted #DCE9F5", cursor: "pointer" }}>
                    <div style={{ width: 54, fontSize: 13.5, color: "#5B7B9B", flexShrink: 0, textTransform: "capitalize", whiteSpace: "nowrap" }}>{fmtMonthYear(fullDateToMonth(v.value_date))}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="mono" style={{ fontSize: 16, fontWeight: 600 }}><Money>{fmtEUR(v.market_value)}</Money></div>
                      <div style={{ fontSize: 12, color: "#B7C9DC" }}>Costo: <Money>{fmtEUR(v.cost_basis)}</Money></div>
                    </div>
                    <div className="mono" style={{ fontSize: 14, fontWeight: 600, color: gain > 0 ? "#2F8F5B" : gain < 0 ? "#B4483A" : "#B7C9DC", flexShrink: 0 }}><Money>{gain > 0 ? "+" : ""}{fmtEUR(gain)}</Money></div>
                  </div>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => openEditHolding(activeHolding)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#0B2545", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                Modifica titolo
              </button>
              <button onClick={() => setRemovalHolding(activeHolding)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid #EAC4BC", background: "#FFFFFF", color: "#B4483A", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                <Trash2 size={14} /> Elimina
              </button>
            </div>

            {editingHoldingId && (
              <>
                <div onClick={() => setEditingHoldingId(null)} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Modifica titolo</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7B9B", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" value={editHoldingName} onChange={(e) => { setEditHoldingName(e.target.value); setEditHoldingError(""); }} autoFocus style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid #DCE9F5", fontSize: 16, marginBottom: 14 }} />
                  {editHoldingError && <div style={{ color: "#B4483A", fontSize: 13, marginBottom: 8 }}>{editHoldingError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setEditingHoldingId(null)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid #DCE9F5", background: "#FFFFFF", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={saveEditHolding} disabled={editHoldingBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: editHoldingBusy ? "#7D93A8" : "#0B2545", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: editHoldingBusy ? "default" : "pointer" }}>Salva</button>
                  </div>
                </div>
              </>
            )}

            {removalValuation && (
              <>
                <div onClick={() => setRemovalValuation(null)} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare questo valore?</div>
                  <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deleteValuation(); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                  <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#F3F8FD", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}

            {removalHolding && (
              <>
                <div onClick={() => setRemovalHolding(null)} style={{ position: "fixed", inset: 0, background: "rgba(11,37,69,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(11,37,69,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalHolding.name}"?</div>
                  <div style={{ fontSize: 13, color: "#5B7B9B", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questo titolo. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deleteHolding(); setView("portfolio"); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid #B4483A", background: "#FFFFFF", color: "#B4483A", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina titolo</button>
                  <button onClick={() => setRemovalHolding(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "#F3F8FD", color: "#5B7B9B", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
