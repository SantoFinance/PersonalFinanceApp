                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} className="btn-danger-outline">Sì, elimina</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  )}
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}


function buildCashflowChain(settings, entriesMap, yearCursor) {
  const result = {};
  if (!settings) return result;
  const keys = Object.keys(entriesMap);
  const openIdx = monthKeyToIdx(settings.monthKey);
  const todayIdx = (() => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); })();
  const lastEntryIdx = keys.length ? Math.max(...keys.map(monthKeyToIdx)) : openIdx;
  const endIdx = Math.max(lastEntryIdx, yearCursor * 12 + 11, todayIdx);
  let prevBalance = settings.balance;
  for (let i = openIdx + 1; i <= endIdx; i++) {
    const k = monthKeyFromIdx(i);
    const entry = entriesMap[k];
    if (!entry) {
      result[k] = { hasEntry: false, bankBalance: null };
      prevBalance = null;
      continue;
    }
    let bankBalance;
    if (entry.manual_override && entry.bank_balance !== null) {
      bankBalance = entry.bank_balance;
    } else if (prevBalance !== null) {
      bankBalance = prevBalance + entry.income - entry.investments - entry.expenses;
    } else {
      bankBalance = null;
    }
    result[k] = { hasEntry: true, income: entry.income, investments: entry.investments, expenses: entry.expenses, manualOverride: !!entry.manual_override, bankBalance };
    prevBalance = bankBalance;
  }
  return result;
}

function cashflowDerived(income, investments, expenses) {
  const netIncome = income - investments - expenses;
  const saving = income - expenses;
  const savingRate = income > 0 ? (saving / income) * 100 : null;
  return { netIncome, saving, savingRate };
}

function CashflowApp({ session, onBack }) {
  const userId = session.user.id;
  const [accounts, setAccounts] = useState([]);
  const [settingsRows, setSettingsRows] = useState([]);
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");
  const [activeAccountId, setActiveAccountId] = useState("all");
  const [viewMode, setViewMode] = useState("annual");
  const [displayStyle, setDisplayStyle] = useState("dashboard");
  const [acctMenuOpen, setAcctMenuOpen] = useState(false);
  const [viewMenuOpen, setViewMenuOpen] = useState(false);
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  const [yearCursor, setYearCursor] = useState(() => new Date().getFullYear());
  const [monthCursor, setMonthCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const goMonthCursor = (delta) => {
    setMonthCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      return { year: Math.floor(idx / 12), month: ((idx % 12) + 12) % 12 };
    });
  };

  const [addAccountStep, setAddAccountStep] = useState(null);
  const [pendingAccountId, setPendingAccountId] = useState(null);
  const [pendingAccountName, setPendingAccountName] = useState("");

  const [obBalance, setObBalance] = useState("");
  const [obMonth, setObMonth] = useState(currentMonthISO());
  const [obError, setObError] = useState("");
  const [obBusy, setObBusy] = useState(false);

  const [confirmEditOpening, setConfirmEditOpening] = useState(false);
  const [editingOpening, setEditingOpening] = useState(false);
  const [editOpBalance, setEditOpBalance] = useState("");
  const [editOpMonth, setEditOpMonth] = useState("");
  const [editOpError, setEditOpError] = useState("");
  const [editOpBusy, setEditOpBusy] = useState(false);

  const [editingMonthKey, setEditingMonthKey] = useState(null);
  const [rowForm, setRowForm] = useState({ income: "", investments: "", expenses: "" });
  const [rowMode, setRowMode] = useState("auto");
  const [manualValue, setManualValue] = useState("");
  const [rowError, setRowError] = useState("");
  const [rowBusy, setRowBusy] = useState(false);
  const [confirmOverride, setConfirmOverride] = useState(false);
  const [removalMonthKey, setRemovalMonthKey] = useState(null);
  const [cfCarryForward, setCfCarryForward] = useState(false);
  const [cfCarryUntil, setCfCarryUntil] = useState("");
  const [cfOverwriteExisting, setCfOverwriteExisting] = useState(false);
  const [cfOverwriteConfirm, setCfOverwriteConfirm] = useState(false);
  const [cfConflictCount, setCfConflictCount] = useState(0);

  useEffect(() => {
    (async () => {
      const { data: accs, error: accErr } = await supabase.from("cashflow_accounts").select("*").order("created_at", { ascending: true });
      const { data: st, error: stErr } = await supabase.from("cashflow_settings").select("*");
      const { data: en, error: enErr } = await supabase.from("cashflow_entries").select("*").order("value_date", { ascending: true });
      setAccounts(!accErr && accs ? accs : []);
      setSettingsRows(!stErr && st ? st.map((s) => ({ id: s.id, account_id: s.account_id, balance: Number(s.opening_balance), monthKey: fullDateToMonth(s.opening_date) })) : []);
      setEntries(!enErr && en ? en.map((e) => ({ ...e, income: Number(e.income), investments: Number(e.investments), expenses: Number(e.expenses), bank_balance: e.bank_balance === null ? null : Number(e.bank_balance) })) : []);
      setLoaded(true);
    })();
  }, []);

  const settingsByAccount = useMemo(() => {
    const m = {};
    settingsRows.forEach((s) => { m[s.account_id] = s; });
    return m;
  }, [settingsRows]);

  const entriesByAccount = useMemo(() => {
    const m = {};
    entries.forEach((e) => {
      if (!m[e.account_id]) m[e.account_id] = {};
      m[e.account_id][fullDateToMonth(e.value_date)] = e;
    });
    return m;
  }, [entries]);

  const chainsByAccount = useMemo(() => {
    const m = {};
    accounts.forEach((acc) => {
      const settings = settingsByAccount[acc.id];
      if (settings) m[acc.id] = buildCashflowChain(settings, entriesByAccount[acc.id] || {}, yearCursor);
    });
    return m;
  }, [accounts, settingsByAccount, entriesByAccount, yearCursor]);

  const settings = activeAccountId !== "all" ? settingsByAccount[activeAccountId] : null;
  const entriesMap = activeAccountId !== "all" ? (entriesByAccount[activeAccountId] || {}) : {};
  const chain = activeAccountId !== "all" ? (chainsByAccount[activeAccountId] || {}) : {};

  const getPrevBalance = (monthKey) => {
    if (!settings) return null;
    const idx = monthKeyToIdx(monthKey);
    const openIdx = monthKeyToIdx(settings.monthKey);
    if (idx - 1 === openIdx) return settings.balance;
    if (idx - 1 < openIdx) return null;
    const prevKey = monthKeyFromIdx(idx - 1);
    return chain[prevKey] ? (chain[prevKey].bankBalance ?? null) : null;
  };

  const computeMonthRow = (year, month) => {
    const key = `${year}-${String(month + 1).padStart(2, "0")}`;
    if (activeAccountId === "all") {
      let income = 0, investments = 0, expenses = 0, bankBalance = 0, hasEntry = false;
      accounts.forEach((acc) => {
        const c = chainsByAccount[acc.id];
        const r = c ? c[key] : null;
        if (r && r.hasEntry) {
          hasEntry = true;
          income += r.income; investments += r.investments; expenses += r.expenses;
          bankBalance += (r.bankBalance ?? 0);
        }
      });
      return { key, monthIdx: month, hasEntry, income, investments, expenses, bankBalance: hasEntry ? bankBalance : null, manualOverride: false, ...(hasEntry ? cashflowDerived(income, investments, expenses) : { netIncome: null, saving: null, savingRate: null }) };
    } else {
      const base = { key, monthIdx: month, hasEntry: false, bankBalance: null, ...(chain[key] || {}) };
      return { ...base, ...(base.hasEntry ? cashflowDerived(base.income, base.investments, base.expenses) : { netIncome: null, saving: null, savingRate: null }) };
    }
  };

  const yearRows = useMemo(() => {
    const rows = [];
    for (let m = 0; m < 12; m++) rows.push(computeMonthRow(yearCursor, m));
    return rows;
  }, [activeAccountId, chain, chainsByAccount, accounts, yearCursor]);

  const singleMonthRow = useMemo(() => computeMonthRow(monthCursor.year, monthCursor.month), [activeAccountId, chain, chainsByAccount, accounts, monthCursor]);

  const prevMonthRow = useMemo(() => {
    const idx = monthCursor.year * 12 + monthCursor.month - 1;
    return computeMonthRow(Math.floor(idx / 12), ((idx % 12) + 12) % 12);
  }, [activeAccountId, chain, chainsByAccount, accounts, monthCursor]);

  const pctChange = (curr, prev) => (prev !== 0 && prev !== null && prev !== undefined) ? ((curr - prev) / Math.abs(prev)) * 100 : null;

  const computeYearAgg = (year) => {
    let income = 0, investments = 0, expenses = 0, finalBalance = null, any = false;
    for (let m = 0; m < 12; m++) {
      const r = computeMonthRow(year, m);
      if (r.hasEntry) { any = true; income += r.income; investments += r.investments; expenses += r.expenses; }
      if (r.bankBalance !== null && r.bankBalance !== undefined) finalBalance = r.bankBalance;
    }
    const derived = cashflowDerived(income, investments, expenses);
    return { income, investments, expenses, finalBalance, hasData: any, ...derived };
  };

  const yearTotals = useMemo(() => computeYearAgg(yearCursor), [activeAccountId, chain, chainsByAccount, accounts, yearCursor]);
  const prevYearTotals = useMemo(() => computeYearAgg(yearCursor - 1), [activeAccountId, chain, chainsByAccount, accounts, yearCursor]);
  const computeYtdAgg = (year, endMonth) => {
    let income = 0, investments = 0, expenses = 0, finalBalance = null, any = false;
    const rows = [];
    for (let m = 0; m <= endMonth; m++) {
      const r = computeMonthRow(year, m);
      rows.push(r);
      if (r.hasEntry) { any = true; income += r.income; investments += r.investments; expenses += r.expenses; }
      if (r.bankBalance !== null && r.bankBalance !== undefined) finalBalance = r.bankBalance;
    }
    const derived = cashflowDerived(income, investments, expenses);
    return { rows, income, investments, expenses, finalBalance, hasData: any, ...derived };
  };
  const ytdTotals = useMemo(() => computeYtdAgg(monthCursor.year, monthCursor.month), [activeAccountId, chain, chainsByAccount, accounts, monthCursor]);
  const prevYtdTotals = useMemo(() => computeYtdAgg(monthCursor.year - 1, monthCursor.month), [activeAccountId, chain, chainsByAccount, accounts, monthCursor]);
  const summaryYear = viewMode === "ytd" ? monthCursor.year : yearCursor;
  const summaryRows = viewMode === "ytd" ? ytdTotals.rows : yearRows;
  const summaryTotals = viewMode === "ytd" ? ytdTotals : yearTotals;
  const prevSummaryTotals = viewMode === "ytd" ? prevYtdTotals : prevYearTotals;
  const summaryPeriodLabel = viewMode === "ytd" ? `Gen–${MESI[monthCursor.month].slice(0, 3)} ${String(monthCursor.year).slice(-2)}` : String(yearCursor);
  const summaryComparisonLabel = viewMode === "ytd" ? `Gen–${MESI[monthCursor.month].slice(0, 3)} ${String(monthCursor.year - 1).slice(-2)}` : String(yearCursor - 1);

  const openingYear = settings ? Number(settings.monthKey.split("-")[0]) : null;
  const infoYear = viewMode === "ytd" ? monthCursor.year : yearCursor;
  let openingInfo = null;
  if (activeAccountId !== "all" && settings) {
    if (infoYear === openingYear) {
      openingInfo = { key: settings.monthKey, value: settings.balance, isOpening: true, missing: false };
    } else if (infoYear > openingYear) {
      const prevDecKey = `${infoYear - 1}-12`;
      const val = prevDecKey === settings.monthKey ? settings.balance : (chain[prevDecKey] ? (chain[prevDecKey].bankBalance ?? null) : null);
      openingInfo = { key: prevDecKey, value: val, isOpening: false, missing: val === null };
    }
  }

  const saveOnboarding = async () => {
    if (obBusy) return;
    const bal = parseFloat(String(obBalance).replace(",", "."));
    if (!obMonth) { setObError("Seleziona un mese."); return; }
    if (isNaN(bal)) { setObError("Inserisci un saldo valido."); return; }
    setObBusy(true);
    const { data, error: insErr } = await supabase.from("cashflow_settings").insert({ user_id: userId, account_id: pendingAccountId, opening_balance: bal, opening_date: monthDateToFull(obMonth) }).select().single();
    setObBusy(false);
    if (insErr) { setObError(insErr.message); return; }
    setSettingsRows((prev) => [...prev, { id: data.id, account_id: data.account_id, balance: Number(data.opening_balance), monthKey: fullDateToMonth(data.opening_date) }]);
    setActiveAccountId(pendingAccountId);
    setAddAccountStep(null);
    setPendingAccountId(null);
  };

  const openEditOpening = () => {
    setEditOpBalance(String(settings.balance).replace(".", ","));
    setEditOpMonth(settings.monthKey);
    setEditOpError("");
    setEditingOpening(true);
  };

  const saveEditOpening = async () => {
    if (editOpBusy) return;
    const bal = parseFloat(String(editOpBalance).replace(",", "."));
    if (!editOpMonth) { setEditOpError("Seleziona un mese."); return; }
    if (isNaN(bal)) { setEditOpError("Inserisci un saldo valido."); return; }
    setEditOpBusy(true);
    const { data, error: updErr } = await supabase.from("cashflow_settings").update({ opening_balance: bal, opening_date: monthDateToFull(editOpMonth) }).eq("id", settings.id).select().single();
    setEditOpBusy(false);
    if (updErr) { setEditOpError(updErr.message); return; }
    setSettingsRows((prev) => prev.map((s) => (s.id === settings.id ? { id: data.id, account_id: data.account_id, balance: Number(data.opening_balance), monthKey: fullDateToMonth(data.opening_date) } : s)));
    setEditingOpening(false);
  };

  const openRow = (monthIdx, yearOverride) => {
    const year = yearOverride !== undefined ? yearOverride : yearCursor;
    if (activeAccountId === "all" || !settings) return;
    const key = `${year}-${String(monthIdx + 1).padStart(2, "0")}`;
    const idx = year * 12 + monthIdx;
    const openIdx = monthKeyToIdx(settings.monthKey);
    if (idx <= openIdx) return;
    const entry = entriesMap[key];
    setEditingMonthKey(key);
    setRowForm({
      income: entry ? String(entry.income).replace(".", ",") : "",
      investments: entry ? String(entry.investments).replace(".", ",") : "",
      expenses: entry ? String(entry.expenses).replace(".", ",") : "",
    });
    const prevBal = getPrevBalance(key);
    if (entry && entry.manual_override) {
      setRowMode("manual");
      setManualValue(entry.bank_balance != null ? String(entry.bank_balance).replace(".", ",") : "");
    } else if (prevBal !== null) {
      setRowMode("auto");
      setManualValue("");
    } else {
      setRowMode("manual");
      setManualValue("");
    }
    setRowError("");
    setConfirmOverride(false);
    setCfCarryForward(false);
    setCfCarryUntil("");
    setCfOverwriteExisting(false);
    setCfOverwriteConfirm(false);
  };

  const prevBalanceForEditing = editingMonthKey ? getPrevBalance(editingMonthKey) : null;
  const incomeNum = parseFloat(String(rowForm.income).replace(",", ".")) || 0;
  const investmentsNum = parseFloat(String(rowForm.investments).replace(",", ".")) || 0;
  const expensesNum = parseFloat(String(rowForm.expenses).replace(",", ".")) || 0;
  const liveComputed = prevBalanceForEditing !== null ? prevBalanceForEditing + incomeNum - investmentsNum - expensesNum : null;

  const requestManualOverride = () => setConfirmOverride(true);
  const confirmManualOverride = () => {
    setManualValue(liveComputed !== null ? String(liveComputed.toFixed(2)).replace(".", ",") : "");
    setRowMode("manual");
    setConfirmOverride(false);
  };
  const revertToAuto = () => { setRowMode("auto"); setManualValue(""); };

  const saveRow = async () => {
    if (rowBusy) return;
    let manual_override = false;
    let bank_balance = null;
    if (!cfCarryForward && rowMode === "manual") {
      const mv = parseFloat(String(manualValue).replace(",", "."));
      if (isNaN(mv)) { setRowError("Inserisci un saldo valido."); return; }
      manual_override = true;
      bank_balance = mv;
    }
    if (cfCarryForward) {
      if (!cfCarryUntil) { setRowError("Seleziona fino a quale mese portare avanti i valori."); return; }
      if (monthKeyToIdx(cfCarryUntil) < monthKeyToIdx(editingMonthKey)) { setRowError("Il mese finale deve essere uguale o successivo al mese corrente."); return; }
      const startIdx = monthKeyToIdx(editingMonthKey);
      const endIdx = monthKeyToIdx(cfCarryUntil);
      const targetKeys = [];
      for (let idx = startIdx; idx <= endIdx; idx++) targetKeys.push(monthKeyFromIdx(idx));
      const conflictKeys = targetKeys.filter((mk) => mk !== editingMonthKey && entriesMap[mk]);
      if (conflictKeys.length > 0 && !cfOverwriteExisting) {
        setRowError(`${conflictKeys.length} ${conflictKeys.length === 1 ? "mese ha già dei valori inseriti" : "mesi hanno già dei valori inseriti"}. Attiva "Sovrascrivi mesi che hanno già dei valori" per procedere, oppure riduci l'intervallo.`);
        return;
      }
      if (conflictKeys.length > 0 && cfOverwriteExisting && !cfOverwriteConfirm) {
        setCfConflictCount(conflictKeys.length);
        setCfOverwriteConfirm(true);
        return;
      }
      setRowError("");
      setRowBusy(true);
      const results = await Promise.all(targetKeys.map((mk) => {
        const ex = entriesMap[mk];
        const p = { user_id: userId, account_id: activeAccountId, value_date: monthDateToFull(mk), income: incomeNum, investments: investmentsNum, expenses: expensesNum, manual_override: false, bank_balance: null };
        return ex ? supabase.from("cashflow_entries").update(p).eq("id", ex.id).select().single() : supabase.from("cashflow_entries").insert(p).select().single();
      }));
      setRowBusy(false);
      const failed = results.find((r) => r.error);
      if (failed) { setRowError(failed.error.message); return; }
      const normalized = results.map((r) => ({ ...r.data, income: Number(r.data.income), investments: Number(r.data.investments), expenses: Number(r.data.expenses), bank_balance: r.data.bank_balance === null ? null : Number(r.data.bank_balance) }));
      setEntries((prev) => {
        const byId = new Map(prev.map((e) => [e.id, e]));
        normalized.forEach((n) => byId.set(n.id, n));
        return Array.from(byId.values());
      });
      setEditingMonthKey(null);
      setCfOverwriteConfirm(false);
      return;
    }
    setRowBusy(true);
    const existing = entriesMap[editingMonthKey];
    const payload = { user_id: userId, account_id: activeAccountId, value_date: monthDateToFull(editingMonthKey), income: incomeNum, investments: investmentsNum, expenses: expensesNum, manual_override, bank_balance };
    let error, data;
    if (existing) {
      const res = await supabase.from("cashflow_entries").update(payload).eq("id", existing.id).select().single();
      error = res.error; data = res.data;
    } else {
      const res = await supabase.from("cashflow_entries").insert(payload).select().single();
      error = res.error; data = res.data;
    }
    setRowBusy(false);
    if (error) { setRowError(error.message); return; }
    const normalized = { ...data, income: Number(data.income), investments: Number(data.investments), expenses: Number(data.expenses), bank_balance: data.bank_balance === null ? null : Number(data.bank_balance) };
    setEntries((prev) => existing ? prev.map((e) => (e.id === existing.id ? normalized : e)) : [...prev, normalized]);
    setEditingMonthKey(null);
  };

  const deleteRow = async () => {
    const key = removalMonthKey;
    const existing = entriesMap[key];
    if (!existing) { setRemovalMonthKey(null); return; }
    const { error: delErr } = await supabase.from("cashflow_entries").delete().eq("id", existing.id);
    if (!delErr) setEntries((prev) => prev.filter((e) => e.id !== existing.id));
    else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalMonthKey(null);
    setEditingMonthKey(null);
  };

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando i flussi di cassa…</div>
      </div>
    );
  }

  const todayIdx = (() => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); })();

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={onBack} aria-label="Torna indietro" className="btn-icon" style={{ padding: 8, color: "#FFFFFF" }}>
          <ArrowLeft size={22} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>Flussi di cassa</span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 16px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1, boxSizing: "border-box" }}>
        {accounts.length === 0 ? (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "20px 10px" }}>
            <ArrowLeftRight size={38} color="var(--color-border-light)" style={{ marginBottom: 14 }} />
            <div className="text-lg" style={{ color: "var(--color-heading)", marginBottom: 6 }}>Crea il tuo primo conto</div>
            <div style={{ fontSize: 13.5, color: "var(--color-primary)", marginBottom: 18, maxWidth: 280 }}>I conti si creano da Profilo → Gestione conti, e vengono usati sia qui che in Le mie spese.</div>
            <button onClick={onBack} className="btn-primary" style={{ padding: "11px 22px", borderRadius: "var(--radius-sm)", fontSize: 14 }}>
              Torna alla home
            </button>
          </div>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexShrink: 0 }}>
              <div style={{ position: "relative", flexShrink: 0 }}>
                <button onClick={() => setViewMenuOpen((v) => !v)} style={{ display: "flex", alignItems: "center", gap: 3, padding: "6px 10px", borderRadius: "var(--radius-pill)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {viewMode === "monthly" ? "Mensile" : viewMode === "ytd" ? "Year to Date" : "Annuale"} <ChevronDown size={13} />
                </button>
                {viewMenuOpen && (
                  <>
                    <div onClick={() => setViewMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 39 }} />

            <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16, lineHeight: 1.5 }}>È il punto di partenza di tutta la serie: cambiandolo, tutti i saldi calcolati automaticamente dopo questo mese verranno ricalcolati.</div>
            <button onClick={() => { setConfirmEditOpening(false); openEditOpening(); }} className="text-sm" style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "1px solid var(--color-warning-border)", background: "var(--color-warning-bg)", color: "var(--color-warning)", cursor: "pointer", marginBottom: 8 }}>Sì, continua</button>
            <button onClick={() => setConfirmEditOpening(false)} style={{ width: "100%", padding: "11px 0", borderRadius: "var(--radius-sm)", border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
          </div>
        </>
      )}

      {editingOpening && (
        <>
          <div onClick={() => setEditingOpening(false)} className="modal-overlay" style={{ zIndex: 41 }} />
          <div className="fade-in modal-panel" style={{ zIndex: 42 }}>
            <div className="text-md" style={{ marginBottom: 14 }}>Modifica saldo di apertura</div>
            <div className="section-label" style={{ marginBottom: 6 }}>Mese di riferimento</div>
            <input type="month" value={editOpMonth} onChange={(e) => setEditOpMonth(e.target.value)} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "10px 12px", borderRadius: "var(--radius-ms)", border: "1px solid var(--color-border)", fontSize: 15, marginBottom: 14, background: "#FFFFFF" }} />
            <div className="section-label" style={{ marginBottom: 6 }}>Saldo a fine mese</div>
            <input type="text" inputMode="decimal" value={editOpBalance} onChange={(e) => { setEditOpBalance(e.target.value); setEditOpError(""); }} className="mono input-field-lg" />
            {editOpError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editOpError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setEditingOpening(false)} className="btn-outline" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", fontSize: 14 }}>Annulla</button>
              <button onClick={saveEditOpening} disabled={editOpBusy} className="text-sm" style={{ flex: 1, padding: "10px 0", borderRadius: "var(--radius-sm)", border: "none", background: editOpBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", cursor: editOpBusy ? "default" : "pointer" }}>Salva</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
