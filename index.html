                          {m.slice(0, 3)}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </>
          )}
        </div>

        <div key={`${cursor.year}-${cursor.month}`} className="fade-in" style={{ textAlign: "center", padding: "4px 0 14px", borderBottom: "1px solid var(--color-border)", flexShrink: 0 }}>
          <div className="mono" style={{ fontSize: 32, fontWeight: 600, letterSpacing: "-0.01em", color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal)}</Money></div>
        </div>
          </>
        )}

        {dashboardView === "chart" ? (
          <StatsSection
            items={netWorthItems}
            getName={(it) => it.name}
            getIcon={(it) => it.icon}
            buildMapAsOf={buildNetWorthMapAsOf}
            getTotalsFromMap={netWorthGetTotalsFromMap}
            historyMonths={historyMonths}
            cursorFullDate={cursorFullDate}
            chartTitle="Andamento del patrimonio"
            compositionTitle="Composizione patrimonio"
            biggestLabel="Categoria più grande"
            growthLabel="In maggior crescita"
            hideContributionsStat={true}
            hidePerformanceBox={true}
            emptyMessage=""
          />
        ) : dashboardView === "balance" ? (
          <div className="scrollbar-thin" style={{ flex: "1 1 auto", minHeight: 0, overflowY: "auto", padding: "10px 2px" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 10 }}>Attivi</div>
            {[
              { label: "Liquidità", value: cashflowTotal },
              { label: "Investimenti", value: investTotal },
              { label: "Immobili", value: realEstateTotal },
              { label: "Assicurazioni e Previdenza", value: insuranceTotal },
            ].map((r) => (
              <div key={r.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderBottom: "1px dotted var(--color-border)" }}>
                <span style={{ fontSize: 14.5, color: "var(--color-heading)" }}>{r.label}</span>
                <span className="mono" style={{ fontSize: 14.5, fontWeight: 600, color: "var(--color-heading)" }}><Money>{fmtEUR(r.value)}</Money></span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", marginTop: 2 }}>
              <span style={{ fontSize: 14.5, fontWeight: 700, color: "var(--color-heading)" }}>Totale Attivi</span>
              <span className="mono" style={{ fontSize: 15.5, fontWeight: 700, color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal)}</Money></span>
            </div>

            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, margin: "22px 0 10px" }}>Passività</div>
            {[
              { label: "Mutuo", value: 0 },
              { label: "Finanziamenti", value: 0 },
              { label: "Debiti personali", value: 0 },
            ].map((r) => (
              <div key={r.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderBottom: "1px dotted var(--color-border)" }}>
                <span style={{ fontSize: 14.5, color: "var(--color-heading)" }}>{r.label}</span>
                <span className="mono" style={{ fontSize: 14.5, fontWeight: 600, color: "var(--color-border-light)" }}><Money>{fmtEUR(r.value)}</Money></span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", marginTop: 2 }}>
              <span style={{ fontSize: 14.5, fontWeight: 700, color: "var(--color-heading)" }}>Totale Passività</span>
              <span className="mono" style={{ fontSize: 15.5, fontWeight: 700, color: "var(--color-heading)" }}><Money>{fmtEUR(0)}</Money></span>
            </div>

            <div style={{ marginTop: 22, padding: "16px 14px", borderRadius: 12, background: "var(--color-bg-tint)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 14.5, fontWeight: 700, color: "var(--color-heading)" }}>Patrimonio netto</span>
              <span className="mono" style={{ fontSize: 19, fontWeight: 700, color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal - 0)}</Money></span>
            </div>
          </div>
        ) : (
        <div className="scrollbar-thin" style={{ flex: "1 1 auto", minHeight: 0, overflowY: "auto", padding: "10px 0" }}>
          {rows.map((r) => {
            const Icon = r.icon;
            const weightPct = grandTotal !== 0 ? (r.value / grandTotal) * 100 : 0;
            return (
              <div key={r.key} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 6px" }}>
                <div style={{ width: 38, height: 38, borderRadius: 9, background: "var(--color-bg-tint)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon size={17} color="var(--color-primary)" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                    <span style={{ fontSize: 15, fontWeight: 500 }}>{r.label}</span>
                    <span className="mono" style={{ fontSize: 15, fontWeight: 600, flexShrink: 0, marginLeft: 8 }}><Money>{fmtEUR(r.value)}</Money></span>
                  </div>
                  <div style={{ height: 4, background: "var(--color-bg-tint)", borderRadius: 2, overflow: "hidden", marginBottom: 3 }}>
                    <div className="bar-fill" style={{ height: "100%", width: `${Math.max(0, Math.min(100, weightPct))}%`, background: "var(--color-primary)", borderRadius: 2 }} />
                  </div>
                  <span style={{ fontSize: 12, color: "var(--color-border-light)" }}>{weightPct.toFixed(0)}% del totale</span>
                </div>
              </div>
            );
          })}
        </div>
        )}
      </div>
    </div>
  );
}

function StatsSection({
  items, getName, getIcon,
  buildMapAsOf, getTotalsFromMap,
  historyMonths, cursorFullDate,
  chartTitle, compositionTitle,
  biggestLabel, performantLabel, growthLabel,
  hideContributionsStat, hidePerformanceBox,
  emptyMessage,
}) {
  const futureFromMonth = currentMonthISO();
  const [chartRange, setChartRange] = useState("1Y");
  const [statsExpanded, setStatsExpanded] = useState(true);
  const [compositionExpanded, setCompositionExpanded] = useState(true);
  const [chartExpanded, setChartExpanded] = useState(true);
  const RANGE_OPTIONS = ["3M", "6M", "YTD", "1Y", "2Y", "3Y", "5Y"];

  const capitalSeries = useMemo(() => {
    if (historyMonths.length === 0) return { months: [], market: [], cost: [] };
    const market = [], cost = [];
    historyMonths.forEach((mk) => {
      const map = buildMapAsOf(monthDateToFull(mk));
      let mv = 0, cb = 0;
      items.forEach((it) => { const t = getTotalsFromMap(it, map); mv += t.marketValue; cb += t.costBasis; });
      market.push(mv); cost.push(cb);
    });
    return { months: historyMonths, market, cost };
  }, [historyMonths, items]);

  const SHORT_RANGES = ["3M", "6M", "YTD"];
  const chartSeries = useMemo(() => {
    const { months, market, cost } = capitalSeries;
    if (months.length === 0) return capitalSeries;
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const today = currentMonthISO();
    const isShort = SHORT_RANGES.includes(chartRange);
    let endPos = months.length - 1;
    if (isShort) {
      const futurePos = months.findIndex((mk) => mk > today);
      if (futurePos !== -1) endPos = Math.max(0, futurePos - 1);
    }
    const lastIdx = toIdx(months[endPos]);
    const firstIdx = toIdx(months[0]);
    let wantedStartIdx;
    if (chartRange === "3M") wantedStartIdx = lastIdx - 2;
    else if (chartRange === "6M") wantedStartIdx = lastIdx - 5;
    else if (chartRange === "YTD") { const [y] = months[endPos].split("-").map(Number); wantedStartIdx = y * 12; }
    else if (chartRange === "1Y") wantedStartIdx = lastIdx - 11;
    else if (chartRange === "2Y") wantedStartIdx = lastIdx - 23;
    else if (chartRange === "3Y") wantedStartIdx = lastIdx - 35;
    else wantedStartIdx = lastIdx - 59;
    const clampedStartIdx = Math.max(wantedStartIdx, firstIdx);
    const startPos = months.findIndex((mk) => toIdx(mk) >= clampedStartIdx);
    return { months: months.slice(startPos, endPos + 1), market: market.slice(startPos, endPos + 1), cost: cost.slice(startPos, endPos + 1) };
  }, [capitalSeries, chartRange]);

  const chartStats = useMemo(() => {
    const { months, market, cost } = chartSeries;
    if (months.length === 0) return null;
    const first = market[0];
    const last = market[market.length - 1];
    let maxV = market[0], maxM = months[0], minV = market[0], minM = months[0];
    market.forEach((v, i) => {
      if (v > maxV) { maxV = v; maxM = months[i]; }
      if (v < minV) { minV = v; minM = months[i]; }
    });
    const delta = last - first;
    const deltaPct = first > 0 ? (delta / first) * 100 : null;
    const contributions = cost[cost.length - 1] - cost[0];
    return { delta, deltaPct, maxV, maxM, minV, minM, contributions };
  }, [chartSeries]);

  const mapAtCursor = useMemo(() => buildMapAsOf(cursorFullDate), [cursorFullDate]);
  const itemTotalsAtCursor = (item) => getTotalsFromMap(item, mapAtCursor);
  const grandTotalAtCursor = useMemo(() => {
    let marketValue = 0;
    items.forEach((it) => { marketValue += itemTotalsAtCursor(it).marketValue; });
    return marketValue;
  }, [items, mapAtCursor]);
  const costAtCursor = useMemo(() => {
    let costBasis = 0;
    items.forEach((it) => { costBasis += itemTotalsAtCursor(it).costBasis; });
    return costBasis;
  }, [items, mapAtCursor]);
  const gainAtCursor = grandTotalAtCursor - costAtCursor;
  const gainPctAtCursor = costAtCursor > 0 ? (gainAtCursor / costAtCursor) * 100 : null;

  const returnPctLocal = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);
  const fmtPctLocal = (p) => `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;

  return (
    <div className="fade-in scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", overflowX: "hidden", padding: "10px 4px", width: "100%", boxSizing: "border-box" }}>
      <div onClick={() => setChartExpanded((v) => !v)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", marginBottom: chartExpanded ? 10 : 0 }}>
        <div style={{ width: 24 }} />
        <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, textAlign: "center" }}>{chartTitle}</div>
        <button aria-label={chartExpanded ? "Comprimi grafico" : "Espandi grafico"} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--color-primary)", display: "flex", transform: chartExpanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>
          <ChevronDown size={18} />
        </button>
      </div>
      {chartExpanded && (
        <div className="fade-in" style={{ background: "var(--color-bg-tint)", border: "1px solid var(--color-border)", borderRadius: 14, padding: "16px 8px" }}>
          <div style={{ textAlign: "center", marginBottom: 14 }}>
            <div className="mono" style={{ fontSize: 30, fontWeight: 600, letterSpacing: "-0.01em", color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotalAtCursor)}</Money></div>
            <div className="mono" style={{ fontSize: 13.5, fontWeight: 600, marginTop: 2, color: gainAtCursor > 0 ? "var(--color-success)" : gainAtCursor < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
              <Money>{gainAtCursor > 0 ? "+" : ""}{fmtEUR(gainAtCursor)}</Money>{gainPctAtCursor !== null && ` (${fmtPctLocal(gainPctAtCursor)})`}
            </div>
          </div>
          <div className="no-scrollbar" style={{ display: "flex", justifyContent: "center", gap: 4, marginBottom: 14, flexWrap: "nowrap", overflowX: "auto", paddingBottom: 2 }}>
            {RANGE_OPTIONS.map((r) => (
              <button key={r} onClick={() => setChartRange(r)} style={{ padding: "5px 9px", borderRadius: 999, border: chartRange === r ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: chartRange === r ? "var(--color-primary)" : "#FFFFFF", color: chartRange === r ? "#FFFFFF" : "var(--color-primary)", fontSize: 11.5, fontWeight: 600, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap" }}>
                {r}
              </button>
            ))}
          </div>
          <CapitalChart months={chartSeries.months} market={chartSeries.market} cost={chartSeries.cost} futureFromMonth={SHORT_RANGES.includes(chartRange) ? null : futureFromMonth} />
        </div>
      )}

      {chartStats && (
        <div style={{ marginTop: 20, borderTop: "1px solid var(--color-border)", paddingTop: 16 }}>
          <div onClick={() => setStatsExpanded((v) => !v)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", marginBottom: statsExpanded ? 14 : 0 }}>
            <div style={{ width: 24 }} />
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, textAlign: "center" }}>Statistiche</div>
            <button aria-label={statsExpanded ? "Comprimi statistiche" : "Espandi statistiche"} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--color-primary)", display: "flex", transform: statsExpanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>
              <ChevronDown size={18} />
            </button>
          </div>
          {statsExpanded && (
            <div className="fade-in">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px" }}>
                <span style={{ fontSize: 13, color: "var(--color-primary)" }}>Variazione nel periodo</span>
                <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: chartStats.delta > 0 ? "var(--color-success)" : chartStats.delta < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
                  <Money>{chartStats.delta > 0 ? "+" : ""}{fmtEUR(chartStats.delta)}</Money>{chartStats.deltaPct !== null && ` (${fmtPctLocal(chartStats.deltaPct)})`}
                </span>
              </div>
              {!hideContributionsStat && (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px dotted var(--color-border)" }}>
                  <span style={{ fontSize: 13, color: "var(--color-primary)" }}>Contributi periodo</span>
                  <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: chartStats.contributions > 0 ? "var(--color-success)" : chartStats.contributions < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
                    <Money>{chartStats.contributions > 0 ? "+" : ""}{fmtEUR(chartStats.contributions)}</Money>
                  </span>
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px dotted var(--color-border)" }}>
                <span style={{ fontSize: 13, color: "var(--color-primary)" }}>Max ({fmtMonthYear(chartStats.maxM)})</span>
                <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)" }}><Money>{fmtEUR(chartStats.maxV)}</Money></span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px dotted var(--color-border)" }}>
                <span style={{ fontSize: 13, color: "var(--color-primary)" }}>Min ({fmtMonthYear(chartStats.minM)})</span>
                <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)" }}><Money>{fmtEUR(chartStats.minV)}</Money></span>
              </div>
            </div>
          )}
        </div>
      )}

      {items.length > 0 ? (
        <div style={{ marginTop: 20, borderTop: "1px solid var(--color-border)", paddingTop: 16 }}>
          <div onClick={() => setCompositionExpanded((v) => !v)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", marginBottom: compositionExpanded ? 14 : 0 }}>
            <div style={{ width: 24 }} />
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, textAlign: "center" }}>{compositionTitle}</div>
            <button aria-label={compositionExpanded ? "Comprimi composizione" : "Espandi composizione"} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--color-primary)", display: "flex", transform: compositionExpanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>
              <ChevronDown size={18} />
            </button>
          </div>
          {compositionExpanded && (
            <div className="fade-in">
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 20, flexWrap: "wrap", width: "100%", maxWidth: "100%", boxSizing: "border-box" }}>
                <div style={{ flexShrink: 0 }}>
                  <PortfolioPieChart portfolios={items} getPct={(it) => grandTotalAtCursor > 0 ? (itemTotalsAtCursor(it).marketValue / grandTotalAtCursor) * 100 : 0} />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, flex: "1 1 140px", minWidth: 0, maxWidth: "100%" }}>
                  {items.map((it, i) => {
                    const pct = grandTotalAtCursor > 0 ? (itemTotalsAtCursor(it).marketValue / grandTotalAtCursor) * 100 : 0;
                    return (
                      <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, minWidth: 0 }}>
                        <div style={{ width: 10, height: 10, borderRadius: "50%", background: PIE_COLORS[i % PIE_COLORS.length], flexShrink: 0 }} />
                        <span style={{ color: "var(--color-heading)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, minWidth: 0 }}>{getName(it)}</span>
                        <span className="mono" style={{ color: "var(--color-primary)", fontWeight: 600, flexShrink: 0 }}>{pct.toFixed(0)}%</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {(() => {
                if (items.length === 0) return null;
                const biggest = items.reduce((best, it) => (itemTotalsAtCursor(it).marketValue > itemTotalsAtCursor(best).marketValue ? it : best), items[0]);
                const t = itemTotalsAtCursor(biggest);
                const pct = grandTotalAtCursor > 0 ? (t.marketValue / grandTotalAtCursor) * 100 : 0;
                const BIcon = getIcon(biggest);
                return (
                  <div style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, background: "var(--color-bg-tint)" }}>
                    <div style={{ width: 36, height: 36, borderRadius: 9, background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <BIcon size={16} color="var(--color-primary)" />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 11, color: "var(--color-primary)" }}>{biggestLabel}</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{getName(biggest)}</div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)" }}><Money>{fmtEUR(t.marketValue)}</Money></div>
                      <div className="mono" style={{ fontSize: 12, color: "var(--color-primary)" }}>{pct.toFixed(0)}% del totale</div>
                    </div>
                  </div>
                );
              })()}

              {!hidePerformanceBox && (() => {
                const candidates = items.filter((it) => returnPctLocal(itemTotalsAtCursor(it)) !== null);
                if (candidates.length === 0) return null;
                const best = candidates.reduce((a, b) => (returnPctLocal(itemTotalsAtCursor(b)) > returnPctLocal(itemTotalsAtCursor(a)) ? b : a));
                const pct = returnPctLocal(itemTotalsAtCursor(best));
                const BIcon = getIcon(best);
                return (
                  <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, background: "var(--color-bg-tint)" }}>
                    <div style={{ width: 36, height: 36, borderRadius: 9, background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <BIcon size={16} color="var(--color-primary)" />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 11, color: "var(--color-primary)" }}>{performantLabel}</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{getName(best)}</div>
                    </div>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 600, flexShrink: 0, color: pct > 0 ? "var(--color-success)" : pct < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>{fmtPctLocal(pct)}</div>
                  </div>
                );
              })()}

              {(() => {
                if (items.length === 0 || chartSeries.months.length === 0) return null;
                const startMap = buildMapAsOf(monthDateToFull(chartSeries.months[0]));
                const endMap = buildMapAsOf(monthDateToFull(chartSeries.months[chartSeries.months.length - 1]));
                let leader = null, leaderGrowth = -Infinity;
                items.forEach((it) => {
                  const growth = getTotalsFromMap(it, endMap).costBasis - getTotalsFromMap(it, startMap).costBasis;
                  if (growth > leaderGrowth) { leaderGrowth = growth; leader = it; }
                });
                if (!leader || leaderGrowth <= 0) return null;
                const LIcon = getIcon(leader);
                return (
                  <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, background: "var(--color-bg-tint)" }}>
                    <div style={{ width: 36, height: 36, borderRadius: 9, background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <LIcon size={16} color="var(--color-primary)" />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 11, color: "var(--color-primary)" }}>{growthLabel} ({chartRange})</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color: "var(--color-heading)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{getName(leader)}</div>
                    </div>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 600, flexShrink: 0, color: "var(--color-success)" }}><Money>+{fmtEUR(leaderGrowth)}</Money></div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      ) : (
        emptyMessage && <div style={{ marginTop: 20, textAlign: "center", fontSize: 13.5, color: "var(--color-primary)" }}>{emptyMessage}</div>
      )}
    </div>
  );
}

function InvestApp({ session, onBack }) {
  const kbOffset = useKeyboardOffset();
  const userId = session.user.id;
  const [portfolios, setPortfolios] = useState([]);
  const [holdings, setHoldings] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePortfolioId, setActivePortfolioId] = useState(null);
  const [activeHoldingId, setActiveHoldingId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());
  const [addingPortfolio, setAddingPortfolio] = useState(false);
  const [newPortfolioName, setNewPortfolioName] = useState("");
  const [newPortfolioIcon, setNewPortfolioIcon] = useState("Briefcase");
  const [portfolioError, setPortfolioError] = useState("");
  const [portfolioBusy, setPortfolioBusy] = useState(false);
  const [removalPortfolio, setRemovalPortfolio] = useState(null);
  const [editingPortfolioId, setEditingPortfolioId] = useState(null);
  const [editPortfolioName, setEditPortfolioName] = useState("");
  const [editPortfolioIcon, setEditPortfolioIcon] = useState("Briefcase");
  const [editPortfolioError, setEditPortfolioError] = useState("");
  const [editPortfolioBusy, setEditPortfolioBusy] = useState(false);

  const [addingHolding, setAddingHolding] = useState(false);
  const [newHoldingName, setNewHoldingName] = useState("");
  const [holdingError, setHoldingError] = useState("");
  const [holdingBusy, setHoldingBusy] = useState(false);
  const [removalHolding, setRemovalHolding] = useState(null);
  const [editingHoldingId, setEditingHoldingId] = useState(null);
  const [editHoldingName, setEditHoldingName] = useState("");
  const [editHoldingError, setEditHoldingError] = useState("");
  const [editHoldingBusy, setEditHoldingBusy] = useState(false);

  const [valForm, setValForm] = useState({ value_date: currentMonthISO(), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  const [valError, setValError] = useState("");
  const [editingValId, setEditingValId] = useState(null);
  const [editValForm, setEditValForm] = useState({ value_date: "", market_value: "", cost_basis: "", carry_group_id: null, contribution_amount: null, base_market_value: "", base_cost_basis: "" });
  const [editValScope, setEditValScope] = useState("single");
  const [bulkOverrideConfirm, setBulkOverrideConfirm] = useState(false);
  const [pendingManualCount, setPendingManualCount] = useState(0);
  const [editValError, setEditValError] = useState("");
  const [removalValuation, setRemovalValuation] = useState(null);

  useEffect(() => {
    (async () => {
      const { data: pf, error: pfErr } = await supabase.from("investment_portfolios").select("*").order("created_at", { ascending: true });
      const { data: hd, error: hdErr } = await supabase.from("investment_holdings").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("investment_valuations").select("*").order("value_date", { ascending: false });
      setPortfolios(!pfErr && pf ? pf : []);
      setHoldings(!hdErr && hd ? hd : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);
  const prevCursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month - 1)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.holding_id];
      if (!cur || v.value_date > cur.value_date) map[v.holding_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);
  const valuationAsOfPrevCursor = useMemo(() => buildValuationMap(prevCursorFullDate), [valuations, prevCursorFullDate]);

  const holdingTotalsFromMap = (holdingId, map) => {
    const v = map[holdingId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const holdingTotals = (holdingId) => holdingTotalsFromMap(holdingId, valuationAsOfCursor);

  const portfolioTotalsFromMap = (portfolioId, map) => {
    const hs = holdings.filter((h) => h.portfolio_id === portfolioId);
    let marketValue = 0, gain = 0, costBasis = 0;
    hs.forEach((h) => {
      const t = holdingTotalsFromMap(h.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis, count: hs.length };
  };
  const portfolioTotals = (portfolioId) => portfolioTotalsFromMap(portfolioId, valuationAsOfCursor);
  const prevPortfolioTotals = (portfolioId) => portfolioTotalsFromMap(portfolioId, valuationAsOfPrevCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    portfolios.forEach((p) => {
      const t = portfolioTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [portfolios, holdings, valuations, valuationAsOfCursor]);
  const prevGrandTotal = useMemo(() => grandTotalFromMap(valuationAsOfPrevCursor), [portfolios, holdings, valuations, valuationAsOfPrevCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);
  const deltaVsPrev = (curT, prevT) => {
    const delta = curT.marketValue - prevT.marketValue;
    const pct = prevT.marketValue > 0 ? (delta / prevT.marketValue) * 100 : null;
    return { delta, pct };
  };
  const fmtPct = (p) => `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;

  const [dashboardView, setDashboardView] = useState("list");

  const historyMonths = useMemo(() => {
    if (valuations.length === 0) return [];
    const monthKeys = valuations.map((v) => fullDateToMonth(v.value_date));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx));
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [valuations]);

  const activePortfolio = portfolios.find((p) => p.id === activePortfolioId);
  const activeHolding = holdings.find((h) => h.id === activeHoldingId);
  const portfolioHoldings = useMemo(() => holdings.filter((h) => h.portfolio_id === activePortfolioId), [holdings, activePortfolioId]);
  const holdingValuations = useMemo(() => valuations.filter((v) => v.holding_id === activeHoldingId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activeHoldingId]);
  const [portfolioDashView, setPortfolioDashView] = useState("list");
  const portfolioHoldingIds = useMemo(() => new Set(portfolioHoldings.map((h) => h.id)), [portfolioHoldings]);
  const portfolioHistoryMonths = useMemo(() => {
    const rel = valuations.filter((v) => portfolioHoldingIds.has(v.holding_id));
    if (rel.length === 0) return [];
    const monthKeys = rel.map((v) => fullDateToMonth(v.value_date));
    const toIdx = (mk) => { const [y, m] = mk.split("-").map(Number); return y * 12 + (m - 1); };
    const startIdx = Math.min(...monthKeys.map(toIdx));
    const endIdx = Math.max(...monthKeys.map(toIdx));
    const months = [];
    for (let idx = startIdx; idx <= endIdx; idx++) months.push(monthKeyFromIdx(idx));
    return months;
  }, [valuations, portfolioHoldingIds]);

  const openPortfolio = (p) => { setActivePortfolioId(p.id); setView("portfolio"); };
  const openHolding = (h) => { setActiveHoldingId(h.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("holding"); };

  const addPortfolio = async () => {
    if (portfolioBusy) return;
    const name = newPortfolioName.trim();
    if (!name) { setPortfolioError("Inserisci un nome."); return; }
    setPortfolioBusy(true);
    const { data, error: insErr } = await supabase.from("investment_portfolios").insert({ user_id: userId, name, icon_key: newPortfolioIcon }).select().single();
    setPortfolioBusy(false);
    if (insErr) { setPortfolioError(insErr.message); return; }
    setPortfolios((prev) => [...prev, data]);
    setNewPortfolioName(""); setNewPortfolioIcon("Briefcase"); setPortfolioError(""); setAddingPortfolio(false);
  };

  const openEditPortfolio = (p) => {
    setEditingPortfolioId(p.id);
    setEditPortfolioName(p.name);
    setEditPortfolioIcon(p.icon_key || "Briefcase");
    setEditPortfolioError("");
  };

  const saveEditPortfolio = async () => {
    if (editPortfolioBusy) return;
    const name = editPortfolioName.trim();
    if (!name) { setEditPortfolioError("Inserisci un nome."); return; }
    setEditPortfolioBusy(true);
    const { data, error: updErr } = await supabase.from("investment_portfolios").update({ name, icon_key: editPortfolioIcon }).eq("id", editingPortfolioId).select().single();
    setEditPortfolioBusy(false);
    if (updErr) { setEditPortfolioError(updErr.message); return; }
    setPortfolios((prev) => prev.map((p) => (p.id === editingPortfolioId ? data : p)));
    setEditingPortfolioId(null);
  };

  const deletePortfolio = async () => {
    const p = removalPortfolio;
    const { error: delErr } = await supabase.from("investment_portfolios").delete().eq("id", p.id);
    if (!delErr) {
      setPortfolios((prev) => prev.filter((x) => x.id !== p.id));
      const removedHoldingIds = holdings.filter((h) => h.portfolio_id === p.id).map((h) => h.id);
      setHoldings((prev) => prev.filter((h) => h.portfolio_id !== p.id));
      setValuations((prev) => prev.filter((v) => !removedHoldingIds.includes(v.holding_id)));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalPortfolio(null);
  };

  const addHolding = async () => {
    if (holdingBusy) return;
    const name = newHoldingName.trim();
    if (!name) { setHoldingError("Inserisci un nome."); return; }
    setHoldingBusy(true);
    const { data, error: insErr } = await supabase.from("investment_holdings").insert({ user_id: userId, portfolio_id: activePortfolioId, name }).select().single();
    setHoldingBusy(false);
    if (insErr) { setHoldingError(insErr.message); return; }
    setHoldings((prev) => [...prev, data]);
    setNewHoldingName(""); setHoldingError(""); setAddingHolding(false);
  };

  const openEditHolding = (h) => {
    setEditingHoldingId(h.id);
    setEditHoldingName(h.name);
    setEditHoldingError("");
  };

  const saveEditHolding = async () => {
    if (editHoldingBusy) return;
    const name = editHoldingName.trim();
    if (!name) { setEditHoldingError("Inserisci un nome."); return; }
    setEditHoldingBusy(true);
    const { data, error: updErr } = await supabase.from("investment_holdings").update({ name }).eq("id", editingHoldingId).select().single();
    setEditHoldingBusy(false);
    if (updErr) { setEditHoldingError(updErr.message); return; }
    setHoldings((prev) => prev.map((h) => (h.id === editingHoldingId ? data : h)));
    setEditingHoldingId(null);
  };

  const deleteHolding = async () => {
    const h = removalHolding;
    const { error: delErr } = await supabase.from("investment_holdings").delete().eq("id", h.id);
    if (!delErr) {
      setHoldings((prev) => prev.filter((x) => x.id !== h.id));
      setValuations((prev) => prev.filter((v) => v.holding_id !== h.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalHolding(null);
  };

  const addValuation = async (e) => {
    e.preventDefault();
    const mv = parseFloat(String(valForm.market_value).replace(",", "."));
    const cb = parseFloat(String(valForm.cost_basis).replace(",", "."));
    if (!valForm.value_date) { setValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setValError("Inserisci un valore di mercato valido."); return; }
    if (isNaN(cb) || cb < 0) { setValError("Inserisci un costo storico valido."); return; }
    if (valForm.carryForward) {
      if (!valForm.carryUntil) { setValError("Seleziona fino a quale mese portare avanti il valore."); return; }
      if (monthKeyToIdx(valForm.carryUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.carryUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di portare avanti il dato su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, holding_id: activeHoldingId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv, cost_basis: cb, carry_group_id: groupId, manually_edited: false });
      }
      const { data, error: insErr } = await supabase.from("investment_valuations").insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
      return;
    }
    if (valForm.recurringContribution) {
      const contrib = parseFloat(String(valForm.contributionAmount).replace(",", "."));
      if (!valForm.contributionUntil) { setValError("Seleziona fino a quale mese effettuare il versamento ricorrente."); return; }
      if (isNaN(contrib) || contrib <= 0) { setValError("Inserisci un importo di versamento mensile valido."); return; }
      if (monthKeyToIdx(valForm.contributionUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.contributionUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di impostare il versamento ricorrente su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const offset = idx - startIdx;
        rows.push({ user_id: userId, holding_id: activeHoldingId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv + offset * contrib, cost_basis: cb + offset * contrib, carry_group_id: groupId, contribution_amount: contrib, manually_edited: false });
      }
      const { data, error: insErr } = await supabase.from("investment_valuations").insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
      return;
    }
    const duplicate = valuations.some((v) => v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === valForm.value_date);
    if (duplicate) {
      const [dy, dm] = valForm.value_date.split("-").map(Number);
      setValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setValError("");
    const { data, error: insErr } = await supabase.from("investment_valuations").insert({ user_id: userId, holding_id: activeHoldingId, value_date: monthDateToFull(valForm.value_date), market_value: mv, cost_basis: cb }).select().single();
    if (insErr) { setValError(insErr.message); return; }
    setValuations((prev) => [{ ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) }, ...prev]);
    setValForm({ value_date: monthKeyFromIdx(monthKeyToIdx(valForm.value_date) + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "", recurringContribution: false, contributionUntil: "", contributionAmount: "" });
  };

  const openEditValuation = (v) => {
    setEditingValId(v.id);
    const groupRows = v.carry_group_id ? valuations.filter((x) => x.holding_id === activeHoldingId && x.carry_group_id === v.carry_group_id) : [];
    const firstRow = groupRows.length > 0 ? groupRows.reduce((a, b) => (a.value_date < b.value_date ? a : b)) : null;
    setEditValForm({
      value_date: fullDateToMonth(v.value_date),
      market_value: String(v.market_value).replace(".", ","),
      cost_basis: String(v.cost_basis).replace(".", ","),
      carry_group_id: v.carry_group_id || null,
      contribution_amount: v.contribution_amount != null ? v.contribution_amount : null,
      base_market_value: firstRow ? String(firstRow.market_value).replace(".", ",") : "",
      base_cost_basis: firstRow ? String(firstRow.cost_basis).replace(".", ",") : "",
    });
    setEditValScope("single");
    setBulkOverrideConfirm(false);
    setEditValError("");
  };

  const editValGroupSize = editValForm.carry_group_id ? valuations.filter((v) => v.carry_group_id === editValForm.carry_group_id).length : 1;
  const isContributionGroup = editValForm.contribution_amount != null;

  const saveEditValuation = async (forceOverride) => {
    if (editValScope === "all" && editValForm.carry_group_id && editValForm.contribution_amount != null) {
      const baseMv = parseFloat(String(editValForm.base_market_value).replace(",", "."));
      const baseCb = parseFloat(String(editValForm.base_cost_basis).replace(",", "."));
      const contrib = parseFloat(String(editValForm.contribution_amount).replace(",", "."));
      if (isNaN(baseMv) || baseMv < 0) { setEditValError("Inserisci un valore di partenza valido."); return; }
      if (isNaN(baseCb) || baseCb < 0) { setEditValError("Inserisci un costo storico di partenza valido."); return; }
      if (isNaN(contrib) || contrib <= 0) { setEditValError("Inserisci un versamento mensile valido."); return; }
      const groupRows = valuations.filter((v) => v.holding_id === activeHoldingId && v.carry_group_id === editValForm.carry_group_id).slice().sort((a, b) => (a.value_date < b.value_date ? -1 : a.value_date > b.value_date ? 1 : 0));
      if (!forceOverride) {
        const manualCount = groupRows.filter((v) => v.manually_edited).length;
        if (manualCount > 0) {
          setPendingManualCount(manualCount);
          setBulkOverrideConfirm(true);
          return;
        }
      }
      setBulkOverrideConfirm(false);
      setEditValError("");
      const updates = groupRows.map((v, i) => ({ id: v.id, market_value: baseMv + i * contrib, cost_basis: baseCb + i * contrib }));
      const results = await Promise.all(updates.map((u) => supabase.from("investment_valuations").update({ market_value: u.market_value, cost_basis: u.cost_basis, contribution_amount: contrib, manually_edited: false }).eq("id", u.id).select().single()));
      const failed = results.find((r) => r.error);
      if (failed) { setEditValError(failed.error.message); return; }
      setValuations((prev) => prev.map((v) => {
        const upd = updates.find((u) => u.id === v.id);
        return upd ? { ...v, market_value: upd.market_value, cost_basis: upd.cost_basis, contribution_amount: contrib, manually_edited: false } : v;
      }));
      setEditingValId(null);
      return;
    }
    const mv = parseFloat(String(editValForm.market_value).replace(",", "."));
    const cb = parseFloat(String(editValForm.cost_basis).replace(",", "."));
    if (editValScope === "single" && !editValForm.value_date) { setEditValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setEditValError("Inserisci un valore di mercato valido."); return; }
    if (isNaN(cb) || cb < 0) { setEditValError("Inserisci un costo storico valido."); return; }
    if (editValScope === "all" && editValForm.carry_group_id) {
      const { error: updErr } = await supabase.from("investment_valuations").update({ market_value: mv, cost_basis: cb }).eq("carry_group_id", editValForm.carry_group_id);
      if (updErr) { setEditValError(updErr.message); return; }
      setValuations((prev) => prev.map((v) => (v.carry_group_id === editValForm.carry_group_id ? { ...v, market_value: mv, cost_basis: cb } : v)));
      setEditingValId(null);
      return;
    }
    const duplicate = valuations.some((v) => v.id !== editingValId && v.holding_id === activeHoldingId && fullDateToMonth(v.value_date) === editValForm.value_date);
    if (duplicate) {
      const [dy, dm] = editValForm.value_date.split("-").map(Number);
      setEditValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setEditValError("");
    const payload = { value_date: monthDateToFull(editValForm.value_date), market_value: mv, cost_basis: cb };
    if (editValForm.carry_group_id) payload.manually_edited = true;
    const { data, error: updErr } = await supabase.from("investment_valuations").update(payload).eq("id", editingValId).select().single();
    if (updErr) { setEditValError(updErr.message); return; }
    setValuations((prev) => prev.map((v) => (v.id === editingValId ? { ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) } : v)));
    setEditingValId(null);
  };

  const deleteValuation = async (scope) => {
    const v = removalValuation;
    if (scope === "all" && v.carry_group_id) {
      const prev = valuations;
      setValuations((p) => p.filter((x) => x.carry_group_id !== v.carry_group_id));
      const { error: delErr } = await supabase.from("investment_valuations").delete().eq("carry_group_id", v.carry_group_id);
      if (delErr) { setValuations(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
    } else {
      const { error: delErr } = await supabase.from("investment_valuations").delete().eq("id", v.id);
      if (!delErr) setValuations((prev) => prev.filter((x) => x.id !== v.id));
      else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    }
    setRemovalValuation(null);
  };

    return (
