                      )}
                      {editValError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editValError}</div>}
                      {bulkOverrideConfirm ? (
                        <div style={{ padding: 10, background: "var(--color-danger-bg)", borderRadius: 8, border: "1px solid var(--color-danger-border)" }}>
                          <div style={{ fontSize: 12.5, color: "var(--color-heading)", marginBottom: 10 }}>{pendingManualCount} {pendingManualCount === 1 ? "mese di questo gruppo è stato modificato manualmente" : "mesi di questo gruppo sono stati modificati manualmente"} in precedenza. Continuando, verranno sovrascritti con il valore ricalcolato. Vuoi continuare?</div>
                          <div style={{ display: "flex", gap: 8 }}>
                            <button onClick={() => setBulkOverrideConfirm(false)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 13.5, cursor: "pointer" }}>Annulla</button>
                            <button onClick={() => saveEditValuation(true)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", background: "var(--color-danger)", color: "#FFFFFF", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Sì, sovrascrivi tutto</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => setEditingValId(null)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 13.5, cursor: "pointer" }}>Annulla</button>
                          <button onClick={() => setRemovalValuation(v)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 13.5, cursor: "pointer" }}>Elimina</button>
                          <button onClick={() => saveEditValuation()} style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", background: "var(--color-heading)", color: "#FFFFFF", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>{editValScope === "all" ? `Salva su ${editValGroupSize}` : "Salva"}</button>
                        </div>
                      )}
                    </div>
                  );
                }
                return (
                  <div key={v.id} onClick={() => openEditValuation(v)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 6px", borderBottom: "1px dotted var(--color-border)", cursor: "pointer" }}>
                    <div style={{ width: 54, fontSize: 13.5, color: "var(--color-primary)", flexShrink: 0, textTransform: "capitalize", whiteSpace: "nowrap" }}>{fmtMonthYear(fullDateToMonth(v.value_date))}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="mono" style={{ fontSize: 16, fontWeight: 600 }}><Money>{fmtEUR(v.market_value)}</Money></div>
                      <div style={{ fontSize: 12, color: "var(--color-border-light)" }}>Versato: <Money>{fmtEUR(v.cost_basis)}</Money></div>
                    </div>
                    <div className="mono" style={{ fontSize: 14, fontWeight: 600, color: gain > 0 ? "var(--color-success)" : gain < 0 ? "var(--color-danger)" : "var(--color-border-light)", flexShrink: 0 }}><Money>{gain > 0 ? "+" : ""}{fmtEUR(gain)}</Money></div>
                  </div>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 8, flexShrink: 0 }}>
              <button onClick={() => openEditPolicy(activePolicy)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-heading)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                Modifica
              </button>
              <button onClick={() => setRemovalPolicy(activePolicy)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-danger-border)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                <Trash2 size={14} /> Elimina
              </button>
            </div>

            {editingPolicyId && (
              <>
                <div onClick={() => setEditingPolicyId(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in scrollbar-thin" style={{ position: "fixed", left: 20, right: 20, bottom: 24 + kbOffset, maxWidth: 520, margin: "0 auto", maxHeight: "75dvh", overflowY: "auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Modifica</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome</div>
                  <input type="text" value={editPolicyName} onChange={(e) => { setEditPolicyName(e.target.value); setEditPolicyError(""); }} autoFocus style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {INSURANCE_ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setEditPolicyIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, cursor: "pointer", border: editPolicyIcon === key ? "1.5px solid var(--color-primary)" : "1px solid var(--color-border)", background: editPolicyIcon === key ? "var(--color-bg-tint)" : "#FFFFFF" }}>
                        <IconComp size={19} color={editPolicyIcon === key ? "var(--color-primary)" : "var(--color-primary)"} />
                      </button>
                    ))}
                  </div>
                  {editPolicyError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editPolicyError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setEditingPolicyId(null)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={saveEditPolicy} disabled={editPolicyBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: editPolicyBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: editPolicyBusy ? "default" : "pointer" }}>Salva</button>
                  </div>
                </div>
              </>
            )}

            {removalPolicy && (
              <>
                <div onClick={() => setRemovalPolicy(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalPolicy.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questa voce. L'operazione non è reversibile.</div>
                  <button onClick={async () => { await deletePolicy(); setView("home"); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                  <button onClick={() => setRemovalPolicy(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}

            {removalValuation && (
              <>
                <div onClick={() => setRemovalValuation(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  {removalValuation.carry_group_id && valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length > 1 ? (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>{removalValuation.contribution_amount != null ? "Versamento ricorrente" : 'Valore "portato avanti"'}</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Questo valore fa parte di un gruppo di {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi creati insieme. Cosa vuoi eliminare?</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-heading)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Elimina solo questo mese</button>
                      <button onClick={async () => { await deleteValuation("all"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Elimina tutti i {valuations.filter((v) => v.carry_group_id === removalValuation.carry_group_id).length} mesi</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare questo valore?</div>
                      <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>L'operazione non è reversibile.</div>
                      <button onClick={async () => { await deleteValuation("single"); setEditingValId(null); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                      <button onClick={() => setRemovalValuation(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    </>
                  )}
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function RealEstateApp({ session, onBack }) {
  const kbOffset = useKeyboardOffset();
  const userId = session.user.id;
  const [properties, setPolicies] = useState([]);
  const [valuations, setValuations] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [lastErrorMsg, setLastErrorMsg] = useState("");

  const [view, setView] = useState("home");
  const [activePropertyId, setActivePropertyId] = useState(null);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [pickerYear, setPickerYear] = useState(() => new Date().getFullYear());

  const [addingProperty, setAddingProperty] = useState(false);
  const [newPropertyName, setNewPropertyName] = useState("");
  const [newPropertyIcon, setNewPropertyIcon] = useState("Home");
  const [propertyError, setPropertyError] = useState("");
  const [propertyBusy, setPropertyBusy] = useState(false);
  const [removalProperty, setRemovalProperty] = useState(null);
  const [editingPropertyId, setEditingPropertyId] = useState(null);
  const [editPropertyName, setEditPropertyName] = useState("");
  const [editPropertyIcon, setEditPropertyIcon] = useState("Home");
  const [editPropertyError, setEditPropertyError] = useState("");
  const [editPropertyBusy, setEditPropertyBusy] = useState(false);

  const [valForm, setValForm] = useState({ value_date: currentMonthISO(), market_value: "", cost_basis: "", carryForward: false, carryUntil: "" });
  const [valError, setValError] = useState("");
  const [editingValId, setEditingValId] = useState(null);
  const [editValForm, setEditValForm] = useState({ value_date: "", market_value: "", cost_basis: "", carry_group_id: null });
  const [editValScope, setEditValScope] = useState("single");
  const [editValError, setEditValError] = useState("");
  const [removalValuation, setRemovalValuation] = useState(null);

  useEffect(() => {
    (async () => {
      const { data: pol, error: polErr } = await supabase.from("real_estate_properties").select("*").order("created_at", { ascending: true });
      const { data: vl, error: vlErr } = await supabase.from("real_estate_valuations").select("*").order("value_date", { ascending: false });
      setPolicies(!polErr && pol ? pol : []);
      setValuations(!vlErr && vl ? vl.map((v) => ({ ...v, market_value: Number(v.market_value), cost_basis: Number(v.cost_basis) })) : []);
      setLoaded(true);
    })();
  }, []);

  const cursorFullDate = useMemo(() => monthDateToFull(monthKeyFromIdx(cursor.year * 12 + cursor.month)), [cursor]);

  const goCursor = (delta) => {
    setCursor((c) => {
      const idx = c.year * 12 + c.month + delta;
      const year = Math.floor(idx / 12);
      const month = ((idx % 12) + 12) % 12;
      return { year, month };
    });
  };

  const buildValuationMap = (cutoffFullDate) => {
    const map = {};
    valuations.forEach((v) => {
      if (v.value_date > cutoffFullDate) return;
      const cur = map[v.property_id];
      if (!cur || v.value_date > cur.value_date) map[v.property_id] = v;
    });
    return map;
  };

  const valuationAsOfCursor = useMemo(() => buildValuationMap(cursorFullDate), [valuations, cursorFullDate]);

  const propertyTotalsFromMap = (propertyId, map) => {
    const v = map[propertyId];
    if (!v) return { marketValue: 0, costBasis: 0, gain: 0, hasData: false };
    return { marketValue: v.market_value, costBasis: v.cost_basis, gain: v.market_value - v.cost_basis, hasData: true };
  };
  const propertyTotals = (propertyId) => propertyTotalsFromMap(propertyId, valuationAsOfCursor);

  const grandTotalFromMap = (map) => {
    let marketValue = 0, gain = 0, costBasis = 0;
    properties.forEach((p) => {
      const t = propertyTotalsFromMap(p.id, map);
      marketValue += t.marketValue; gain += t.gain; costBasis += t.costBasis;
    });
    return { marketValue, gain, costBasis };
  };
  const grandTotal = useMemo(() => grandTotalFromMap(valuationAsOfCursor), [properties, valuations, valuationAsOfCursor]);

  const returnPct = (t) => (t.costBasis > 0 ? (t.gain / t.costBasis) * 100 : null);
  const fmtPct = (p) => `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;

  const activeProperty = properties.find((p) => p.id === activePropertyId);
  const propertyValuations = useMemo(() => valuations.filter((v) => v.property_id === activePropertyId).sort((a, b) => new Date(b.value_date) - new Date(a.value_date)), [valuations, activePropertyId]);

  const openProperty = (p) => { setActivePropertyId(p.id); setValForm({ value_date: currentMonthISO(), market_value: "", cost_basis: "" }); setValError(""); setView("property"); };

  const addProperty = async () => {
    if (propertyBusy) return;
    const name = newPropertyName.trim();
    if (!name) { setPropertyError("Inserisci un nome."); return; }
    setPropertyBusy(true);
    const { data, error: insErr } = await supabase.from("real_estate_properties").insert({ user_id: userId, name, icon_key: newPropertyIcon }).select().single();
    setPropertyBusy(false);
    if (insErr) { setPropertyError(insErr.message); return; }
    setPolicies((prev) => [...prev, data]);
    setNewPropertyName(""); setNewPropertyIcon("Home"); setPropertyError(""); setAddingProperty(false);
  };

  const openEditProperty = (p) => {
    setEditingPropertyId(p.id);
    setEditPropertyName(p.name);
    setEditPropertyIcon(p.icon_key || "Home");
    setEditPropertyError("");
  };

  const saveEditProperty = async () => {
    if (editPropertyBusy) return;
    const name = editPropertyName.trim();
    if (!name) { setEditPropertyError("Inserisci un nome."); return; }
    setEditPropertyBusy(true);
    const { data, error: updErr } = await supabase.from("real_estate_properties").update({ name, icon_key: editPropertyIcon }).eq("id", editingPropertyId).select().single();
    setEditPropertyBusy(false);
    if (updErr) { setEditPropertyError(updErr.message); return; }
    setPolicies((prev) => prev.map((p) => (p.id === editingPropertyId ? data : p)));
    setEditingPropertyId(null);
  };

  const deleteProperty = async () => {
    const p = removalProperty;
    const { error: delErr } = await supabase.from("real_estate_properties").delete().eq("id", p.id);
    if (!delErr) {
      setPolicies((prev) => prev.filter((x) => x.id !== p.id));
      setValuations((prev) => prev.filter((v) => v.property_id !== p.id));
    } else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalProperty(null);
  };

  const addValuation = async (e) => {
    e.preventDefault();
    const mv = parseFloat(String(valForm.market_value).replace(",", "."));
    const cb = parseFloat(String(valForm.cost_basis).replace(",", "."));
    if (!valForm.value_date) { setValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setValError("Inserisci un valore attuale valido."); return; }
    if (isNaN(cb) || cb < 0) { setValError("Inserisci un costo storico valido."); return; }
    if (valForm.carryForward) {
      if (!valForm.carryUntil) { setValError("Seleziona fino a quale mese portare avanti il valore."); return; }
      if (monthKeyToIdx(valForm.carryUntil) < monthKeyToIdx(valForm.value_date)) { setValError("Il mese finale deve essere uguale o successivo al mese di partenza."); return; }
      const startIdx = monthKeyToIdx(valForm.value_date);
      const endIdx = monthKeyToIdx(valForm.carryUntil);
      for (let idx = startIdx; idx <= endIdx; idx++) {
        const mk = monthKeyFromIdx(idx);
        if (valuations.some((v) => v.property_id === activePropertyId && fullDateToMonth(v.value_date) === mk)) {
          setValError(`Valori già presenti per il mese di ${fmtMonthYear(mk)}. Rimuovi o modifica quel valore prima di portare avanti il dato su questo intervallo.`);
          return;
        }
      }
      setValError("");
      const groupId = genGroupId();
      const rows = [];
      for (let idx = startIdx; idx <= endIdx; idx++) {
        rows.push({ user_id: userId, property_id: activePropertyId, value_date: monthDateToFull(monthKeyFromIdx(idx)), market_value: mv, cost_basis: cb, carry_group_id: groupId });
      }
      const { data, error: insErr } = await supabase.from("real_estate_valuations").insert(rows).select();
      if (insErr) { setValError(insErr.message); return; }
      setValuations((prev) => [...data.map((d) => ({ ...d, market_value: Number(d.market_value), cost_basis: Number(d.cost_basis) })), ...prev]);
      setValForm({ value_date: monthKeyFromIdx(endIdx + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "" });
      return;
    }
    const duplicate = valuations.some((v) => v.property_id === activePropertyId && fullDateToMonth(v.value_date) === valForm.value_date);
    if (duplicate) {
      const [dy, dm] = valForm.value_date.split("-").map(Number);
      setValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setValError("");
    const { data, error: insErr } = await supabase.from("real_estate_valuations").insert({ user_id: userId, property_id: activePropertyId, value_date: monthDateToFull(valForm.value_date), market_value: mv, cost_basis: cb }).select().single();
    if (insErr) { setValError(insErr.message); return; }
    setValuations((prev) => [{ ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) }, ...prev]);
    setValForm({ value_date: monthKeyFromIdx(monthKeyToIdx(valForm.value_date) + 1), market_value: "", cost_basis: "", carryForward: false, carryUntil: "" });
  };

  const openEditValuation = (v) => {
    setEditingValId(v.id);
    setEditValForm({ value_date: fullDateToMonth(v.value_date), market_value: String(v.market_value).replace(".", ","), cost_basis: String(v.cost_basis).replace(".", ","), carry_group_id: v.carry_group_id || null });
    setEditValScope("single");
    setEditValError("");
  };

  const editValGroupSize = editValForm.carry_group_id ? valuations.filter((v) => v.carry_group_id === editValForm.carry_group_id).length : 1;

  const saveEditValuation = async () => {
    const mv = parseFloat(String(editValForm.market_value).replace(",", "."));
    const cb = parseFloat(String(editValForm.cost_basis).replace(",", "."));
    if (editValScope === "single" && !editValForm.value_date) { setEditValError("Inserisci un mese."); return; }
    if (isNaN(mv) || mv < 0) { setEditValError("Inserisci un valore attuale valido."); return; }
    if (isNaN(cb) || cb < 0) { setEditValError("Inserisci un costo storico valido."); return; }
    if (editValScope === "all" && editValForm.carry_group_id) {
      const { error: updErr } = await supabase.from("real_estate_valuations").update({ market_value: mv, cost_basis: cb }).eq("carry_group_id", editValForm.carry_group_id);
      if (updErr) { setEditValError(updErr.message); return; }
      setValuations((prev) => prev.map((v) => (v.carry_group_id === editValForm.carry_group_id ? { ...v, market_value: mv, cost_basis: cb } : v)));
      setEditingValId(null);
      return;
    }
    const duplicate = valuations.some((v) => v.id !== editingValId && v.property_id === activePropertyId && fullDateToMonth(v.value_date) === editValForm.value_date);
    if (duplicate) {
      const [dy, dm] = editValForm.value_date.split("-").map(Number);
      setEditValError(`Valori già presenti per il mese di ${MESI[dm - 1]} ${String(dy).slice(-2)}. Si prega di modificare il valore già esistente o di inserire il dato per un mese diverso.`);
      return;
    }
    setEditValError("");
    const { data, error: updErr } = await supabase.from("real_estate_valuations").update({ value_date: monthDateToFull(editValForm.value_date), market_value: mv, cost_basis: cb }).eq("id", editingValId).select().single();
    if (updErr) { setEditValError(updErr.message); return; }
    setValuations((prev) => prev.map((v) => (v.id === editingValId ? { ...data, market_value: Number(data.market_value), cost_basis: Number(data.cost_basis) } : v)));
    setEditingValId(null);
  };

  const deleteValuation = async (scope) => {
    const v = removalValuation;
    if (scope === "all" && v.carry_group_id) {
      const prev = valuations;
      setValuations((p) => p.filter((x) => x.carry_group_id !== v.carry_group_id));
      const { error: delErr } = await supabase.from("real_estate_valuations").delete().eq("carry_group_id", v.carry_group_id);
      if (delErr) { setValuations(prev); setSaveState("error"); setLastErrorMsg(delErr.message); }
    } else {
      const { error: delErr } = await supabase.from("real_estate_valuations").delete().eq("id", v.id);
      if (!delErr) setValuations((prev) => prev.filter((x) => x.id !== v.id));
      else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    }
    setRemovalValuation(null);
  };

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando gli immobili…</div>
      </div>
    );
  }

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={() => {
          if (view === "property") { setView("home"); setEditingValId(null); }
          else onBack();
        }} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
          <ArrowLeft size={22} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>
          {view === "home" ? "Immobili" : (activeProperty ? activeProperty.name : "")}
        </span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 20px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
        {view === "home" ? (
          <>
            <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <button onClick={() => goCursor(-1)} aria-label="Mese precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronLeft size={32} /></button>
              <div onClick={() => { setPickerYear(cursor.year); setDatePickerOpen(true); }} style={{ fontSize: "clamp(18px, 6vw, 28px)", letterSpacing: "0.01em", color: "var(--color-heading)", fontWeight: 700, whiteSpace: "nowrap", flex: 1, minWidth: 0, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", cursor: "pointer", textTransform: "capitalize" }}>{MESI[cursor.month]} {String(cursor.year).slice(-2)}</div>
              <button onClick={() => goCursor(1)} aria-label="Mese successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)", flexShrink: 0 }}><ChevronRight size={32} /></button>

              {datePickerOpen && (
                <>
                  <div onClick={() => setDatePickerOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 39 }} />
                  <div className="fade-in" style={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: 6, zIndex: 40 }}>
                    <div style={{ maxWidth: 260, margin: "0 auto", background: "#FFFFFF", border: "1px solid var(--color-border)", borderRadius: 12, boxShadow: "0 12px 28px rgba(5,91,101,0.16)", padding: 14 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                        <button onClick={() => setPickerYear((y) => y - 1)} aria-label="Anno precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronLeft size={18} /></button>
                        <div style={{ fontSize: 15, fontWeight: 700, color: "var(--color-heading)" }}>{pickerYear}</div>
                        <button onClick={() => setPickerYear((y) => y + 1)} aria-label="Anno successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 6, color: "var(--color-primary)" }}><ChevronRight size={18} /></button>
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
                        {MESI.map((m, i) => {
                          const isSelected = pickerYear === cursor.year && i === cursor.month;
                          return (
                            <button key={m} onClick={() => { setCursor({ year: pickerYear, month: i }); setDatePickerOpen(false); }} style={{ padding: "9px 0", borderRadius: 8, border: isSelected ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: isSelected ? "var(--color-primary)" : "#FFFFFF", color: isSelected ? "#FFFFFF" : "var(--color-heading)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                              {m.slice(0, 3)}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
            <div key={`${cursor.year}-${cursor.month}`} className="fade-in" style={{ textAlign: "center", padding: "4px 0 14px", borderBottom: "1px solid var(--color-border)", flexShrink: 0 }}>
              <div className="mono" style={{ fontSize: 32, fontWeight: 600, letterSpacing: "-0.01em", color: "var(--color-heading)" }}><Money>{fmtEUR(grandTotal.marketValue)}</Money></div>
              <div className="mono" style={{ fontSize: 14, fontWeight: 600, marginTop: 2, color: grandTotal.gain > 0 ? "var(--color-success)" : grandTotal.gain < 0 ? "var(--color-danger)" : "var(--color-primary)" }}>
                <Money>{grandTotal.gain > 0 ? "+" : ""}{fmtEUR(grandTotal.gain)}</Money>{returnPct(grandTotal) !== null && ` (${fmtPct(returnPct(grandTotal))})`}
              </div>
            </div>

            <div className="scrollbar-thin" style={{ flex: "1 1 auto", maxHeight: 400, minHeight: 0, overflowY: "auto", padding: "6px 0" }}>
              {properties.length === 0 ? (
                <div style={{ textAlign: "center", padding: "30px 10px" }}>
                  <Home size={34} color="var(--color-border-light)" style={{ marginBottom: 12 }} />
                  <div style={{ fontSize: 14, color: "var(--color-primary)" }}>Non hai ancora nessun immobile.</div>
                </div>
              ) : properties.map((p) => {
                const t = propertyTotals(p.id);
                const PIcon = REALESTATE_ICON_MAP[p.icon_key] || Home;
                const weightPct = grandTotal.marketValue > 0 ? (t.marketValue / grandTotal.marketValue) * 100 : 0;
                const rPct = returnPct(t);
                return (
                  <div key={p.id} onClick={() => openProperty(p)} className="row-hover" style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 6px", cursor: "pointer" }}>
                    <div style={{ width: 38, height: 38, borderRadius: 9, background: "var(--color-bg-tint)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <PIcon size={17} color="var(--color-primary)" />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: t.hasData ? 4 : 0 }}>
                        <span style={{ fontSize: 16, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                        {t.hasData && <span className="mono" style={{ fontSize: 16, fontWeight: 600, flexShrink: 0, marginLeft: 8 }}><Money>{fmtEUR(t.marketValue)}</Money></span>}
                      </div>
                      {t.hasData ? (
                        <>
                          <div style={{ height: 4, background: "var(--color-bg-tint)", borderRadius: 2, overflow: "hidden", marginBottom: 4 }}>
                            <div className="bar-fill" style={{ height: "100%", width: `${weightPct}%`, background: "var(--color-primary)", borderRadius: 2 }} />
                          </div>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                            <span style={{ fontSize: 12, color: "var(--color-border-light)" }}>{weightPct.toFixed(0)}% del totale</span>
                            <span className="mono" style={{ fontSize: 12, fontWeight: 600, color: t.gain > 0 ? "var(--color-success)" : t.gain < 0 ? "var(--color-danger)" : "var(--color-border-light)" }}><Money>{t.gain > 0 ? "+" : ""}{fmtEUR(t.gain)}</Money>{rPct !== null && ` (${fmtPct(rPct)})`}</span>
                          </div>
                        </>
                      ) : (
                        <div style={{ fontSize: 12.5, color: "var(--color-border-light)" }}>Non esisteva ancora in questo mese</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {addingProperty && (
              <>
                <div onClick={() => { setAddingProperty(false); setNewPropertyName(""); setNewPropertyIcon("Home"); setPropertyError(""); }} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in scrollbar-thin" style={{ position: "fixed", left: 20, right: 20, bottom: 24 + kbOffset, maxWidth: 520, margin: "0 auto", maxHeight: "75dvh", overflowY: "auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Nuovo immobile</div>
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Nome immobile</div>
                  <input type="text" placeholder="Es. Appartamento Milano" value={newPropertyName} onChange={(e) => { setNewPropertyName(e.target.value); setPropertyError(""); }} autoFocus style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
                  <div style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 8 }}>Icona</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
                    {REALESTATE_ICON_CHOICES.map(({ key, icon: IconComp }) => (
                      <button type="button" key={key} onClick={() => setNewPropertyIcon(key)} aria-label={key} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, cursor: "pointer", border: newPropertyIcon === key ? "1.5px solid var(--color-primary)" : "1px solid var(--color-border)", background: newPropertyIcon === key ? "var(--color-bg-tint)" : "#FFFFFF" }}>
                        <IconComp size={19} color={newPropertyIcon === key ? "var(--color-primary)" : "var(--color-primary)"} />
                      </button>
                    ))}
                  </div>
                  {propertyError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{propertyError}</div>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setAddingProperty(false); setNewPropertyName(""); setNewPropertyIcon("Home"); setPropertyError(""); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                    <button onClick={addProperty} disabled={propertyBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: propertyBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: propertyBusy ? "default" : "pointer" }}>Crea</button>
                  </div>
                </div>
              </>
            )}
            {!addingProperty && (
              <button onClick={() => setAddingProperty(true)} style={{ marginTop: 12, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "11px 0", borderRadius: 8, border: "1px dashed var(--color-primary)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>
                <Plus size={16} /> Nuovo immobile
              </button>
            )}

            {removalProperty && (
              <>
                <div onClick={() => setRemovalProperty(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 39 }} />
                <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 40 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Eliminare "{removalProperty.name}"?</div>
                  <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16 }}>Verranno eliminati anche tutti i valori registrati per questa voce. L'operazione non è reversibile.</div>
                  <button onClick={deleteProperty} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
                  <button onClick={() => setRemovalProperty(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
                </div>
              </>
            )}
          </>
        ) : (
          <>
            <div className="scrollbar-thin" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 0" }}>
              <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 10 }}>Aggiungi valore mensile</div>
              <form onSubmit={addValuation} style={{ padding: 12, background: "var(--color-bg-tint)", borderRadius: 10, border: "1px solid var(--color-border)", marginBottom: 20 }}>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Mese</div>
                    <input type="month" value={valForm.value_date} onChange={(e) => setValForm({ ...valForm, value_date: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF" }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Valore attuale</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.market_value} onChange={(e) => setValForm({ ...valForm, market_value: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Costo storico</div>
                    <input type="text" inputMode="decimal" placeholder="0,00 €" value={valForm.cost_basis} onChange={(e) => setValForm({ ...valForm, cost_basis: e.target.value })} className="mono" style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, background: "#FFFFFF" }} />
                  </div>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div onClick={() => { const next = !valForm.carryForward; setValForm({ ...valForm, carryForward: next, carryUntil: next ? valForm.value_date : "" }); }} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: valForm.carryForward ? "1.5px solid var(--color-primary)" : "1.5px solid var(--color-border)", background: valForm.carryForward ? "var(--color-primary)" : "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {valForm.carryForward && <Check size={12} color="#FFFFFF" />}
                    </div>
                    <span style={{ fontSize: 13.5, color: "var(--color-heading)" }}>Porta avanti questo valore fino a...</span>
                  </div>
                  {valForm.carryForward && (
                    <div className="fade-in" style={{ marginTop: 8 }}>
                      <input type="month" value={valForm.carryUntil} min={valForm.value_date} onChange={(e) => setValForm({ ...valForm, carryUntil: e.target.value })} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "9px 10px", borderRadius: 8, border: "1px solid var(--color-border)", fontSize: 15, color: "var(--color-heading)", background: "#FFFFFF" }} />
                      <div style={{ fontSize: 11.5, color: "var(--color-primary)", marginTop: 6 }}>Stesso valore di mercato e costo storico ripetuto ogni mese fino a quello scelto (incluso). Potrai comunque modificarlo in un mese specifico in seguito.</div>
                    </div>
                  )}

function buildCashflowChain(settings, entriesMap, yearCursor) {
  const result = {};
  if (!settings) return result;
  const keys = Object.keys(entriesMap);
  const openIdx = monthKeyToIdx(settings.monthKey);
  const todayIdx = (() => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); })();
  const lastEntryIdx = keys.length ? Math.max(...keys.map(monthKeyToIdx)) : openIdx;
  const endIdx = Math.max(lastEntryIdx, yearCursor * 12 + 11, todayIdx);
  let prevBalance = settings.balance;
  for (let i = openIdx + 1; i <= endIdx; i++) {
    const k = monthKeyFromIdx(i);
    const entry = entriesMap[k];
    if (!entry) {
      result[k] = { hasEntry: false, bankBalance: null };
      prevBalance = null;
      continue;
    }
    let bankBalance;
    if (entry.manual_override && entry.bank_balance !== null) {
      bankBalance = entry.bank_balance;
    } else if (prevBalance !== null) {
      bankBalance = prevBalance + entry.income - entry.investments - entry.expenses;
    } else {
      bankBalance = null;
    }
    result[k] = { hasEntry: true, income: entry.income, investments: entry.investments, expenses: entry.expenses, manualOverride: !!entry.manual_override, bankBalance };
    prevBalance = bankBalance;
  }
  return result;
}

function cashflowDerived(income, investments, expenses) {
  const netIncome = income - investments - expenses;
  const saving = income - expenses;
  const savingRate = income > 0 ? (saving / income) * 100 : null;
  return { netIncome, saving, savingRate };
}

function CashflowApp({ session, onBack }) {

  const [rowBusy, setRowBusy] = useState(false);
  const [confirmOverride, setConfirmOverride] = useState(false);
  const [removalMonthKey, setRemovalMonthKey] = useState(null);
  const [cfCarryForward, setCfCarryForward] = useState(false);
  const [cfCarryUntil, setCfCarryUntil] = useState("");

  const [cfOverwriteConfirm, setCfOverwriteConfirm] = useState(false);
  const [cfConflictCount, setCfConflictCount] = useState(0);

  useEffect(() => {
    (async () => {
      const { data: accs, error: accErr } = await supabase.from("cashflow_accounts").select("*").order("created_at", { ascending: true });
      const { data: st, error: stErr } = await supabase.from("cashflow_settings").select("*");
      const { data: en, error: enErr } = await supabase.from("cashflow_entries").select("*").order("value_date", { ascending: true });
      setAccounts(!accErr && accs ? accs : []);
      setSettingsRows(!stErr && st ? st.map((s) => ({ id: s.id, account_id: s.account_id, balance: Number(s.opening_balance), monthKey: fullDateToMonth(s.opening_date) })) : []);
      setEntries(!enErr && en ? en.map((e) => ({ ...e, income: Number(e.income), investments: Number(e.investments), expenses: Number(e.expenses), bank_balance: e.bank_balance === null ? null : Number(e.bank_balance) })) : []);
      setLoaded(true);
    })();
  }, []);

  const settingsByAccount = useMemo(() => {
    const m = {};
    settingsRows.forEach((s) => { m[s.account_id] = s; });
    return m;
  }, [settingsRows]);

  const entriesByAccount = useMemo(() => {
    const m = {};
    entries.forEach((e) => {
      if (!m[e.account_id]) m[e.account_id] = {};
      m[e.account_id][fullDateToMonth(e.value_date)] = e;
    });
    return m;
  }, [entries]);

  const chainsByAccount = useMemo(() => {
    const m = {};
    accounts.forEach((acc) => {
      const settings = settingsByAccount[acc.id];
      if (settings) m[acc.id] = buildCashflowChain(settings, entriesByAccount[acc.id] || {}, yearCursor);
    });
    return m;
  }, [accounts, settingsByAccount, entriesByAccount, yearCursor]);

  const settings = activeAccountId !== "all" ? settingsByAccount[activeAccountId] : null;
  const entriesMap = activeAccountId !== "all" ? (entriesByAccount[activeAccountId] || {}) : {};
  const chain = activeAccountId !== "all" ? (chainsByAccount[activeAccountId] || {}) : {};

  const getPrevBalance = (monthKey) => {
    if (!settings) return null;
    const idx = monthKeyToIdx(monthKey);
    const openIdx = monthKeyToIdx(settings.monthKey);
    if (idx - 1 === openIdx) return settings.balance;
    if (idx - 1 < openIdx) return null;
    const prevKey = monthKeyFromIdx(idx - 1);
    return chain[prevKey] ? (chain[prevKey].bankBalance ?? null) : null;
  };

  const yearRows = useMemo(() => {
    const rows = [];
    if (activeAccountId === "all") {
      for (let m = 0; m < 12; m++) {
        const key = `${yearCursor}-${String(m + 1).padStart(2, "0")}`;
        let income = 0, investments = 0, expenses = 0, bankBalance = 0, hasEntry = false;
        accounts.forEach((acc) => {
          const c = chainsByAccount[acc.id];
          const r = c ? c[key] : null;
          if (r && r.hasEntry) {
            hasEntry = true;
            income += r.income; investments += r.investments; expenses += r.expenses;
            bankBalance += (r.bankBalance ?? 0);
          }
        });
        rows.push({ key, monthIdx: m, hasEntry, income, investments, expenses, bankBalance: hasEntry ? bankBalance : null, manualOverride: false, ...(hasEntry ? cashflowDerived(income, investments, expenses) : { netIncome: null, saving: null, savingRate: null }) });
      }
    } else {
      for (let m = 0; m < 12; m++) {
        const key = `${yearCursor}-${String(m + 1).padStart(2, "0")}`;
        const base = { key, monthIdx: m, hasEntry: false, bankBalance: null, ...(chain[key] || {}) };
        rows.push({ ...base, ...(base.hasEntry ? cashflowDerived(base.income, base.investments, base.expenses) : { netIncome: null, saving: null, savingRate: null }) });
      }
    }
    return rows;
  }, [activeAccountId, chain, chainsByAccount, accounts, yearCursor]);

  const yearTotals = useMemo(() => {
    let income = 0, investments = 0, expenses = 0, finalBalance = null;
    yearRows.forEach((r) => {
      if (r.hasEntry) { income += r.income; investments += r.investments; expenses += r.expenses; }
      if (r.bankBalance !== null && r.bankBalance !== undefined) finalBalance = r.bankBalance;
    });
    const derived = cashflowDerived(income, investments, expenses);
    return { income, investments, expenses, finalBalance, ...derived };
  }, [yearRows]);

  const annualRows = useMemo(() => {
    let minYear = null;
    const nowYear = new Date().getFullYear();
    let maxYear = nowYear;
    if (activeAccountId === "all") {
      accounts.forEach((acc) => {
        const s = settingsByAccount[acc.id];
        if (s) { const y = Number(s.monthKey.split("-")[0]); if (minYear === null || y < minYear) minYear = y; }
      });
    } else if (settings) {
      minYear = Number(settings.monthKey.split("-")[0]);
    }
    entries.forEach((e) => { const y = Number(fullDateToMonth(e.value_date).split("-")[0]); if (y > maxYear) maxYear = y; });
    if (minYear === null) return [];
    const rows = [];
    for (let y = minYear; y <= maxYear; y++) {
      let income = 0, investments = 0, expenses = 0, finalBalance = null, any = false;
      if (activeAccountId === "all") {
        let sumBalance = 0;
        accounts.forEach((acc) => {
          const c = chainsByAccount[acc.id];
          if (!c) return;
          for (let m = 0; m < 12; m++) {
            const key = `${y}-${String(m + 1).padStart(2, "0")}`;
            const r = c[key];
            if (r && r.hasEntry) { any = true; income += r.income; investments += r.investments; expenses += r.expenses; }
          }
          let accBalance = null;
          for (let m = 0; m < 12; m++) {
            const key = `${y}-${String(m + 1).padStart(2, "0")}`;
            const r = c[key];
            if (r && r.bankBalance !== null && r.bankBalance !== undefined) accBalance = r.bankBalance;
          }
          if (accBalance !== null) sumBalance += accBalance;
        });
        finalBalance = any ? sumBalance : null;
      } else {
        const c = chainsByAccount[activeAccountId] || {};
        for (let m = 0; m < 12; m++) {
          const key = `${y}-${String(m + 1).padStart(2, "0")}`;
          const r = c[key];
          if (r && r.hasEntry) { any = true; income += r.income; investments += r.investments; expenses += r.expenses; }
          if (r && r.bankBalance !== null && r.bankBalance !== undefined) finalBalance = r.bankBalance;
        }
      }
      rows.push({ year: y, income, investments, expenses, finalBalance, hasData: any, ...(any ? cashflowDerived(income, investments, expenses) : { netIncome: null, saving: null, savingRate: null }) });
    }
    return rows.reverse();
  }, [accounts, settingsByAccount, settings, activeAccountId, chainsByAccount, entries]);


  const openingYear = settings ? Number(settings.monthKey.split("-")[0]) : null;
  let openingInfo = null;
  if (activeAccountId !== "all" && settings) {
    if (yearCursor === openingYear) {
      openingInfo = { key: settings.monthKey, value: settings.balance, isOpening: true, missing: false };
    } else if (yearCursor > openingYear) {
      const prevDecKey = `${yearCursor - 1}-12`;
      const val = prevDecKey === settings.monthKey ? settings.balance : (chain[prevDecKey] ? (chain[prevDecKey].bankBalance ?? null) : null);
      openingInfo = { key: prevDecKey, value: val, isOpening: false, missing: val === null };
    }
  }

  const saveOnboarding = async () => {
    if (obBusy) return;
    const bal = parseFloat(String(obBalance).replace(",", "."));
    if (!obMonth) { setObError("Seleziona un mese."); return; }
    if (isNaN(bal)) { setObError("Inserisci un saldo valido."); return; }
    setObBusy(true);
    const { data, error: insErr } = await supabase.from("cashflow_settings").insert({ user_id: userId, account_id: pendingAccountId, opening_balance: bal, opening_date: monthDateToFull(obMonth) }).select().single();
    setObBusy(false);
    if (insErr) { setObError(insErr.message); return; }
    setSettingsRows((prev) => [...prev, { id: data.id, account_id: data.account_id, balance: Number(data.opening_balance), monthKey: fullDateToMonth(data.opening_date) }]);
    setActiveAccountId(pendingAccountId);
    setAddAccountStep(null);
    setPendingAccountId(null);
  };

  const openEditOpening = () => {
    setEditOpBalance(String(settings.balance).replace(".", ","));
    setEditOpMonth(settings.monthKey);
    setEditOpError("");
    setEditingOpening(true);
  };

  const saveEditOpening = async () => {
    if (editOpBusy) return;
    const bal = parseFloat(String(editOpBalance).replace(",", "."));
    if (!editOpMonth) { setEditOpError("Seleziona un mese."); return; }
    if (isNaN(bal)) { setEditOpError("Inserisci un saldo valido."); return; }
    setEditOpBusy(true);
    const { data, error: updErr } = await supabase.from("cashflow_settings").update({ opening_balance: bal, opening_date: monthDateToFull(editOpMonth) }).eq("id", settings.id).select().single();
    setEditOpBusy(false);
    if (updErr) { setEditOpError(updErr.message); return; }
    setSettingsRows((prev) => prev.map((s) => (s.id === settings.id ? { id: data.id, account_id: data.account_id, balance: Number(data.opening_balance), monthKey: fullDateToMonth(data.opening_date) } : s)));
    setEditingOpening(false);
  };

  const openRow = (monthIdx) => {
    if (activeAccountId === "all" || !settings) return;
    const key = `${yearCursor}-${String(monthIdx + 1).padStart(2, "0")}`;
    const idx = yearCursor * 12 + monthIdx;
    const openIdx = monthKeyToIdx(settings.monthKey);
    if (idx <= openIdx) return;
    const entry = entriesMap[key];
    setEditingMonthKey(key);
    setRowForm({
      income: entry ? String(entry.income).replace(".", ",") : "",
      investments: entry ? String(entry.investments).replace(".", ",") : "",
      expenses: entry ? String(entry.expenses).replace(".", ",") : "",
    });
    const prevBal = getPrevBalance(key);
    if (entry && entry.manual_override) {
      setRowMode("manual");
      setManualValue(entry.bank_balance != null ? String(entry.bank_balance).replace(".", ",") : "");
    } else if (prevBal !== null) {
      setRowMode("auto");
      setManualValue("");
    } else {
      setRowMode("manual");
      setManualValue("");
    }
    setRowError("");
    setConfirmOverride(false);
    setCfCarryForward(false);
    setCfCarryUntil("");
    setCfOverwriteExisting(false);
    setCfOverwriteConfirm(false);
  };

  const prevBalanceForEditing = editingMonthKey ? getPrevBalance(editingMonthKey) : null;
  const incomeNum = parseFloat(String(rowForm.income).replace(",", ".")) || 0;
  const investmentsNum = parseFloat(String(rowForm.investments).replace(",", ".")) || 0;
  const expensesNum = parseFloat(String(rowForm.expenses).replace(",", ".")) || 0;
  const liveComputed = prevBalanceForEditing !== null ? prevBalanceForEditing + incomeNum - investmentsNum - expensesNum : null;

  const requestManualOverride = () => setConfirmOverride(true);
  const confirmManualOverride = () => {
    setManualValue(liveComputed !== null ? String(liveComputed.toFixed(2)).replace(".", ",") : "");
    setRowMode("manual");
    setConfirmOverride(false);
  };
  const revertToAuto = () => { setRowMode("auto"); setManualValue(""); };

  const saveRow = async () => {
    if (rowBusy) return;
    let manual_override = false;
    let bank_balance = null;
    if (!cfCarryForward && rowMode === "manual") {
      const mv = parseFloat(String(manualValue).replace(",", "."));
      if (isNaN(mv)) { setRowError("Inserisci un saldo valido."); return; }
      manual_override = true;
      bank_balance = mv;
    }
    if (cfCarryForward) {
      if (!cfCarryUntil) { setRowError("Seleziona fino a quale mese portare avanti i valori."); return; }
      if (monthKeyToIdx(cfCarryUntil) < monthKeyToIdx(editingMonthKey)) { setRowError("Il mese finale deve essere uguale o successivo al mese corrente."); return; }
      const startIdx = monthKeyToIdx(editingMonthKey);
      const endIdx = monthKeyToIdx(cfCarryUntil);
      const targetKeys = [];
      for (let idx = startIdx; idx <= endIdx; idx++) targetKeys.push(monthKeyFromIdx(idx));
      const conflictKeys = targetKeys.filter((mk) => mk !== editingMonthKey && entriesMap[mk]);
      if (conflictKeys.length > 0 && !cfOverwriteExisting) {
        setRowError(`${conflictKeys.length} ${conflictKeys.length === 1 ? "mese ha già dei valori inseriti" : "mesi hanno già dei valori inseriti"}. Attiva "Sovrascrivi mesi che hanno già dei valori" per procedere, oppure riduci l'intervallo.`);
        return;
      }
      if (conflictKeys.length > 0 && cfOverwriteExisting && !cfOverwriteConfirm) {
        setCfConflictCount(conflictKeys.length);
        setCfOverwriteConfirm(true);
        return;
      }
      setRowError("");
      setRowBusy(true);
      const results = await Promise.all(targetKeys.map((mk) => {
        const ex = entriesMap[mk];
        const p = { user_id: userId, account_id: activeAccountId, value_date: monthDateToFull(mk), income: incomeNum, investments: investmentsNum, expenses: expensesNum, manual_override: false, bank_balance: null };
        return ex ? supabase.from("cashflow_entries").update(p).eq("id", ex.id).select().single() : supabase.from("cashflow_entries").insert(p).select().single();
      }));
      setRowBusy(false);
      const failed = results.find((r) => r.error);
      if (failed) { setRowError(failed.error.message); return; }
      const normalized = results.map((r) => ({ ...r.data, income: Number(r.data.income), investments: Number(r.data.investments), expenses: Number(r.data.expenses), bank_balance: r.data.bank_balance === null ? null : Number(r.data.bank_balance) }));
      setEntries((prev) => {
        const byId = new Map(prev.map((e) => [e.id, e]));
        normalized.forEach((n) => byId.set(n.id, n));
        return Array.from(byId.values());
      });
      setEditingMonthKey(null);
      setCfOverwriteConfirm(false);
      return;
    }
    setRowBusy(true);
    const existing = entriesMap[editingMonthKey];
    const payload = { user_id: userId, account_id: activeAccountId, value_date: monthDateToFull(editingMonthKey), income: incomeNum, investments: investmentsNum, expenses: expensesNum, manual_override, bank_balance };
    let error, data;
    if (existing) {
      const res = await supabase.from("cashflow_entries").update(payload).eq("id", existing.id).select().single();
      error = res.error; data = res.data;
    } else {
      const res = await supabase.from("cashflow_entries").insert(payload).select().single();
      error = res.error; data = res.data;
    }
    setRowBusy(false);
    if (error) { setRowError(error.message); return; }
    const normalized = { ...data, income: Number(data.income), investments: Number(data.investments), expenses: Number(data.expenses), bank_balance: data.bank_balance === null ? null : Number(data.bank_balance) };
    setEntries((prev) => existing ? prev.map((e) => (e.id === existing.id ? normalized : e)) : [...prev, normalized]);
    setEditingMonthKey(null);
  };

  const deleteRow = async () => {
    const key = removalMonthKey;
    const existing = entriesMap[key];
    if (!existing) { setRemovalMonthKey(null); return; }
    const { error: delErr } = await supabase.from("cashflow_entries").delete().eq("id", existing.id);
    if (!delErr) setEntries((prev) => prev.filter((e) => e.id !== existing.id));
    else { setSaveState("error"); setLastErrorMsg(delErr.message); }
    setRemovalMonthKey(null);
    setEditingMonthKey(null);
  };

  if (!loaded) {
    return (
      <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <div className="spinner" style={{ width: 30, height: 30, borderRadius: "50%", border: "3px solid var(--color-border)", borderTopColor: "var(--color-primary)" }} />
        <div style={{ fontSize: 13.5, color: "var(--color-primary)" }}>Sto caricando i flussi di cassa…</div>
      </div>
    );
  }

  const todayIdx = (() => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); })();
  const fmtSavingRate = (p) => `${p > 0 ? "+" : ""}${p.toFixed(1)}%`;

  return (
    <div style={{ height: "100dvh", width: "100%", background: "#FFFFFF", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 56, background: "var(--color-primary)", display: "flex", alignItems: "center", padding: "0 8px 0 4px", flexShrink: 0 }}>
        <button onClick={onBack} aria-label="Torna indietro" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "#FFFFFF", display: "flex", alignItems: "center" }}>
          <ArrowLeft size={22} />
        </button>
        <span style={{ color: "#FFFFFF", fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>Flussi di cassa</span>
      </div>

      <div style={{ maxWidth: 560, width: "100%", margin: "0 auto", padding: "14px 16px", display: "flex", flexDirection: "column", minHeight: 0, flex: 1, boxSizing: "border-box" }}>
        {accounts.length === 0 ? (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "20px 10px" }}>
            <ArrowLeftRight size={38} color="var(--color-border-light)" style={{ marginBottom: 14 }} />
            <div style={{ fontSize: 16, fontWeight: 600, color: "var(--color-heading)", marginBottom: 6 }}>Crea il tuo primo conto</div>
            <div style={{ fontSize: 13.5, color: "var(--color-primary)", marginBottom: 18, maxWidth: 280 }}>I conti si creano da Profilo → Gestione conti, e vengono usati sia qui che in Le mie spese.</div>
            <button onClick={onBack} style={{ padding: "11px 22px", borderRadius: 8, border: "none", background: "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
              Torna alla home
            </button>
          </div>
        ) : (
          <>
            <div className="no-scrollbar" style={{ display: "flex", gap: 6, marginBottom: 10, flexShrink: 0, overflowX: "auto" }}>
              <button onClick={() => setActiveAccountId("all")} style={{ padding: "6px 14px", borderRadius: 999, border: activeAccountId === "all" ? "1px solid var(--color-primary)" : "1.5px solid var(--color-heading)", background: activeAccountId === "all" ? "var(--color-primary)" : "#FFFFFF", color: activeAccountId === "all" ? "#FFFFFF" : "var(--color-heading)", fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>Totale</button>
              {accounts.map((a) => (
                <button key={a.id} onClick={() => setActiveAccountId(a.id)} style={{ padding: "6px 12px", borderRadius: 999, border: activeAccountId === a.id ? "1px solid var(--color-primary)" : "1px solid var(--color-border)", background: activeAccountId === a.id ? "var(--color-primary)" : "#FFFFFF", color: activeAccountId === a.id ? "#FFFFFF" : "var(--color-primary)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{a.name}</button>
              ))}
            </div>

            {activeAccountId !== "all" && !settings ? (
              <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "20px 10px" }}>
                <div style={{ fontSize: 14, color: "var(--color-primary)", marginBottom: 14 }}>Manca ancora il saldo di apertura per questo conto.</div>
                <button onClick={() => { setPendingAccountId(activeAccountId); setPendingAccountName(accounts.find((a) => a.id === activeAccountId)?.name || ""); setObBalance(""); setObMonth(currentMonthISO()); setObError(""); setAddAccountStep("balance"); }} style={{ padding: "10px 18px", borderRadius: 8, border: "none", background: "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                  Imposta saldo di apertura
                </button>
              </div>
            ) : (
              <>
                <div style={{ display: "flex", justifyContent: "center", padding: "0 0 10px", flexShrink: 0 }}>
                  <div style={{ display: "flex", background: "var(--color-bg-tint)", borderRadius: 10, padding: 3, width: "100%", maxWidth: 280 }}>
                    <button onClick={() => setViewMode("monthly")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: viewMode === "monthly" ? "#FFFFFF" : "transparent", color: viewMode === "monthly" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: viewMode === "monthly" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
                      Mensile
                    </button>
                    <button onClick={() => setViewMode("annual")} style={{ flex: 1, padding: "5px 0", borderRadius: 8, border: "none", background: viewMode === "annual" ? "#FFFFFF" : "transparent", color: viewMode === "annual" ? "var(--color-primary)" : "var(--color-primary)", fontSize: 13.5, fontWeight: 600, cursor: "pointer", boxShadow: viewMode === "annual" ? "0 1px 4px rgba(5,91,101,0.1)" : "none" }}>
                      Annuale
                    </button>
                  </div>
                </div>

                {viewMode === "monthly" ? (
                  <>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
                  <button onClick={() => setYearCursor((y) => y - 1)} aria-label="Anno precedente" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)" }}><ChevronLeft size={28} /></button>
                  <div style={{ fontSize: 24, fontWeight: 700, color: "var(--color-heading)" }}>{yearCursor}</div>
                  <button onClick={() => setYearCursor((y) => y + 1)} aria-label="Anno successivo" style={{ background: "none", border: "none", cursor: "pointer", padding: 8, color: "var(--color-heading)" }}><ChevronRight size={28} /></button>
                </div>

                {activeAccountId === "all" ? (
                  <div style={{ textAlign: "center", fontSize: 12.5, color: "var(--color-border-light)", padding: "2px 0 12px", borderBottom: "1px solid var(--color-border)", marginBottom: 10, flexShrink: 0 }}>
                    Vista aggregata di tutti i conti — seleziona un conto per modificare i dati
                  </div>
                ) : openingInfo ? (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, flexWrap: "wrap", fontSize: 12.5, color: openingInfo.missing ? "var(--color-warning)" : "var(--color-primary)", padding: "2px 0 12px", borderBottom: "1px solid var(--color-border)", marginBottom: 10, flexShrink: 0 }}>
                    {openingInfo.missing && <AlertTriangle size={13} style={{ flexShrink: 0 }} />}
                    {openingInfo.missing ? (
                      <span>Saldo di <span style={{ textTransform: "capitalize" }}>{fmtMonthYear(openingInfo.key)}</span> non ancora disponibile</span>
                    ) : (
                      <span>Si parte da <span style={{ textTransform: "capitalize" }}>{fmtMonthYear(openingInfo.key)}</span>: <b className="mono" style={{ color: "var(--color-heading)" }}><Money>{fmtEUR(openingInfo.value)}</Money></b></span>
                    )}
                    {openingInfo.isOpening && (
                      <button onClick={() => setConfirmEditOpening(true)} aria-label="Modifica saldo di apertura" style={{ background: "none", border: "none", color: "var(--color-primary)", cursor: "pointer", display: "flex", alignItems: "center", padding: 2 }}>
                        <Pencil size={13} />
                      </button>
                    )}
                  </div>
                ) : (
                  <div style={{ textAlign: "center", fontSize: 12.5, color: "var(--color-border-light)", padding: "2px 0 12px", borderBottom: "1px solid var(--color-border)", marginBottom: 10, flexShrink: 0 }}>
                    Il tracciamento inizia da <span style={{ textTransform: "capitalize" }}>{fmtMonthYear(settings.monthKey)}</span>.
                  </div>
                )}

                <div style={{ position: "relative", flex: 1, minHeight: 0 }}>
                <div className="scrollbar-thin" style={{ height: "100%", overflowY: "auto", overflowX: "auto" }}>
                  <div style={{ width: 514 }}>
                    <div style={{ display: "flex", alignItems: "center", padding: "0 4px 6px" }}>
                      <div style={{ width: 42, flexShrink: 0, position: "sticky", left: 0, background: "#FFFFFF", zIndex: 2 }} />
                      <div style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Entrate</div>
                      <div style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Invest.</div>
                      <div style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Spese</div>
                      <div style={{ width: 72, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Net Inc.</div>
                      <div style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Saving</div>
                      <div style={{ width: 60, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Sav. %</div>
                      <div style={{ width: 76, flexShrink: 0, textAlign: "right", fontSize: 9, letterSpacing: "0.03em", textTransform: "uppercase", color: "var(--color-border-light)", fontWeight: 600 }}>Saldo</div>
                    </div>

                    {yearRows.map((r) => {
                      const idx = yearCursor * 12 + r.monthIdx;
                      const openIdx = settings ? monthKeyToIdx(settings.monthKey) : -Infinity;
                      const disabled = activeAccountId === "all" || idx <= openIdx;
                      const isFuture = idx > todayIdx;
                      const rowOpacity = (activeAccountId !== "all" && idx <= openIdx) ? 0.3 : (isFuture ? 0.55 : 1);
                      return (
                        <div key={r.key} onClick={() => !disabled && openRow(r.monthIdx)} className={disabled ? "" : "row-hover"} style={{ display: "flex", alignItems: "center", padding: "8px 4px", borderBottom: "1px dotted var(--color-bg-tint)", cursor: disabled ? "default" : "pointer" }}>
                          <div style={{ width: 42, flexShrink: 0, fontSize: 12, color: "var(--color-primary)", textTransform: "capitalize", position: "sticky", left: 0, background: "#FFFFFF", zIndex: 1, opacity: rowOpacity }}>{MESI[r.monthIdx].slice(0, 3)}</div>
                          <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, color: "var(--color-success)", opacity: rowOpacity }}>{r.hasEntry ? <Money>{fmtEUR(r.income)}</Money> : "—"}</div>
                          <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, color: "var(--color-primary)", opacity: rowOpacity }}>{r.hasEntry ? <Money>{fmtEUR(r.investments)}</Money> : "—"}</div>
                          <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, color: "var(--color-danger)", opacity: rowOpacity }}>{r.hasEntry ? <Money>{fmtEUR(r.expenses)}</Money> : "—"}</div>
                          <div className="mono" style={{ width: 72, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 600, color: r.netIncome === null ? "var(--color-border-light)" : (r.netIncome >= 0 ? "var(--color-success)" : "var(--color-danger)"), opacity: rowOpacity }}>{r.netIncome !== null ? <Money>{fmtEUR(r.netIncome)}</Money> : "—"}</div>
                          <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 600, color: r.saving === null ? "var(--color-border-light)" : (r.saving >= 0 ? "var(--color-success)" : "var(--color-danger)"), opacity: rowOpacity }}>{r.saving !== null ? <Money>{fmtEUR(r.saving)}</Money> : "—"}</div>
                          <div className="mono" style={{ width: 60, flexShrink: 0, textAlign: "right", fontSize: 10.5, fontWeight: 600, color: r.savingRate === null ? "var(--color-border-light)" : (r.savingRate >= 0 ? "var(--color-success)" : "var(--color-danger)"), opacity: rowOpacity }}>{r.savingRate !== null ? fmtSavingRate(r.savingRate) : "—"}</div>
                          <div className="mono" style={{ width: 76, flexShrink: 0, textAlign: "right", fontSize: 12.5, fontWeight: 700, color: "var(--color-heading)", opacity: rowOpacity }}>
                            {r.bankBalance !== null && r.bankBalance !== undefined ? <Money>{fmtEUR(r.bankBalance)}</Money> : <span style={{ color: "var(--color-border-light)", fontWeight: 400 }}>—</span>}
                            {r.manualOverride && <Pencil size={9} color="var(--color-warning)" style={{ marginLeft: 3, verticalAlign: "middle" }} />}
                          </div>
                        </div>
                      );
                    })}

                    <div style={{ display: "flex", alignItems: "center", padding: "10px 4px", marginTop: 6, background: "var(--color-bg-tint)", borderRadius: 8, border: "1px solid var(--color-border)" }}>
                      <div style={{ width: 42, flexShrink: 0, fontSize: 11.5, fontWeight: 700, color: "var(--color-heading)", position: "sticky", left: 0, background: "var(--color-bg-tint)", zIndex: 1 }}>Tot.</div>
                      <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 700, color: "var(--color-success)" }}><Money>{fmtEUR(yearTotals.income)}</Money></div>
                      <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 700, color: "var(--color-primary)" }}><Money>{fmtEUR(yearTotals.investments)}</Money></div>
                      <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 700, color: "var(--color-danger)" }}><Money>{fmtEUR(yearTotals.expenses)}</Money></div>
                      <div className="mono" style={{ width: 72, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 700, color: yearTotals.netIncome >= 0 ? "var(--color-success)" : "var(--color-danger)" }}><Money>{fmtEUR(yearTotals.netIncome)}</Money></div>
                      <div className="mono" style={{ width: 66, flexShrink: 0, textAlign: "right", fontSize: 11, fontWeight: 700, color: yearTotals.saving >= 0 ? "var(--color-success)" : "var(--color-danger)" }}><Money>{fmtEUR(yearTotals.saving)}</Money></div>

          </div>
        </>

      {removalMonthKey && (
        <>
          <div onClick={() => setRemovalMonthKey(null)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 43 }} />

            <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16, lineHeight: 1.5 }}>Entrate, investimenti, spese e saldo verranno rimossi. Se altri mesi successivi dipendono da questo saldo, torneranno "in attesa" finché non inserisci un nuovo dato. L'operazione non è reversibile.</div>
            <button onClick={deleteRow} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-danger)", background: "#FFFFFF", color: "var(--color-danger)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, elimina</button>
            <button onClick={() => setRemovalMonthKey(null)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
          </div>
        </>
      )}

      {confirmEditOpening && (
        <>
          <div onClick={() => setConfirmEditOpening(false)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 41 }} />

            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <AlertTriangle size={18} color="var(--color-warning)" />
              <div style={{ fontSize: 15, fontWeight: 600 }}>Modificare il saldo di apertura?</div>
            </div>
            <div style={{ fontSize: 13, color: "var(--color-primary)", marginBottom: 16, lineHeight: 1.5 }}>È il punto di partenza di tutta la serie: cambiandolo, tutti i saldi calcolati automaticamente dopo questo mese verranno ricalcolati.</div>
            <button onClick={() => { setConfirmEditOpening(false); openEditOpening(); }} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "1px solid var(--color-warning-border)", background: "var(--color-warning-bg)", color: "var(--color-warning)", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 8 }}>Sì, continua</button>
            <button onClick={() => setConfirmEditOpening(false)} style={{ width: "100%", padding: "11px 0", borderRadius: 8, border: "none", background: "var(--color-bg-tint)", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>

        </>

      {editingOpening && (
        <>
          <div onClick={() => setEditingOpening(false)} style={{ position: "fixed", inset: 0, background: "rgba(5,91,101,0.35)", zIndex: 41 }} />
          <div className="fade-in" style={{ position: "fixed", left: 20, right: 20, bottom: 24, maxWidth: 520, margin: "0 auto", background: "#FFFFFF", borderRadius: 14, padding: 18, boxShadow: "0 12px 32px rgba(5,91,101,0.22)", zIndex: 42 }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>Modifica saldo di apertura</div>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Mese di riferimento</div>
            <input type="month" value={editOpMonth} onChange={(e) => setEditOpMonth(e.target.value)} style={{ display: "block", width: "100%", minWidth: 0, WebkitAppearance: "none", appearance: "none", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 15, marginBottom: 14, background: "#FFFFFF" }} />
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-primary)", fontWeight: 600, marginBottom: 6 }}>Saldo a fine mese</div>
            <input type="text" inputMode="decimal" value={editOpBalance} onChange={(e) => { setEditOpBalance(e.target.value); setEditOpError(""); }} className="mono" style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid var(--color-border)", fontSize: 16, marginBottom: 14 }} />
            {editOpError && <div style={{ color: "var(--color-danger)", fontSize: 13, marginBottom: 8 }}>{editOpError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setEditingOpening(false)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid var(--color-border)", background: "#FFFFFF", color: "var(--color-primary)", fontSize: 14, cursor: "pointer" }}>Annulla</button>
              <button onClick={saveEditOpening} disabled={editOpBusy} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: editOpBusy ? "var(--color-border-light)" : "var(--color-heading)", color: "#FFFFFF", fontSize: 14, fontWeight: 600, cursor: editOpBusy ? "default" : "pointer" }}>Salva</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
